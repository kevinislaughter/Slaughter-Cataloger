        message: files.length ? null : { level: 'info', text: 'This folder has no CSV files yet. Start by adding a title.' } });
      store.setUnloaded(unloadedOf(read, built.state.files));
      store.load(built.state, { dirty: built.changed });
    } catch (e) { setUI({ busy: '', message: { level: 'error', text: 'Could not read the folder: ' + e.message } }); }
  }

  async function loadFiles(fileList) {
    if (waitForSave()) return;
    if (!owner || !(await confirmDiscard())) return;
    setUI({ busy: 'Reading files…' });
    try {
      const files = await ST.readFileList(fileList);
      const read = files.map(f => R.readFile(f.name, f.text, { lastModified: f.lastModified, encodingError: f.encodingError }));
      const built = R.buildLibrary(read);
      if (onlyOldFiles(built)) return;
      folder = null;
      diskSeen = new Map();
      setUI({ mode: 'files', folderName: '', report: built.report, needsConversion: built.needsConversion, needsReconnect: false, wrongFolder: '', restoredAt: 0, busy: '', message: null, download: null });
      store.setUnloaded(unloadedOf(read, built.state.files));       // a download under such a name would invite replacing that file
      store.load(built.state, { dirty: built.changed });
    } catch (e) { setUI({ busy: '', message: { level: 'error', text: 'Could not read the files: ' + e.message } }); }
  }

  // Start an empty library (in a folder when the browser allows it).
  async function newLibrary(slug, name, note, useFolder) {
    if (waitForSave()) return false;
    if (!owner || !(await confirmDiscard())) return false;
    let handle = null;
    if (useFolder) {
      try { handle = await ST.pickFolder(); } catch (e) { if (e && e.name === 'AbortError') return false; throw e; }
      const existing = (await ST.readFolder(handle)).filter(f => /^SCAT_/i.test(f.name));
      if (existing.length) { setUI({ message: { level: 'error', text: 'That folder already holds Slaughter Cataloger files. Use Open library folder instead, or pick an empty folder.' } }); return false; }
    }
    folder = handle;
    diskSeen = new Map();
    ST.resetSessionBackups();
    const st = SC.emptyState();
    st.library = Object.freeze({ slug, name, note: note || '' });
    store.setUnloaded([]);
    setUI({ mode: handle ? 'folder' : 'files', folderName: handle ? handle.name : '', report: [], needsReconnect: false, wrongFolder: '', restoredAt: 0, message: null, download: null });
    store.load(st);
    return true;
  }

  // Re-grant access to the remembered folder, then pick up anything changed on disk.
  async function reconnect() {
    if (waitForSave()) return;
    if (!owner) return;
    if (!folder) { setUI({ message: { level: 'error', text: 'The folder is no longer remembered. Use Choose folder to point to it again; your work here is kept.' } }); return; }
    const ok = await ST.hasPermission(folder, true).catch(() => false);
    if (!ok) { setUI({ message: { level: 'error', text: 'Access to ' + ui.folderName + ' was not granted. Your work is still here; you can grant access later.' } }); return; }
    setUI({ needsReconnect: false });
    await syncFromFolder(true);
  }
  // Point the working copy at a folder again (the remembered one is gone, or holds another
  // library). Unlike Open library folder, this keeps your unsaved work.
  async function chooseFolder() {
    if (waitForSave()) return;
    if (!owner) return;
    let handle;
    try { handle = await ST.pickFolder(); } catch (e) { if (e && e.name === 'AbortError') return; throw e; }
    const prev = { folder, folderName: ui.folderName, mode: ui.mode, wrongFolder: ui.wrongFolder, needsReconnect: ui.needsReconnect };
    folder = handle;
    setUI({ folderName: handle.name, mode: 'folder' });
    if (!(await syncFromFolder(true, true))) {
      folder = prev.folder;
      setUI({ folderName: prev.folderName, mode: prev.mode, wrongFolder: prev.wrongFolder, needsReconnect: prev.needsReconnect });
      return;
    }
    ST.resetSessionBackups();
    setUI({ needsReconnect: false, wrongFolder: '' });
    compact();
  }

  // Files read (from the folder, or picked) that did not end up in the library: name → why.
  // Nothing new is written under those names (store.blocked, storage mustNotExist).
  const EMPTY = R.hashText('');
  function unloadedOf(read, files, previous) {
    const why = new Map();
    read = read.filter(r => r.hash !== EMPTY);                 // an empty file holds nothing to protect
    read.forEach(r => { if (!r.ok) why.set(r.name, r.error); });
    (ui.report || []).forEach(n => { if (n.file && !why.has(n.file) && (n.level === 'skip' || n.level === 'error')) why.set(n.file, n.msg); });
    const m = new Map();
    read.forEach(r => { if (!files.has(r.name)) m.set(r.name, why.get(r.name) || (previous && previous.get(r.name)) || 'not loaded'); });
    return m;
  }

  // The libraries named by the CSVs in a folder.
  const librariesIn = results => Array.from(new Set(results.filter(r => r.ok && r.librarySlug).map(r => r.librarySlug)));

  /* Bring the working copy up to date with the folder.
     - Files you have not changed are read again if they changed on disk.
     - Files you have changed keep your version (saving backs up the disk version first); if the
       disk already holds exactly your version (a save interrupted after writing it), it counts as saved.
     - Files new in the folder are read.
     - Files no longer in the folder, or that no longer read cleanly, keep their records here and
       are flagged; a missing file is not written again until it is back or you remove it.
     - A folder holding another library is not read at all. Returns false then (or on an error). */
  async function syncFromFolder(announce, trying) {
    setUI({ busy: 'Checking ' + ui.folderName + ' for changes…' });
    try {
      const disk = await ST.readFolder(folder);
      const st = store.state, dirty = store.dirty;
      const read = disk.map(d => R.readFile(d.name, d.text, { lastModified: d.lastModified, encodingError: d.encodingError }));
      const libs = librariesIn(read);
      if (st.library.slug && libs.length && libs.indexOf(st.library.slug) === -1) {
        const text = 'The folder ' + ui.folderName + ' holds the library ' + libs.join(', ') + ', not ' + st.library.slug + '. Nothing was read from it, and nothing will be saved into it. Your work here is kept; use Choose folder to point to the folder of ' + (st.library.name || st.library.slug) + '.';
        setUI(trying ? { busy: '', message: { level: 'error', text } } : { busy: '', needsReconnect: true, wrongFolder: text, message: { level: 'error', text } });
        return false;
      }
      const notes = [], results = [], alreadySaved = [], unreadable = new Map();
      const diskNames = new Set(disk.map(d => d.name));
      let differs = false;
      read.forEach(r => {
        const name = r.name, f = st.files.get(name);
        if (f && dirty.has(name)) {
          if (f.isNew && !f.hash) {
            // Made here and not saved yet, and now a file of that name is in the folder: written by
            // a save interrupted before it could be marked, an empty file left by a first write that
            // failed (written over next time), or another file altogether.
            if (r.hash === R.hashText(R.writeFile(st, name))) alreadySaved.push({ name, hash: r.hash });
            else if (r.hash !== EMPTY) notes.push({ level: 'warn', file: name, msg: 'A file of this name has appeared in the folder. The new file made here will not be written over it; move or rename the one in the folder, then save.' });
          } else if (f.hash && r.hash !== f.hash) {
            if (r.hash === R.hashText(R.writeFile(st, name))) alreadySaved.push({ name, hash: r.hash });
            else notes.push({ level: 'warn', file: name, msg: 'Changed on disk since it was read. Your unsaved changes are kept; saving backs up the disk version first.' });
          }
          if (f.missing) { notes.push({ level: 'info', file: name, msg: 'Back in the folder.' }); differs = true; }
          results.push(pseudoFile(st, name));
          return;
        }
        if (f && !r.ok) {
          // Read before, unreadable now (edited elsewhere?): keep the records read before.
          results.push(pseudoFile(st, name));
          unreadable.set(name, r.error);
          notes.push({ level: 'warn', file: name, msg: 'No longer reads cleanly: ' + r.error + ' The records read from it before are kept here.' });
          if (f.unreadable !== r.error) differs = true;
          return;
        }
        results.push(r);
        if (f) {
          if (f.missing) { notes.push({ level: 'info', file: name, msg: 'Back in the folder; read again.' }); differs = true; }
          else if (f.unreadable) { notes.push({ level: 'info', file: name, msg: 'Reads cleanly again; read again.' }); differs = true; }
          else if (r.hash !== f.hash) { notes.push({ level: 'info', file: name, msg: 'Changed on disk; read again.' }); differs = true; }
        } else if (diskSeen.get(name) !== r.hash) {
          differs = true;
          if (r.ok) notes.push({ level: 'info', file: name, newFile: true, msg: diskSeen.has(name) ? 'Changed on disk; read again.' : 'New in the folder; read.' });
          else if (r.hash !== EMPTY) notes.push({ level: 'warn', file: name, msg: (diskSeen.has(name) ? 'Changed on disk, and' : 'New in the folder, but') + ' cannot be read: ' + r.error + ' Not loaded.' });
        }
      });
      st.files.forEach((f, name) => {
        if (diskNames.has(name)) return;
        results.push(pseudoFile(st, name));
        if (!f.isNew) {
          notes.push({ level: 'warn', file: name, msg: 'Not in the folder. Its records are kept here, and nothing will be written to that name until the file is back or you remove it from the library (Library page).' });
          if (!f.missing) differs = true;
        }
      });
      diskSeen = new Map(read.map(r => [r.name, r.hash]));

      if (differs || alreadySaved.length) {
        const pinned = new Set(Array.from(st.files.keys()));
        const built = R.buildLibrary(results, { slug: st.library.slug, pinned });
        // Files kept from the working copy keep their bookkeeping (what was last read or written).
        results.filter(r => r.pseudo).forEach(r => {
          const m = Object.assign({}, st.files.get(r.name));
          if (!diskNames.has(r.name) && !m.isNew) m.missing = true; else delete m.missing;
          if (unreadable.has(r.name)) m.unreadable = unreadable.get(r.name); else delete m.unreadable;
          built.state.files.set(r.name, m);
        });
        alreadySaved.forEach(a => { const m = built.state.files.get(a.name); if (m) built.state.files.set(a.name, Object.assign({}, m, { hash: a.hash, isNew: false })); });
        const done = new Set(alreadySaved.map(a => a.name));
        const stillDirty = Array.from(dirty).filter(n => !done.has(n)).concat(built.changed);
        store.load(built.state, { dirty: Array.from(new Set(stillDirty)) });
        // A file that has appeared but was not taken in (a copy of a loaded file, say) is not "read".
        notes.forEach(n => {
          if (!n.newFile || built.state.files.has(n.file)) return;
          const why = built.report.find(x => x.file === n.file && x.level !== 'info');
          n.level = 'warn'; n.msg = 'In the folder, but not loaded: ' + (why ? why.msg : 'see the load report.');
        });
        const keep = ui.report.filter(x => x.restore);                // what restoring could not bring back stays listed
        setUI({ report: keep.concat(notes, built.report.filter(x => x.level !== 'info')), needsConversion: built.needsConversion });
      }
      store.setUnloaded(unloadedOf(read, store.state.files, store.unloaded));
      if (alreadySaved.length) notes.push({ level: 'info', file: '', msg: alreadySaved.map(a => a.name).join(', ') + ' already held your changes (written by an earlier save); marked saved.' });
      setUI({ busy: '', wrongFolder: '',
        message: !announce ? ui.message : { level: notes.some(n => n.level === 'warn') ? 'warn' : 'ok', text: 'Connected to ' + ui.folderName + '.' + (notes.length ? ' ' + notes.map(n => (n.file ? n.file + ': ' : '') + n.msg).join(' ') : ' Nothing had changed there.') } });
      compact();
      return true;
    } catch (e) { setUI({ busy: '', message: { level: 'error', text: 'Could not read ' + ui.folderName + ': ' + e.message } }); return false; }
  }

  // Present the store's records for one file as if freshly read, so a merge can rebuild.
  function pseudoFile(st, name) {
    const f = st.files.get(name);
    const map = R.mapOfKind(st, f.kind);
    const records = [];
    map.forEach(r => { if (r._src === name) records.push(Object.assign({}, r, { spec: r.spec.slice(), na: r.na.slice(), overrides: r.overrides ? r.overrides.slice() : undefined })); });
    return { name, kind: f.kind, ok: true, error: '', warnings: [], records, style: f.style, hash: f.hash, lastModified: Number.MAX_SAFE_INTEGER, pseudo: true,
      setAside: (f.setAside || []).slice(), schemaVersion: SC.schema.VERSION, librarySlug: st.library.slug, libraryName: st.library.name, libraryNote: st.library.note, extraHeaders: f.extraHeaders || [] };
  }

  // Remove a file that is no longer in the folder, and its records, from the library.
  async function forgetFile(name) {
    if (waitForSave()) return;
    const st = store.state, f = st.files.get(name);
    if (!owner || !f || !f.missing) return;
    let n = 0;
    R.mapOfKind(st, f.kind).forEach(r => { if (r._src === name) n++; });
    if (!globalThis.confirm('Remove ' + name + ' from the library? Its ' + n + ' record(s) will be taken out of the working copy here. The file is not in the folder, so nothing on disk changes. This cannot be undone, and it also clears the undo history of every file.')) return;

    next.library = st.library;
    ['titles', 'issues', 'contents', 'authorities'].forEach(k => st[k].forEach((r, id) => { if (r._src !== name) next[k].set(id, r); }));
    st.files.forEach((m, k) => { if (k !== name) next.files.set(k, m); });
    store.load(next, { dirty: Array.from(store.dirty).filter(x => x !== name) });
    setUI({ report: ui.report.filter(r => r.file !== name), message: { level: 'ok', text: name + ' removed from the library.' } });
  }

  // ── Saving ────────────────────────────────────────────────────────────
  function changedFiles() {
    const st = store.state;
    return Array.from(store.dirty).filter(n => st.files.has(n)).map(name => ({ name, text: R.writeFile(st, name), baseline: st.files.get(name).hash }))
      .filter(f => !(st.files.get(f.name).isNew && SC.csv.parse(f.text).rows.length < 2));   // never write an empty new file
  }
  const list = names => names.join(', ');
  // Rows set aside because their ID repeated a loaded record's, where that record has since been
  // deleted: the next time the folder is read, such a row is taken in as that record.
  const ID_COL = { title: 'TitleID', issue: 'IssueID', content: 'ContentID', authority: 'AuthorityID' };
  function resurfacing(names) {
    const st = store.state, out = [];
    names.forEach(n => {
      const f = st.files.get(n);
      if (!f || !f.setAside) return;
      f.setAside.forEach(a => {
        const id = a.cells && a.cells[ID_COL[f.kind]];
        if (id && /already used/.test(a.reason) && !R.mapOfKind(st, f.kind).has(id)) out.push(n + ' row ' + a.row + ' (' + id + ')');
      });
    });
    return out;
  }

  // Saves run one at a time: a second Save (a click, Ctrl+S) waits for the first to finish, so an
  // older version of a file can never land on top of a newer one.
  let saving = null;
  function save() {
    if (saving) return saving.then(() => save());
    if (ui.busy) {        // reading or checking the folder: what a save would write over is not settled yet
      setUI({ message: { level: 'warn', text: 'Not saved yet: wait until "' + ui.busy + '" has finished, then save.' } });
      return Promise.resolve();
    }
    saving = saveNow().finally(() => { saving = null; });
    return saving;
  }
  async function saveNow() {
    if (ui.mode === 'none' || !owner) return;
    if (!(await ST.working.stillOwner().catch(() => true))) { lostAccess(); return; }
    const st = store.state;
    const base = store.revisions();
    const files = changedFiles();
    const written = new Set(files.map(f => f.name));
    const emptyNew = Array.from(store.dirty).filter(n => st.files.has(n) && !written.has(n));      // nothing in them: nothing to write
    const missing = files.filter(f => st.files.get(f.name).missing);
    const candidates = files.filter(f => !st.files.get(f.name).missing);
    const same = candidates.filter(f => f.baseline && R.hashText(f.text) === f.baseline);      // already what was last read or written
    const toWrite = candidates.filter(f => same.indexOf(f) === -1);
    const quiet = same.map(f => f.name).concat(emptyNew);
    const missNote = missing.length ? ' Not saved: ' + list(missing.map(f => f.name)) + ' — not in the folder, so nothing is written to that name (see the Library page).' : '';

    if (ui.mode === 'folder') {
      if (ui.wrongFolder) { setUI({ message: { level: 'error', text: ui.wrongFolder } }); return; }
      if (!folder || !(await ST.hasPermission(folder, true).catch(() => false))) { setUI({ needsReconnect: true, message: { level: 'error', text: 'Grant access to ' + ui.folderName + ' to save.' } }); return; }
      setUI({ busy: 'Saving ' + toWrite.length + ' file(s)…' });
      let res;
      // Ownership is checked before each file and just before each write lands, so a tab taken
      // over in the middle of a save writes nothing more.
      const stillOwner = async () => owner && await ST.working.stillOwner();
      try { res = await ST.withSaveLock(() => ST.writeFiles(folder, toWrite.map(f => ({ name: f.name, text: f.text, baseline: f.baseline, mustExist: !st.files.get(f.name).isNew, mustNotExist: !!st.files.get(f.name).isNew })), { stillOwner })); }
      catch (e) { res = { saved: {}, already: [], backups: [], conflicts: [], missing: [], occupied: [], failed: toWrite.map(f => ({ name: f.name, error: e.message })), backupFolder: '', stopped: false, notWritten: [] }; }
      const savedNames = Object.keys(res.saved);
      const meta = {};
      savedNames.forEach(n => { meta[n] = res.saved[n]; });
      store.markSaved(savedNames.concat(quiet), meta, base);
      res.missing.forEach(n => store.setFileMeta(n, { missing: true }));
      const parts = [];
      if (savedNames.length) parts.push('Saved ' + list(savedNames) + '.');
      else if (!toWrite.length && !missing.length) parts.push('Nothing needed saving.');
      if (res.backups.some(n => savedNames.indexOf(n) !== -1)) parts.push('The versions they replaced are in ' + res.backupFolder + '.');
      res.conflicts.forEach(c => parts.push(c.name + ' had been changed on disk since it was read; that version is kept as ' + c.backup + '.'));
      if (res.failed.length) parts.push('Not saved: ' + res.failed.map(x => x.name + ' (' + x.error + ')').join('; ') + '. Your changes to ' + (res.failed.length === 1 ? 'it are' : 'them are') + ' still here; Save again to retry.');
      if (res.missing.length) parts.push('Not saved: ' + list(res.missing) + ' — no longer in the folder, so it was not made again. Its records are kept here (see the Library page).');
      if (res.occupied.length) parts.push('Not saved: ' + list(res.occupied) + ' — new here, but a file of that name is already in the folder (one this library did not load), so it was not written over. Your changes are still here; move or rename the file in the folder, then save again.');
      const back = savedNames.length ? resurfacing(Array.from(store.state.files.keys())) : [];
      if (back.length) parts.push('Note: ' + list(back) + ' — set aside because the ID repeated a record you have since deleted — will be read as that record the next time the folder is opened.');
      if (res.stopped) {
        lostAccess();
        parts.push('The save stopped because another tab took over the library' + (res.notWritten.length ? '; not written here: ' + list(res.notWritten) : '') + '. That tab has the changes; save there.');
      }
      const level = res.failed.length || res.missing.length || res.occupied.length || missing.length || res.stopped ? 'error' : res.conflicts.length || back.length ? 'warn' : 'ok';
      setUI({ busy: '', message: { level, text: (res.failed.length || res.stopped ? 'Save did not finish. ' : '') + parts.join(' ') + missNote } });
    } else {
      // Without folder access a save is a download. It counts as saved only once you confirm the
      // downloaded files replaced the old ones; until then the files stay changed.
      toWrite.forEach(f => ST.download(f.name, f.text));
      if (quiet.length) store.markSaved(quiet, null, base);
      if (!toWrite.length) { setUI({ message: { level: missing.length ? 'error' : 'ok', text: 'Nothing needed downloading.' + missNote } }); return; }
      const meta = {};
      toWrite.forEach(f => { meta[f.name] = { hash: R.hashText(f.text) }; });
      setUI({ download: { at: Date.now(), names: toWrite.map(f => f.name), base, meta }, message: null });
    }
  }
  // The downloaded files have replaced the old copies: count them as saved, as they were when
  // downloaded (changes made since stay changed).
  function confirmDownload() {
    const d = ui.download;
    if (!d) return;
    store.markSaved(d.names, d.meta, d.base);
    setUI({ download: null, message: { level: 'ok', text: 'Marked as saved: ' + list(d.names) + '.' } });
  }
  function dismissDownload() { setUI({ download: null }); }

  async function confirmDiscard() {
    if (!store.dirty.size || ui.mode === 'none') return true;
    return globalThis.confirm(store.dirty.size + ' file(s) have unsaved changes. Continue without saving them?');
  }

  async function closeLibrary() {
    if (waitForSave()) return;
    if (!owner || !(await confirmDiscard())) return;
    folder = null;
    diskSeen = new Map();
    clearTimeout(compactTimer);
    setUI({ mode: 'none', folderName: '', report: [], needsConversion: [], needsReconnect: false, wrongFolder: '', restoredAt: 0, message: null, download: null });
    store.setUnloaded([]);
    store.load(SC.emptyState());
    ST.unstored.clear();
    await enqueue(() => ST.working.clear());
  }

  function dismissMessage() { setUI({ message: null }); }
  // A message from a stage: 'ok' clears itself, 'warn' and 'error' stay until dismissed.
  function say(level, text) { setUI({ message: { level, text } }); }
  function subscribeUI(fn) { uiListeners.add(fn); return () => uiListeners.delete(fn); }

  SC.session = { store, ui, init, whenReady, takeOver, openFolder, loadFiles, newLibrary, reconnect, chooseFolder, save, confirmDownload, dismissDownload, forgetFile,
    closeLibrary, dismissMessage, say, subscribeUI, changedFiles, flush: () => (compactDue ? compact() : chain), pendingWrites: () => pending, compactNow: compact };
})(globalThis.SC = globalThis.SC || {});

<script>/* js/ui/kit.js */
/* Slaughter Cataloger 3 — UI kit: rendering, hooks, routing, and the
   schema-driven field used by every form. */
(function (SC) {
  'use strict';
  const { h, Fragment } = globalThis.preact;
  const { useState, useEffect, useRef, useMemo, useCallback } = globalThis.preactHooks;
  const html = globalThis.htm.bind(h);
  const S = SC.schema, R = SC.records;

  // Re-render when the store or session changes.
  function useStore() {
    const store = SC.session.store;
    const [, setV] = useState(store.version);
    useEffect(() => store.subscribe(v => setV(v)), []);
    return store;
  }
  function useSessionUI() {
    const [, setN] = useState(0);
    useEffect(() => SC.session.subscribeUI(() => setN(n => n + 1)), []);
    return SC.session.ui;
  }

  // ── Routing: #/panel/titleID/issueID ──────────────────────────────────
  const PANELS = ['library', 'names', 'issues', 'contents', 'compiler', 'guide'];
  function parseRoute() {
    const parts = (location.hash || '').replace(/^#\/?/, '').split('/').map(decodeURIComponent);
    const panel = PANELS.indexOf(parts[0]) !== -1 ? parts[0] : 'library';
    return { panel, titleID: parts[1] || '', issueID: parts[2] || '' };
  }
  function routeHref(r) {
    return '#/' + [r.panel, r.titleID, r.issueID].filter((x, i) => i === 0 || x).map(encodeURIComponent).join('/');
  }
  function navigate(r, replace) {
    const cur = parseRoute();
    const next = Object.assign({}, cur, r);
    if (r.panel && r.titleID === undefined) next.titleID = cur.titleID;
    const href = routeHref(next);
    if (href === location.hash) return;
    if (replace) history.replaceState(null, '', href); else location.hash = href;
    if (replace) window.dispatchEvent(new HashChangeEvent('hashchange'));
  }
  function useRoute() {
    const [route, setRoute] = useState(parseRoute());
    useEffect(() => {
      const on = () => setRoute(parseRoute());
      window.addEventListener('hashchange', on);
      return () => window.removeEventListener('hashchange', on);
    }, []);
    return route;
  }

  // ── Small helpers ─────────────────────────────────────────────────────
  const fmt = n => Number(n || 0).toLocaleString('en-US');
  const plural = (n, one, many) => fmt(n) + ' ' + (n === 1 ? one : (many || one + 's'));
  const cls = (...xs) => xs.filter(Boolean).join(' ');

  // Field states. spec / na hold canonical CSV headers.
  function fieldState(rec, col) {
    const spec = (rec.spec || []).indexOf(col.header) !== -1;
    const na = (rec.na || []).indexOf(col.header) !== -1;
    return { spec, na };
  }
  // Returns a patch for the record after toggling '?' or 'N/A' on a field.
  function toggleState(ent, rec, col, which) {
    let spec = (rec.spec || []).slice(), na = (rec.na || []).slice();
    const has = (arr) => arr.indexOf(col.header) !== -1;
    const without = (arr) => arr.filter(x => x !== col.header);
    const patch = {};
    if (which === 'spec') {
      if (has(spec)) spec = without(spec); else { spec.push(col.header); na = without(na); }
    } else {
      if (has(na)) na = without(na); else { na.push(col.header); spec = without(spec); patch[col.key] = ''; }
    }
    patch.spec = R.orderStates(ent, spec);
    patch.na = R.orderStates(ent, na);
    patch.speculative = patch.spec.length > 0;
    return patch;
  }
  // Uncertain value, bibliographic style: "1881" -> "[1881?]"; an already supplied "[Untitled]" -> "[Untitled?]".
  function uncertain(v) {
    const t = String(v == null ? '' : v);
    const m = /^\[(.*)\]$/.exec(t.trim());
    return html`<span class="unc">[${m ? m[1] : t}${/\?$/.test(m ? m[1] : t) ? '' : '?'}]</span>`;
  }
  // How an issue is named in lists: its short name, else its numbers.
  const issueLabel = i => i.shortname || [i.volume && 'Vol. ' + i.volume, i.issue && 'No. ' + i.issue, i.number && 'Whole No. ' + i.number].filter(Boolean).join(', ') || i.issueDesignation || i.issueID || 'New issue';
  // "Aug 20, 1881", "March–April 1989", "Dec–Jan 1989–1990"; the printed date when nothing else is known.
  function issueDate(i) {
    const y = i.year ? (i.yearEnd && i.yearEnd !== i.year ? i.year + '–' + i.yearEnd : i.year) : '';
    const md = [i.months, i.day].filter(Boolean).join(' ');
    return (md && y ? md + (i.day ? ', ' : ' ') + y : md || y) || i.datePrinted || '';
  }
  const isUnaddressed = (col, value, st) => col.states && !st.spec && !st.na && String(value == null ? '' : value).trim() === '';

  // ── Field ─────────────────────────────────────────────────────────────
  /* props: col, value, state {spec,na}, onCommit(v), onToggle(which), placeholder,
            readOnly, note (small text under the input), invalid (message),
            inheritedValue (issues: the title's value, shown when this record has none of its own),
            onReset (go back to the inherited value), children (shown under the input) */
  function Field(p) {
    const col = p.col, st = p.state || { spec: false, na: false };
    const str = v => v == null ? '' : String(v);
    // While the person is typing, the field shows what they typed; otherwise it shows the record's
    // value, so changes from outside (undo, a suggestion, the next draft) appear at once. Only typing
    // is committed: leaving a field you did not type in never writes to the record.
    const [draft, setDraft] = useState(str(p.value));
    const typed = useRef(false);
    const shown = typed.current ? draft : str(p.value);
    const commit = (v) => { typed.current = false; if (String(v) !== str(p.value)) p.onCommit(v); else setDraft(str(p.value)); };
    const id = 'f-' + (p.idPrefix || '') + col.key;
    const inheriting = p.inheritedValue !== undefined && !st.na && str(p.value) === '';
    const overriding = p.inheritedValue !== undefined && !inheriting;
    const unaddressed = !p.readOnly && !inheriting && isUnaddressed(col, p.value, st);
    const common = {
      id, disabled: p.readOnly || p.valueLocked || st.na, title: col.tip || '',
      'data-sc-field': '', 'data-pending': typed.current && draft !== str(p.value) ? 'true' : undefined,
      onBlur: (e) => { if (typed.current) commit(e.target.value); },
      onInput: (e) => { typed.current = true; setDraft(e.target.value); },
      onKeyDown: (e) => {
        if (e.key === 'Escape') { typed.current = false; setDraft(str(p.value)); e.target.blur(); }
        if (e.key === 'Enter' && col.type !== 'long') { e.preventDefault(); if (typed.current) commit(e.target.value); }
      }
    };
    let input;
    if (col.type === 'enum') {
      const opts = col.options.slice();
      if (p.value && opts.indexOf(p.value) === -1) opts.push(p.value);   // keep values the list does not know
      input = html`<select id=${id} disabled=${p.readOnly} value=${p.value || ''} onChange=${e => p.onCommit(e.target.value)}>
        ${!col.required && html`<option value="">—</option>`}
        ${opts.map(o => html`<option value=${o}>${o}</option>`)}</select>`;
    } else if (col.type === 'bool') {
      input = html`<label class="check"><input type="checkbox" id=${id} disabled=${p.readOnly} checked=${!!p.value} onChange=${e => p.onCommit(e.target.checked)} /> ${p.checkLabel || 'Yes'}</label>`;
    } else if (col.type === 'long') {
      input = html`<textarea rows="3" ...${common} value=${st.na ? '' : shown} placeholder=${st.na ? 'not applicable' : (p.inheritedValue || p.placeholder || '')}></textarea>`;
    } else {
      input = html`<input type="text" autocomplete="off" spellcheck=${col.type === 'text'} ...${common} value=${st.na ? '' : shown}
        placeholder=${st.na ? 'not applicable' : (p.inheritedValue || p.placeholder || '')} inputmode=${col.type === 'int' ? 'numeric' : undefined} />`;
    }
    return html`<div class=${cls('field', 'span-' + (col.span || 1), st.spec && 'is-spec', st.na && 'is-na', unaddressed && 'is-unaddressed', p.invalid && 'is-invalid', inheriting && 'is-inherited', p.className)}>
      <div class="field-head">
        <label for=${id} title=${col.tip || ''}>${p.label || col.label}${inheriting && html` <span class="src">from title</span>`}</label>
        ${col.states && !p.readOnly && html`<span class="toggles">
          <button type="button" class=${cls('tog', st.spec && 'on')} aria-pressed=${st.spec} title="Speculative: inferred, uncertain, or from a secondary source" onClick=${() => p.onToggle('spec')}>?</button>
          ${!col.noNA && html`<button type="button" class=${cls('tog', st.na && 'on')} aria-pressed=${st.na} title="Not applicable: considered, and does not apply" onClick=${() => p.onToggle('na')}>N/A</button>`}
        </span>`}
      </div>
      ${input}
      ${overriding && p.onReset && !p.readOnly && html`<div class="field-note inh-note">${st.na ? 'Not applicable to this issue' : 'Set for this issue'}. Title: ${p.inheritedValue ? html`<span class="tv">${p.inheritedValue}</span>` : html`<em>blank</em>`}
        <button type="button" class="link" title="Use the title's value again" onClick=${p.onReset}>use title's</button></div>`}
      ${p.children}
      ${p.invalid ? html`<div class="field-note bad">${p.invalid}</div>` : p.note ? html`<div class="field-note">${p.note}</div>` : null}
    </div>`;
  }

  function Message({ msg, onClose }) {
    if (!msg) return null;
    return html`<div class=${'message ' + msg.level} role="status"><span>${msg.text}</span>
      ${onClose && html`<button type="button" class="link" onClick=${onClose}>Dismiss</button>`}</div>`;
  }

  SC.ui = { h, Fragment, html, useState, useEffect, useRef, useMemo, useCallback, useStore, useSessionUI, useRoute, navigate, parseRoute, routeHref,
    fmt, plural, cls, fieldState, toggleState, isUnaddressed, uncertain, issueLabel, issueDate, Field, Message };
})(globalThis.SC = globalThis.SC || {});

</script>
<script>/* js/ui/library.js */
/* Slaughter Cataloger 3 — Stage 1: Library (welcome, dashboard, title editor). */
(function (SC) {
  'use strict';
  const { html, useState, useMemo, useStore, useSessionUI, navigate, fmt, plural, cls, fieldState, toggleState, Field } = SC.ui;
  const S = SC.schema, R = SC.records, ids = SC.ids, session = SC.session;
  const TENT = S.entities.title;

  // ── Welcome: nothing loaded yet ───────────────────────────────────────
  function Welcome() {
    const [creating, setCreating] = useState(false);
    const [drag, setDrag] = useState(false);
    const onDrop = e => { e.preventDefault(); setDrag(false); session.loadFiles(e.dataTransfer.files); };
    return html`<section class="welcome" onDragOver=${e => { e.preventDefault(); setDrag(true); }} onDragLeave=${() => setDrag(false)} onDrop=${onDrop}>
      <h1>Slaughter Cataloger</h1>
      <p class="lede">A catalog of serial publications — titles, their issues, and what appears in each issue — kept as CSV files in a folder you own.</p>
      ${!creating && html`<div class="welcome-actions">
        ${SC.storage.supportsFolders && html`<button class="btn primary" onClick=${() => session.openFolder()}>Open library folder</button>`}
        <label class="btn">Load CSV files<input type="file" multiple accept=".csv,text/csv" hidden onChange=${e => session.loadFiles(e.target.files)} /></label>
        <button class="btn quiet" onClick=${() => setCreating(true)}>Start a new library</button>
      </div>`}
      ${creating && html`<${NewLibrary} onCancel=${() => setCreating(false)} />`}
      <div class=${cls('dropzone', drag && 'over')}>Or drop your library's CSV files here.</div>
      ${SC.storage.supportsFolders
        ? html`<p class="fine">With a folder open, Save writes your changes straight back into the CSV files, and the previous version of each file is kept in a <code>_backups</code> folder inside it.</p>`
        : html`<p class="fine">This browser can't save into a folder, so you'll load files and download the changed ones. In Chrome or Edge, Save writes straight into your library folder.</p>`}
    </section>`;
  }

  function NewLibrary({ onCancel }) {
    const [name, setName] = useState('');
    const [slug, setSlug] = useState('');
    const [slugTouched, setSlugTouched] = useState(false);
    const [note, setNote] = useState('');
    const autoSlug = n => n.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    const s = slugTouched ? slug : autoSlug(name);
    const valid = name.trim() && ids.RE.slug.test(s);
    const go = async useFolder => { if (valid && await session.newLibrary(s, name.trim(), note.trim(), useFolder)) navigate({ panel: 'library', titleID: 'new' }); };
    return html`<div class="card narrow">
      <h2>New library</h2>
      <div class="grid">
        <div class="field span-2"><div class="field-head"><label for="nl-name">Library name</label></div>
          <input id="nl-name" type="text" value=${name} onInput=${e => setName(e.target.value)} placeholder="e.g. Labor Journals" /></div>
        <div class="field span-2"><div class="field-head"><label for="nl-slug" title="Uppercase letters, numbers and hyphens. Part of every file name and every row; it cannot be changed later.">Library slug</label></div>
          <input id="nl-slug" type="text" value=${s} onInput=${e => { setSlugTouched(true); setSlug(e.target.value.toUpperCase()); }} placeholder="LABOR-JOURNALS" />
          ${s && !ids.RE.slug.test(s) && html`<div class="field-note bad">Use A–Z, 0–9 and single hyphens.</div>`}</div>
        <div class="field span-4"><div class="field-head"><label for="nl-note">Note</label></div>
          <input id="nl-note" type="text" value=${note} onInput=${e => setNote(e.target.value)} placeholder="What this library collects" /></div>
      </div>
      <div class="actions">
        ${SC.storage.supportsFolders && html`<button class="btn primary" disabled=${!valid} onClick=${() => go(true)}>Choose an empty folder for it</button>`}
        <button class=${cls('btn', !SC.storage.supportsFolders && 'primary')} disabled=${!valid} onClick=${() => go(false)}>${SC.storage.supportsFolders ? 'Start without a folder' : 'Start library'}</button>
        <button class="btn quiet" onClick=${onCancel}>Cancel</button>
      </div>
    </div>`;
  }

  // ── Progress per title ────────────────────────────────────────────────
  function titleStats(store, t) {
    const issues = store.issuesOfTitle(t.titleID);
    const contents = store.contentsOfTitle(t.titleID);
    let covered = 0;
    issues.forEach(i => { if (store.contentsOfIssue(i.issueID).length) covered++; });
    const known = parseInt(t.knownIssues, 10) || 0;
    const years = issues.map(i => parseInt(i.year, 10)).filter(y => !isNaN(y));
    const span = years.length ? [Math.min.apply(null, years), Math.max.apply(null, years)] : null;
    let stage = 'none';
    if (issues.length) stage = (known && issues.length >= known && covered >= issues.length) ? 'complete' : 'progress';
    return { issues: issues.length, contents: contents.length, covered, known, span, stage };
  }

  // ── Dashboard ─────────────────────────────────────────────────────────
  function Dashboard() {
    const store = useStore();
    const ui = useSessionUI();
    const st = store.state;
    const [filter, setFilter] = useState('all');
    const [q, setQ] = useState('');
    const [sort, setSort] = useState({ key: 'title', dir: 1 });
    const [editLib, setEditLib] = useState(false);

    const rows = useMemo(() => Array.from(st.titles.values()).map(t => ({ t, s: titleStats(store, t) })), [store.version]);
    const totals = rows.reduce((a, r) => { a.i += r.s.issues; a.c += r.s.contents; return a; }, { i: 0, c: 0 });
    const orphanIssues = st.issues.size - totals.i;
    const needle = q.trim().toLowerCase();
    const shown = rows.filter(r => (filter === 'all' || r.s.stage === filter) &&
      (!needle || (r.t.canonicalTitle + ' ' + r.t.titleID + ' ' + (r.t.subtitle || '')).toLowerCase().indexOf(needle) !== -1));
    const key = {
      title: r => (r.t.canonicalTitle || '').replace(/^(the|a|an|der|die|das|le|la|les|il|l')\s+/i, '').toLowerCase(),
      id: r => r.t.titleID, year: r => r.t.firstYear, status: r => r.t.catalogingStatus || '',
      issues: r => r.s.issues, contents: r => r.s.contents, coverage: r => r.s.issues ? r.s.covered / r.s.issues : -1
    }[sort.key];
    shown.sort((a, b) => { const x = key(a), y = key(b); return (x < y ? -1 : x > y ? 1 : 0) * sort.dir; });
    const th = (k, label, extra) => html`<th class=${cls(extra, 'sortable', sort.key === k && 'sorted')} aria-sort=${sort.key === k ? (sort.dir > 0 ? 'ascending' : 'descending') : 'none'}
      onClick=${() => setSort(sort.key === k ? { key: k, dir: -sort.dir } : { key: k, dir: 1 })}>${label}</th>`;
    const counts = { all: rows.length, none: 0, progress: 0, complete: 0 };
    rows.forEach(r => counts[r.s.stage]++);

    return html`<section>
      <header class="lib-head">
        <div>
          <h1 class="lib-name">${st.library.name || st.library.slug || 'Untitled library'}</h1>
          <div class="lib-meta"><code>${st.library.slug}</code>
            <span>${ui.mode === 'folder' ? 'Folder: ' + ui.folderName : ui.mode === 'files' ? 'Loaded from files; Save downloads changed files' : ''}</span></div>
          ${st.library.note && html`<p class="lib-note">${st.library.note}</p>`}
        </div>
        <div class="lib-actions">
          <button class="btn primary" onClick=${() => navigate({ panel: 'library', titleID: 'new' })}>Add title</button>
          <button class="btn quiet" onClick=${() => setEditLib(!editLib)}>Library details</button>
          ${SC.storage.supportsFolders && html`<button class="btn quiet" onClick=${() => session.openFolder()}>Open another folder</button>`}
          <button class="btn quiet" onClick=${() => session.closeLibrary()}>Close library</button>
        </div>
      </header>
      ${SC.views.LibraryTabs && html`<${SC.views.LibraryTabs} on="titles" />`}
      ${editLib && html`<${LibraryDetails} onDone=${() => setEditLib(false)} />`}
      <p class="summary">${plural(st.titles.size, 'title')}, ${plural(st.issues.size, 'issue')} and ${plural(st.contents.size, 'contents item')}.
        ${orphanIssues > 0 && html` <span class="warn-text">${plural(orphanIssues, 'issue')} belong to titles missing from the Titles file.</span>`}</p>
      ${ui.needsConversion && ui.needsConversion.length > 0 && html`<div class="message warn" role="status"><span>${plural(ui.needsConversion.length, 'file')} in the Beta 2 format ${ui.needsConversion.length === 1 ? 'was' : 'were'} not loaded and ${ui.needsConversion.length === 1 ? 'has' : 'have'} not been changed. Convert ${ui.needsConversion.length === 1 ? 'it' : 'them'} to 3.0 to include ${ui.needsConversion.length === 1 ? 'it' : 'them'} (see the Guide).</span></div>`}
      <${FileProblems} />
      <${LoadReport} report=${ui.report} />
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Show">
          ${[['all', 'All'], ['none', 'No issues yet'], ['progress', 'In progress'], ['complete', 'Complete']].map(([k, l]) =>
            html`<button class=${cls('seg-btn', filter === k && 'on')} aria-pressed=${filter === k} onClick=${() => setFilter(k)}>${l} <span class="count">${counts[k]}</span></button>`)}
        </div>
        <input class="search" type="search" placeholder="Find a title" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find a title" />
      </div>
      <div class="table-wrap">
        <table class="shelf">
          <thead><tr>
            ${th('title', 'Title')}${th('id', 'TitleID')}${th('year', 'From', 'num')}${th('status', 'Cataloging status')}
            ${th('issues', 'Issues', 'num')}${th('contents', 'Contents', 'num')}${th('coverage', 'Issues with contents')}<th></th>
          </tr></thead>
          <tbody>${shown.map(({ t, s }) => html`<tr key=${t.titleID} class="row-link" onClick=${() => navigate({ panel: 'library', titleID: t.titleID })}>
            <td><div class="t-name">${t.canonicalTitle || '(untitled)'}</div>${t.subtitle && html`<div class="t-sub">${t.subtitle}</div>`}</td>
            <td><code>${t.titleID}</code></td>
            <td class="num">${t.firstYear}${s.span && s.span[1] !== parseInt(t.firstYear, 10) ? '–' + s.span[1] : ''}</td>
            <td>${t.catalogingStatus || 'Not started'}</td>
            <td class="num">${s.issues ? fmt(s.issues) : '—'}${s.known ? html`<span class="of"> of ${fmt(s.known)}</span>` : ''}</td>
            <td class="num">${s.contents ? fmt(s.contents) : '—'}</td>
            <td>${s.issues ? html`<div class="meter" title=${s.covered + ' of ' + s.issues + ' issues have contents'}><span style=${'width:' + Math.round(100 * s.covered / s.issues) + '%'}></span></div><span class="meter-n">${Math.round(100 * s.covered / s.issues)}%</span>` : ''}</td>
            <td class="go"><a href=${'#/issues/' + encodeURIComponent(t.titleID)} onClick=${e => e.stopPropagation()}>Issues</a></td>
          </tr>`)}</tbody>
        </table>
        ${!shown.length && html`<p class="empty">${rows.length ? 'No titles match.' : 'No titles yet. Add the first title to begin.'}</p>`}
      </div>
    </section>`;
  }

  function LibraryDetails({ onDone }) {
    const store = useStore();
    const lib = store.state.library;
    const nameCol = { key: 'name', header: 'Title Library Name', label: 'Library name', span: 2, type: 'text', states: false };
    const noteCol = { key: 'note', header: 'Title Library Note', label: 'Note', span: 2, type: 'text', states: false };
    return html`<div class="card">
      <div class="grid">
        <${Field} col=${nameCol} value=${lib.name} onCommit=${v => store.setLibrary({ name: v.trim() }, 'Rename library')} />
        <${Field} col=${noteCol} value=${lib.note} onCommit=${v => store.setLibrary({ note: v.trim() }, 'Edit library note')} />
        <div class="field span-4"><div class="field-head"><label>Library slug</label></div><code class="static">${lib.slug}</code>
          <div class="field-note">Written into every row and file name, so it is fixed once the library exists.</div></div>
      </div>
      <div class="actions"><button class="btn" onClick=${onDone}>Done</button></div>
    </div>`;
  }

  // Files that need a look: gone from the folder, no longer readable, or holding rows the app
  // keeps as they are without loading them. Stays until the cause is gone.
  function FileProblems() {
    const store = useStore();
    const [open, setOpen] = useState(false);
    const files = Array.from(store.state.files.values());
    const missing = files.filter(f => f.missing), unreadable = files.filter(f => f.unreadable && !f.missing), kept = files.filter(f => f.setAside && f.setAside.length);
    if (!missing.length && !unreadable.length && !kept.length) return null;
    const rows = kept.reduce((n, f) => n + f.setAside.length, 0);
    return html`<div class="file-problems">
      ${missing.length > 0 && html`<div class="message error" role="status"><div>
        <strong>${plural(missing.length, 'file')} ${missing.length === 1 ? 'is' : 'are'} no longer in the folder.</strong> ${missing.length === 1 ? 'Its' : 'Their'} records are still here and in outputs, but nothing is written to ${missing.length === 1 ? 'that name' : 'those names'} until the file is back (then use Reconnect, or reload).
        <ul>${missing.map(f => html`<li key=${f.name}><code>${f.name}</code> <button class="link" onClick=${() => session.forgetFile(f.name)}>Remove from library…</button></li>`)}</ul></div></div>`}
      ${unreadable.length > 0 && html`<div class="message warn" role="status"><div>
        <strong>${plural(unreadable.length, 'file')} in the folder no longer ${unreadable.length === 1 ? 'reads' : 'read'} cleanly.</strong> The records read from ${unreadable.length === 1 ? 'it' : 'them'} before are kept here. Correct the file, then reload or reconnect.
        <ul>${unreadable.map(f => html`<li key=${f.name}><code>${f.name}</code> <span class="why">${f.unreadable}</span></li>`)}</ul></div></div>`}
      ${kept.length > 0 && html`<div class="message warn" role="status"><div>
        <strong>${plural(rows, 'row')} in ${plural(kept.length, 'file')} could not be taken in.</strong> They are kept exactly as they are and written back (at the end of the file) whenever the file is saved, so nothing is lost. To use such a row, correct it in the file — for a repeated ID, clear the ID cell and the app gives the row a new one — then open the folder again.
        <button class="link" aria-expanded=${open} onClick=${() => setOpen(!open)}>${open ? 'Hide' : 'Show'} the rows</button>
        ${open && html`<ul>${kept.map(f => f.setAside.map((x, k) => html`<li key=${f.name + k}><code>${f.name}</code> row ${x.row}: <span class="why">${x.reason}</span></li>`))}</ul>`}</div></div>`}
    </div>`;
  }

  function LoadReport({ report }) {
    const [open, setOpen] = useState(false);
    if (!report || !report.length) return null;
    const serious = report.filter(r => r.level === 'skip' || r.level === 'error' || r.level === 'warn');
    const label = serious.length ? plural(serious.length, 'note') + ' from loading need a look' : plural(report.length, 'note') + ' from loading';
    return html`<div class=${cls('report', serious.length && 'has-serious')}>
      <button class="link" aria-expanded=${open} onClick=${() => setOpen(!open)}>${open ? 'Hide' : 'Show'} ${label}</button>
      ${open && html`<ul>${report.map(r => html`<li class=${'lvl-' + r.level}><span class="lvl">${{ skip: 'Not loaded', error: 'Problem', warn: 'Check', info: 'Note', ok: 'OK' }[r.level] || r.level}</span>
        ${r.file && html`<code>${r.file}</code>`} ${r.msg}</li>`)}</ul>`}
    </div>`;
  }

  // ── The catalog entry, typeset from the record ────────────────────────
  // Uncertain values appear in brackets with a question mark, as in a printed bibliography.
  function Entry({ t, span }) {
    const v = (key, text) => {
      const col = TENT.byKey.get(key);
      const val = text != null ? text : t[key];
      if (!val) return null;
      return (t.spec || []).indexOf(col.header) !== -1 ? SC.ui.uncertain(val) : val;
    };
    const place = [v('city'), t.state && v('state'), t.country && v('country')].filter(Boolean);
    const years = t.firstYear ? (span && span[1] > (parseInt(t.firstYear, 10) || 0) ? t.firstYear + '–' + span[1] : t.firstYear + '–') : '';
    const join = (parts, sep) => parts.filter(Boolean).reduce((acc, p, i) => i ? acc.concat([sep, p]) : [p], []);
    return html`<div class="entry">
      <p class="entry-main"><cite>${t.canonicalTitle || 'Untitled'}</cite>${t.subtitle && html`: ${v('subtitle')}`}.
        ${(place.length || t.publisher || years) && html` ${join(place, ', ')}${place.length && t.publisher ? ': ' : ''}${v('publisher')}${years && (place.length || t.publisher ? ', ' : '')}${years && v('firstYear', years)}.`}
        ${t.editors && html` Edited by ${v('editors')}.`}
        ${t.frequency && html` ${v('frequency', t.frequency.charAt(0).toUpperCase() + t.frequency.slice(1))}.`}
        ${t.issn && html` ISSN ${v('issn')}.`}</p>
      ${(t.formerTitles || t.laterTitles || t.originalTitle) && html`<p class="entry-sub">
        ${t.originalTitle && html`Began as <cite>${v('originalTitle')}</cite>. `}
        ${t.formerTitles && html`Formerly <cite>${v('formerTitles')}</cite>. `}
        ${t.laterTitles && html`Continued as <cite>${v('laterTitles')}</cite>.`}</p>`}
      <p class="entry-id"><code>${t.titleID || 'TitleID assigned when added'}</code></p>
    </div>`;
  }

  // ── Title editor ──────────────────────────────────────────────────────
  function TitleEditor({ titleID }) {
    const store = useStore();
    const st = store.state;
    const isNew = titleID === 'new';
    const existing = st.titles.get(titleID);
    const [draft, setDraft] = useState(() => ({ titleID: '', titleCode: '', firstYear: '', canonicalTitle: '', catalogingStatus: 'Not started', spec: [], na: [], speculative: false,
      language: '', country: '' }));
    const [codeTouched, setCodeTouched] = useState(false);
    if (!isNew && !existing) return html`<section><p><a href="#/library">Library</a></p><p class="empty">No title ${titleID} in this library.</p></section>`;

    const rec = isNew ? draft : existing;
    const issueCount = isNew ? 0 : store.issuesOfTitle(titleID).length;
    const contentCount = isNew ? 0 : store.contentsOfTitle(titleID).length;
    const span = isNew ? null : titleStats(store, existing).span;
    const takenCodes = new Set(Array.from(st.titles.values()).map(t => t.titleCode));

    function update(patch, label) {
      if (isNew) {
        const next = Object.assign({}, draft, patch);
        if (!codeTouched && 'canonicalTitle' in patch) next.titleCode = ids.suggestTitleCode(next.canonicalTitle, takenCodes);
        next.titleID = ids.titleIDOf(next.titleCode, next.firstYear);
        setDraft(next);
      } else {
        store.put('title', Object.assign({}, existing, patch), label);
      }
    }
    const commit = col => v => {
      if (col.key === 'titleCode') { setCodeTouched(true); v = v.trim().toUpperCase(); }
      if (col.key === 'firstYear') v = v.trim().toUpperCase();
      update({ [col.key]: typeof v === 'string' && col.type !== 'long' ? v.replace(/\s+$/, '') : v }, 'Edit ' + col.label.toLowerCase());
    };
    const toggle = col => which => update(toggleState(TENT, rec, col, which), (which === 'spec' ? 'Mark ? on ' : 'Mark N/A on ') + col.label.toLowerCase());

    const codeErr = rec.titleCode && !ids.RE.titleCode.test(rec.titleCode) ? 'Eight characters, A–Z and 0–9.' :
      (isNew && rec.titleCode && takenCodes.has(rec.titleCode) ? 'Another title already uses this code.' : '');
    const yearErr = rec.firstYear && !ids.RE.firstYear.test(rec.firstYear) ? 'YYYY, or X for unknown digits: 189X, 18XX, XXXX.' : '';
    const canAdd = isNew && rec.canonicalTitle.trim() && ids.RE.titleCode.test(rec.titleCode) && ids.RE.firstYear.test(rec.firstYear) && !takenCodes.has(rec.titleCode) && !st.titles.has(rec.titleID);
    const lockedIDs = !isNew;
    const unaddressed = TENT.fields.filter(c => c.states && SC.ui.isUnaddressed(c, rec[c.key], fieldState(rec, c))).length;

    function add() {
      const file = store.fileForNew('title');
      const why = store.blocked(file); if (why) { SC.session.say('error', why); return; }
      const t = Object.assign({}, draft, { titleID: ids.titleIDOf(draft.titleCode, draft.firstYear), _src: file, entryOrder: store.nextEntryOrder(file, 'title') });
      TENT.fields.forEach(c => { if (t[c.key] === undefined) t[c.key] = ''; });
      // Issues already here for this TitleID (read while their title was missing) are settled
      // against it in the same step, as reading the files again would settle them.
      store.batch('Add title ' + t.canonicalTitle, () => {
        store.put('title', t);
        SC.records.settleIssues(store.state, t).forEach(i => store.put('issue', i));
      });
      navigate({ panel: 'library', titleID: t.titleID }, true);
    }
    function remove() {
      if (!confirm('Delete the title record "' + existing.canonicalTitle + '"? You can undo this until you close the app.')) return;
      store.remove('title', existing.titleID, 'Delete title ' + existing.canonicalTitle);
      navigate({ panel: 'library', titleID: '' });
    }

    return html`<section class="editor">
      <nav class="crumbs"><a href="#/library">${st.library.name || 'Library'}</a> <span aria-hidden="true">/</span> ${isNew ? 'New title' : rec.canonicalTitle}</nav>
      <div class="card entry-card">
        <${Entry} t=${rec} span=${span} />
        <div class="entry-facts">
          ${!isNew && html`<span>${plural(issueCount, 'issue')} recorded${existing.knownIssues ? ' of ' + existing.knownIssues + ' known' : ''}</span>
          <span>${plural(contentCount, 'contents item')}</span>
          <a href=${'#/issues/' + encodeURIComponent(titleID)}>Open issues</a>`}
          <span class=${cls('unaddr-count', unaddressed && 'some')}>${unaddressed ? plural(unaddressed, 'field') + ' not yet addressed' : 'Every field addressed'}</span>
        </div>
        ${!isNew && SC.views.RunStrip && html`<${SC.views.RunStrip} titleID=${titleID} target="issues" />`}
      </div>
      ${S.TITLE_GROUPS.map(g => html`<fieldset class="card group">
        <legend>${g.label}</legend>
        <div class="grid">
          ${TENT.groupFields(g.id).map(c => {
            const locked = lockedIDs && (c.key === 'titleCode' || c.key === 'firstYear');
            return html`<${Field} key=${c.key} col=${c} value=${rec[c.key]} state=${fieldState(rec, c)} onCommit=${commit(c)} onToggle=${toggle(c)}
              readOnly=${locked && c.key === 'titleCode'} valueLocked=${locked && c.key === 'firstYear'}
              invalid=${c.key === 'titleCode' ? codeErr : c.key === 'firstYear' ? yearErr : ''}
              note=${locked ? (c.key === 'titleCode' ? 'Part of the permanent TitleID ' + rec.titleID + '.' : 'Year is part of the TitleID; marking it ? is still possible.') : (c.key === 'titleCode' && isNew && !codeTouched ? 'Suggested from the title.' : '')} />`;
          })}
        </div>
      </fieldset>`)}
      <div class="actions sticky-actions">
        ${isNew ? html`<button class="btn primary" disabled=${!canAdd} onClick=${add}>Add title</button>
            <button class="btn quiet" onClick=${() => navigate({ panel: 'library', titleID: '' })}>Cancel</button>
            ${!canAdd && html`<span class="hint">Needs a canonical title, an eight-character title code and a first year.</span>`}`
          : html`<button class="btn" onClick=${() => navigate({ panel: 'library', titleID: '' })}>Back to library</button>
            ${!issueCount && !contentCount && html`<button class="btn quiet danger" onClick=${remove}>Delete title</button>`}
            <span class="hint">Changes are kept as you go. Save writes them to your files.</span>`}
      </div>
    </section>`;
  }

  function LibraryPanel({ route }) {
    useStore();
    if (route.titleID) return html`<${TitleEditor} key=${route.titleID} titleID=${route.titleID} />`;
    return html`<${Dashboard} />`;
  }

  SC.views = Object.assign(SC.views || {}, { Welcome, LibraryPanel, LoadReport, Entry, titleStats });
})(globalThis.SC = globalThis.SC || {});

</script>
<script>/* js/ui/names.js */
/* Slaughter Cataloger 3 — Library › Names.
   Every name credited in the library's contents, and the headings that gather them.
   Contents keep each credit as printed; a heading (a record in the library's Authorities
   file) lists the forms one person or body is credited under and the form an index files
   them under. Making, extending and combining headings never changes the contents. */
(function (SC) {
  'use strict';
  const { html, useState, useMemo, useStore, navigate, routeHref, plural, cls, issueLabel, Field } = SC.ui;
  const S = SC.schema, NM = SC.names, ids = SC.ids, R = SC.records;
  const AENT = S.entities.authority;
  const LIST_MAX = 600;

  // The Library stage's two views.
  function LibraryTabs({ on }) {
    const store = useStore();
    const nNames = useMemo(() => NM.index(store.state).entries.length, [store.version]);
    return html`<nav class="lib-tabs" aria-label="Library">
      <a href="#/library" class=${cls(on === 'titles' && 'on')} aria-current=${on === 'titles' ? 'page' : undefined}>Titles <span class="count">${store.state.titles.size}</span></a>
      <a href="#/names" class=${cls(on === 'names' && 'on')} aria-current=${on === 'names' ? 'page' : undefined}>Names <span class="count">${nNames.toLocaleString('en-US')}</span></a>
    </nav>`;
  }

  // ── Changes ───────────────────────────────────────────────────────────
  function newHeading(store, fields, label) {
    const file = store.fileForNew('authority');
    const why = store.blocked(file); if (why) { SC.session.say('error', why); return null; }
    const id = ids.newAuthorityID(x => store.state.authorities.has(x));
    const rec = { authorityID: id, spec: [], na: [], speculative: false, _src: file, entryOrder: store.nextEntryOrder(file, 'authority') };
    AENT.fields.forEach(c => { rec[c.key] = ''; });
    Object.assign(rec, { nameType: 'Person', status: 'Needs review' }, fields);
    store.put('authority', rec, label || 'Make heading ' + rec.name);
    return id;
  }
  function addForms(store, a, raws, label) {
    const forms = NM.splitForms(a.variants).concat(raws);
    store.put('authority', Object.assign({}, a, { variants: NM.joinForms(forms) }), label || 'Add ' + plural(raws.length, 'form') + ' to ' + a.name);
  }
  function removeForm(store, a, raw) {
    const k = NM.nameKey(raw);
    store.put('authority', Object.assign({}, a, { variants: NM.joinForms(NM.splitForms(a.variants).filter(f => NM.nameKey(f) !== k)) }), 'Remove ' + raw + ' from ' + a.name);
  }
  // A heading from a group of forms: the suggested form of the fullest name, every form listed.
  function headingFromForms(forms, suggestion) {
    const s = NM.suggestHeading(suggestion || forms[0].raw);
    return { name: suggestion || s.name, nameType: s.nameType, honorifics: s.honorifics, roles: s.roles, variants: NM.joinForms(forms.map(f => f.raw)) };
  }

  // ── Credits under a name ──────────────────────────────────────────────
  function Credits({ store, ix, keys }) {
    const [all, setAll] = useState(false);
    const st = store.state;
    const items = [].concat.apply([], keys.map(k => (ix.forms.get(k) || { items: [] }).items)).map(id => st.contents.get(id)).filter(Boolean);
    const rows = items.map(c => {
      const iss = st.issues.get(c.issueID);
      const tid = R.titleOfContent(st, c);
      const t = st.titles.get(tid);
      return { c, iss, tid, tname: t ? t.canonicalTitle : tid, order: (t ? t.canonicalTitle : tid) + '|' + (iss ? String(iss.entryOrder).padStart(6, '0') : 'zz') + '|' + String(c.sequence).padStart(5, '0') };
    }).sort((a, b) => (a.order < b.order ? -1 : a.order > b.order ? 1 : 0));
    const shown = all ? rows : rows.slice(0, 60);
    let lastTitle = '';
    return html`<div class="card nm-credits"><h2>Credits <span class="nm-sub">${plural(rows.length, 'item')}</span></h2>
      <ol class="nm-items">${shown.map(r => {
        const head = r.tname !== lastTitle ? html`<li class="nm-title-row"><cite>${r.tname}</cite></li>` : null;
        lastTitle = r.tname;
        const pages = r.c.startPage ? (r.c.endPage && r.c.endPage !== r.c.startPage ? r.c.startPage + '–' + r.c.endPage : r.c.startPage) : '';
        return html`${head}<li key=${r.c.contentID}><a href=${routeHref({ panel: 'contents', titleID: r.tid, issueID: r.c.issueID })}>
          <span class="nm-iss">${r.iss ? issueLabel(r.iss) : r.c.issueID}</span>
          <span class="nm-item">${r.c.itemTitle || '(untitled)'}${pages ? html` <span class="dim">p. ${pages}</span>` : ''}</span>
          <span class="nm-as" title="Credited as">${r.c.author}</span></a></li>`;
      })}</ol>
      ${rows.length > shown.length && html`<button class="link" onClick=${() => setAll(true)}>Show all ${rows.length.toLocaleString('en-US')}</button>`}
    </div>`;
  }

  // Unheaded names that may be this person.
  function possibleForms(ix, heading) {
    const p = NM.parse(heading.name);
    if (!p) return [];
    const letters = (p.initials.join('') + NM.nameKey(p.surname).charAt(0));
    // Compatible names, initialisms that spell the name, and the bare surname ("Tucker").
    return ix.entries.filter(e => e.kind === 'name').filter(e => {
      const q = NM.parse(e.label);
      if (q) return NM.compatible(p, q);
      if (e.keys[0] === NM.nameKey(p.surname)) return true;
      return NM.isInitialism(e.label) && e.label.replace(/[^A-Za-z]/g, '').toLowerCase() === letters;
    }).slice(0, 12);
  }

  // ── A heading ─────────────────────────────────────────────────────────
  function HeadingDetail({ store, ix, entry }) {
    const a = entry.authority;
    const [q, setQ] = useState('');
    const update = (patch, label) => store.put('authority', Object.assign({}, a, patch), label);
    const listed = new Set(NM.splitForms(a.variants).map(NM.nameKey));
    const own = new Set([NM.nameKey(a.name), NM.nameKey(NM.directOrder(a.name))]);
    const notFound = NM.splitForms(a.variants).filter(f => !ix.forms.has(NM.nameKey(f)));
    const maybe = possibleForms(ix, a);
    const needle = NM.nameKey(q);
    const found = needle.length >= 2 ? ix.entries.filter(e => e.kind === 'name' && e.keys[0].indexOf(needle) !== -1).slice(0, 10) : [];
    const seeAlso = a.seeAlso ? Array.from(store.state.authorities.values()).find(x => x.name === a.seeAlso) : null;
    function remove() {
      if (!confirm('Delete the heading "' + a.name + '"? The credits stay as they are in the contents; you can undo this.')) return;
      store.remove('authority', a.authorityID, 'Delete heading ' + a.name);
      navigate({ panel: 'names', titleID: '' });
    }
    const field = c => html`<${Field} key=${c.key} col=${c} value=${a[c.key]} idPrefix="a-" onCommit=${v => update({ [c.key]: typeof v === 'string' && c.type !== 'long' ? v.trim() : v }, 'Edit ' + c.label.toLowerCase() + ' of ' + a.name)} />`;
    return html`<div class="nm-detail">
      <div class="card entry-card">
        <div class="entry"><p class="entry-main nm-heading">${a.name || '(no heading)'}${a.dates ? html`, <span class="nm-dates">${a.dates}</span>` : ''}</p>
          <p class="entry-sub">${[a.nameType, a.honorifics, a.roles].filter(Boolean).join(' · ')}${seeAlso ? html` · See also <a href=${routeHref({ panel: 'names', titleID: seeAlso.authorityID })}>${seeAlso.name}</a>` : a.seeAlso ? ' · See also ' + a.seeAlso : ''}</p>
          <p class="entry-id"><code>${a.authorityID}</code></p></div>
        <div class="entry-facts"><span>${plural(entry.count, 'credit')}</span><span>${plural(entry.forms.length, 'form')}</span>
          <span class=${cls('nm-status', a.status === 'Confirmed' ? 'ok' : 'review')}>${a.status || 'Needs review'}</span></div>
      </div>
      <fieldset class="card group"><legend>Heading</legend><div class="grid">${AENT.groupFields('name').map(field)}</div></fieldset>
      <div class="card nm-forms">
        <h2>Forms <span class="nm-sub">credits filed under this heading</span></h2>
        <ul class="nm-formlist">${entry.forms.map(f => {
          const k = NM.nameKey(f.raw);
          return html`<li key=${f.raw}><span class="nm-form">${f.raw}</span><span class="nm-n">${f.count}</span>
            ${listed.has(k) ? html`<button class="link" onClick=${() => removeForm(store, a, f.raw)}>Remove</button>` : html`<span class="dim small">${own.has(k) ? 'the heading itself' : ''}</span>`}</li>`;
        })}
          ${notFound.map(f => html`<li key=${'nf' + f}><span class="nm-form dim">${f}</span><span class="nm-n dim">0</span><button class="link" onClick=${() => removeForm(store, a, f)}>Remove</button></li>`)}</ul>
        ${maybe.length > 0 && html`<div class="nm-maybe"><h3>Possibly the same name</h3>
          <ul class="nm-formlist">${maybe.map(e => html`<li key=${e.id}><span class="nm-form">${e.label}</span><span class="nm-n">${e.count}</span>
            <button class="link" onClick=${() => addForms(store, a, e.forms.map(f => f.raw))}>Add</button></li>`)}</ul>
          ${maybe.length > 1 && html`<button class="btn small" onClick=${() => addForms(store, a, [].concat.apply([], maybe.map(e => e.forms.map(f => f.raw))))}>Add all ${maybe.length}</button>`}</div>`}
        <div class="nm-find"><input type="search" placeholder="Find another form to add" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find a form to add" />
          ${found.length > 0 && html`<ul class="nm-formlist">${found.map(e => html`<li key=${e.id}><span class="nm-form">${e.label}</span><span class="nm-n">${e.count}</span>
            <button class="link" onClick=${() => { addForms(store, a, e.forms.map(f => f.raw)); setQ(''); }}>Add</button></li>`)}</ul>`}</div>
      </div>
      <${Credits} store=${store} ix=${ix} keys=${entry.keys} />
      <details class="card group collapsible"><summary><span class="group-title">More</span> <span class="group-note">roles, honorifics, sources, notes, the list of forms as text</span></summary>
        <div class="grid">${AENT.groupFields('more').concat(AENT.groupFields('forms')).map(field)}</div></details>
      <div class="actions"><button class="btn quiet danger" onClick=${remove}>Delete heading</button>
        <span class="hint">Headings never change the contents: each credit stays as printed.</span></div>
    </div>`;
  }

  // ── A name without a heading ──────────────────────────────────────────
  function NameDetail({ store, ix, entry, groups }) {
    const sug = NM.suggestHeading(entry.label);
    const [name, setName] = useState(sug.name);
    const [q, setQ] = useState('');
    const group = groups.find(g => g.keys.indexOf(entry.keys[0]) !== -1);
    const needle = NM.nameKey(q);
    const heads = ix.entries.filter(e => e.kind === 'heading' && (!needle || NM.nameKey(e.label).indexOf(needle) !== -1)).slice(0, 8);
    function make(forms, heading) {
      const id = newHeading(store, headingFromForms(forms, heading));
      if (id) navigate({ panel: 'names', titleID: id });
    }
    function addTo(e) {
      addForms(store, e.authority, entry.forms.map(f => f.raw));
      navigate({ panel: 'names', titleID: e.id });
    }
    return html`<div class="nm-detail">
      <div class="card entry-card">
        <div class="entry"><p class="entry-main nm-heading nm-raw">${entry.label}</p>
          <p class="entry-sub">No heading yet${entry.forms.length > 1 ? html`. Credited as ${entry.forms.map((f, k) => html`${k ? ', ' : ''}<q>${f.raw}</q>`)}` : ''}.</p></div>
        <div class="entry-facts"><span>${plural(entry.count, 'credit')}</span></div>
      </div>
      <div class="card nm-make">
        <h2>Make a heading</h2>
        <div class="nm-make-row"><input type="text" class="nm-name-input" value=${name} onInput=${e => setName(e.target.value)} aria-label="Heading" />
          <button class="btn primary" disabled=${!name.trim()} onClick=${() => make(entry.forms, name.trim())}>Make heading</button></div>
        <p class="hint">Suggested from <q>${entry.label}</q>: surname first${sug.roles ? ', “' + sug.roles + '” set aside as a role' : ''}${sug.honorifics ? ', “' + sug.honorifics + '” set aside' : ''}. ${sug.nameType !== 'Person' ? 'Read as ' + sug.nameType.toLowerCase() + ', so left as given.' : ''}</p>
      </div>
      ${group && html`<div class="card nm-group">
        <h2>Probably the same name</h2>
        <ul class="nm-formlist">${group.forms.map(f => html`<li key=${f.raw}><span class="nm-form">${f.raw}</span><span class="nm-n">${f.count}</span></li>`)}</ul>
        <div class="actions"><button class="btn" onClick=${() => make(group.forms, group.suggestion)}>Combine as “${group.suggestion}”</button></div>
      </div>`}
      ${ix.entries.some(e => e.kind === 'heading') && html`<div class="card nm-addto">
        <h2>Add to a heading</h2>
        <input type="search" placeholder="Find a heading" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find a heading" />
        <ul class="nm-formlist">${heads.map(e => html`<li key=${e.id}><span class="nm-form"><b>${e.label}</b></span><span class="nm-n">${e.count}</span>
          <button class="link" onClick=${() => addTo(e)}>Add here</button></li>`)}</ul>
      </div>`}
      <${Credits} store=${store} ix=${ix} keys=${entry.keys} />
    </div>`;
  }

  // ── Suggested matches ─────────────────────────────────────────────────
  function Matches({ store, groups }) {
    const [skip, setSkip] = useState(() => new Set());
    const shown = groups.filter(g => !skip.has(g.keys.join('|'))).slice(0, 80);
    return html`<div class="nm-detail">
      <div class="card"><h2>Suggested matches</h2>
        <p class="hint">Forms that look like one name: the same surname, with forenames and initials that agree. Combining them makes one heading that lists every form; the contents stay as printed. Check each before combining.</p></div>
      ${shown.map(g => html`<div class="card nm-group" key=${g.keys.join('|')}>
        <div class="nm-group-head"><b>${g.suggestion}</b> <span class="nm-sub">${plural(g.count, 'credit')}</span></div>
        <ul class="nm-formlist">${g.forms.map(f => html`<li key=${f.raw}><span class="nm-form">${f.raw}</span><span class="nm-n">${f.count}</span></li>`)}</ul>
        <div class="actions"><button class="btn small primary" onClick=${() => newHeading(store, headingFromForms(g.forms, g.suggestion), 'Combine ' + plural(g.forms.length, 'form') + ' as ' + g.suggestion)}>Combine</button>
          <button class="btn small quiet" onClick=${() => setSkip(new Set(skip).add(g.keys.join('|')))}>Not the same</button></div>
      </div>`)}
      ${!shown.length && html`<p class="empty">No suggested matches.</p>`}
    </div>`;
  }

  // ── The view ──────────────────────────────────────────────────────────
  function NamesPanel({ route }) {
    const store = useStore();
    const st = store.state;
    const ix = useMemo(() => NM.index(st), [store.version]);
    const groups = useMemo(() => NM.suggestGroups(ix), [ix]);
    const [filter, setFilter] = useState('all');
    const [q, setQ] = useState('');
    const sel = route.titleID;
    const needle = NM.nameKey(q);
    const counts = { all: ix.entries.length, headed: 0, unheaded: 0, review: 0, matches: groups.length };
    ix.entries.forEach(e => { if (e.kind === 'heading') { counts.headed++; if (e.authority.status !== 'Confirmed') counts.review++; } else counts.unheaded++; });
    const list = ix.entries.filter(e => (filter === 'all' || (filter === 'headed' && e.kind === 'heading') || (filter === 'unheaded' && e.kind === 'name') ||
      (filter === 'review' && e.kind === 'heading' && e.authority.status !== 'Confirmed')) &&
      (!needle || NM.nameKey(e.label).indexOf(needle) !== -1 || e.forms.some(f => NM.nameKey(f.raw).indexOf(needle) !== -1)));
    const entry = sel ? ix.entries.find(e => e.id === sel) : null;
    const credits = ix.entries.reduce((n, e) => n + e.count, 0);
    let detail;
    if (filter === 'matches') detail = html`<${Matches} store=${store} groups=${groups} />`;
    else if (entry && entry.kind === 'heading') detail = html`<${HeadingDetail} key=${entry.id} store=${store} ix=${ix} entry=${entry} />`;
    else if (entry) detail = html`<${NameDetail} key=${entry.id} store=${store} ix=${ix} entry=${entry} groups=${groups} />`;
    else if (sel && st.authorities.has(sel)) detail = html`<${HeadingDetail} key=${sel} store=${store} ix=${ix} entry=${{ id: sel, kind: 'heading', label: st.authorities.get(sel).name, keys: [], forms: [], count: 0, authority: st.authorities.get(sel) }} />`;
    else detail = html`<div class="card nm-intro"><h2>Names</h2>
      <p>Every name credited in the contents of this library, ${plural(ix.entries.length, 'name')} in ${plural(credits, 'credit')}. A heading gathers the forms one person is credited under (<q>B.R.T.</q>, <q>Benj. R. Tucker</q>) and is the form the name files under in an index (<q>Tucker, Benjamin R.</q>).</p>
      <p>Choose a name to make or extend a heading, or look at <button class="link" onClick=${() => setFilter('matches')}>${plural(groups.length, 'suggested match', 'suggested matches')}</button>. Headings are kept in <code>${R.defaultFileName('authority', st.library.slug)}</code>; the contents always keep each credit as printed.</p></div>`;

    return html`<section class="names">
      <header class="lib-head"><div><h1 class="lib-name">${st.library.name || st.library.slug}</h1></div></header>
      <${LibraryTabs} on="names" />
      ${ix.conflicts.length > 0 && html`<div class="message warn" role="status"><span>${plural(ix.conflicts.length, 'form')} ${ix.conflicts.length === 1 ? 'is' : 'are'} listed under two headings, and ${ix.conflicts.length === 1 ? 'files' : 'file'} under the first:
        ${ix.conflicts.slice(0, 4).map((c, k) => html`${k ? '; ' : ''}${(st.authorities.get(c.authorityIDs[0]) || {}).name} and ${(st.authorities.get(c.authorityIDs[1]) || {}).name}`)}.</span></div>`}
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Show">${[['all', 'All'], ['headed', 'Headings'], ['unheaded', 'No heading'], ['review', 'Needs review'], ['matches', 'Suggested matches']].map(([k, l]) =>
          html`<button class=${cls('seg-btn', filter === k && 'on')} aria-pressed=${filter === k} onClick=${() => setFilter(k)}>${l} <span class="count">${counts[k].toLocaleString('en-US')}</span></button>`)}</div>
        ${filter !== 'matches' && html`<input class="search" type="search" placeholder="Find a name" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find a name" />`}
      </div>
      <div class="nm-layout">
        ${filter !== 'matches' && html`<aside class="nm-list card" aria-label="Names">
          <ol>${list.slice(0, LIST_MAX).map(e => html`<li key=${e.id}><a href=${routeHref({ panel: 'names', titleID: e.id })} class=${cls('nm-row', e.kind, e.id === sel && 'on')}>
            <span class="nm-label">${e.label}</span><span class="nm-n">${e.count.toLocaleString('en-US')}</span>
            ${(e.kind === 'heading' && e.forms.length > 1) || e.forms.length > 1 ? html`<span class="nm-forms">${plural(e.forms.length, 'form')}</span>` : ''}
            ${e.kind === 'heading' && e.authority.status !== 'Confirmed' ? html`<span class="nm-flag">review</span>` : ''}</a></li>`)}</ol>
          ${list.length > LIST_MAX && html`<p class="hint nm-more">Showing ${LIST_MAX} of ${list.length.toLocaleString('en-US')}. Find a name to narrow the list.</p>`}
          ${!list.length && html`<p class="empty">No names match.</p>`}
        </aside>`}
        <div class=${cls('nm-main', filter === 'matches' && 'wide')}>${detail}</div>
      </div>
    </section>`;
  }

  SC.views = Object.assign(SC.views || {}, { NamesPanel, LibraryTabs });
})(globalThis.SC = globalThis.SC || {});

<script>/* js/ui/panels.js */
/* Slaughter Cataloger 3 — the context bar shared by stages 2 and 3, and the Guide.
   Stage 2 lives in issues.js, stage 3 in contents.js, stage 4 in compiler.js. */
(function (SC) {
  'use strict';
  const { html, useStore, navigate, issueLabel, issueDate } = SC.ui;

  const sortTitles = arr => arr.slice().sort((a, b) => (a.canonicalTitle || '').localeCompare(b.canonicalTitle || ''));

  // ── Context bar ───────────────────────────────────────────────────────
  function ContextBar({ route }) {
    const store = useStore();
    const titles = sortTitles(Array.from(store.state.titles.values()));
    // Titles that have issues or contents but no record in the Titles file.
    const orphanTIDs = Array.from(new Set(Array.from(store.state.issues.values()).map(i => i.titleID)
      .concat(Array.from(store.state.contents.values()).map(c => c.issueID && !store.state.issues.has(c.issueID) ? SC.records.titleOfContent(store.state, c) : ''))
      .filter(t => t && !store.state.titles.has(t)))).sort();
    const issues = route.titleID ? store.issuesOfTitle(route.titleID) : [];
    const isNew = route.issueID === 'new' && route.panel === 'issues';
    const pos = issues.findIndex(i => i.issueID === route.issueID);
    const go = (titleID, issueID) => navigate({ panel: route.panel, titleID, issueID: issueID || '' });
    return html`<div class="context-bar" role="navigation" aria-label="Current title and issue">
      <label class="ctx"><span>Title</span>
        <select value=${route.titleID} onChange=${e => go(e.target.value, '')}>
          <option value="">Choose a title</option>
          ${titles.map(t => html`<option value=${t.titleID}>${t.canonicalTitle} (${t.titleID})</option>`)}
          ${orphanTIDs.map(t => html`<option value=${t}>${t} (not in Titles file)</option>`)}
        </select></label>
      ${route.panel !== 'compiler' && html`<label class="ctx"><span>Issue</span>
        <select value=${isNew ? 'new' : pos === -1 ? '' : route.issueID} disabled=${!issues.length && !isNew} onChange=${e => go(route.titleID, e.target.value)}>
          <option value="">${issues.length ? (route.panel === 'issues' ? 'All issues (' : 'Choose an issue (') + issues.length + ')' : route.titleID ? 'No issues yet' : 'Choose a title first'}</option>
          ${isNew && html`<option value="new">New issue, not yet recorded</option>`}
          ${issues.map(i => html`<option value=${i.issueID}>${issueLabel(i)}${issueDate(i) ? ' — ' + issueDate(i) : ''}</option>`)}
        </select></label>
      <span class="ctx-step">
        <button class="btn small" disabled=${pos <= 0} onClick=${() => go(route.titleID, issues[pos - 1].issueID)} aria-label="Previous issue" title="Alt+PageUp">Previous</button>
