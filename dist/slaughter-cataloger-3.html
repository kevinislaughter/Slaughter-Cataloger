<script>/* js/core/toc.js */
/* Slaughter Cataloger 3 — the table of contents of one issue, as a flat list.
   Items are kept in Sequence order; nesting shows as depth, from Parent ContentID.
   A nested item always follows its parent, so an item's "subtree" is the run of
   deeper rows right after it. These functions work out what an edit changes;
   the Contents stage applies the result to the store. Pure, testable in Node.

   rows: ordered [{ id, parentID }]  (sequence order, one issue) */
(function (SC) {
  'use strict';

  function depths(rows) {
    const byId = new Map(rows.map(r => [r.id, r]));
    const memo = new Map();
    const depth = r => {
      if (memo.has(r.id)) return memo.get(r.id);
      let d = 0, x = r;
      const seen = new Set([r.id]);
      while (x.parentID && byId.has(x.parentID) && !seen.has(x.parentID)) { seen.add(x.parentID); x = byId.get(x.parentID); d++; }
      memo.set(r.id, d);
      return d;
    };
    return rows.map(depth);
  }

  // Last index of row i's subtree.
  function subtreeEnd(ds, i) {
    let e = i;
    while (e + 1 < ds.length && ds[e + 1] > ds[i]) e++;
    return e;
  }
  // The previous row at the same depth with no shallower row in between (i's previous sibling).
  function prevSibling(ds, i) {
    for (let j = i - 1; j >= 0; j--) { if (ds[j] < ds[i]) return -1; if (ds[j] === ds[i]) return j; }
    return -1;
  }
  // The nearest earlier row at depth d (the parent a row at depth d+1 would have).
  function nearestAt(ds, i, d) {
    if (d < 0) return -1;
    for (let j = i - 1; j >= 0; j--) if (ds[j] === d) return j;
    return -1;
  }

  // Indent: the row becomes the last child of its previous sibling. Returns { id: newParentID } or null.
  function indent(rows, i) {
    const ds = depths(rows);
    const j = prevSibling(ds, i);
    if (j === -1) return null;
    return { [rows[i].id]: rows[j].id };
  }
  // Outdent: the row moves up a level; siblings that follow it become its children,
  // so the list still reads in sequence order. Returns { id: newParentID } or null.
  function outdent(rows, i) {
    const ds = depths(rows);
    if (!ds[i]) return null;
    const g = nearestAt(ds, i, ds[i] - 2);
    const out = { [rows[i].id]: g === -1 ? '' : rows[g].id };
    for (let k = subtreeEnd(ds, i) + 1; k < rows.length && ds[k] >= ds[i]; k++) if (ds[k] === ds[i]) out[rows[k].id] = rows[i].id;
    return out;
  }

  // Move a row (with its nested items) past its previous / next sibling. Returns the new order of ids, or null.
  function moveUp(rows, i) {
    const ds = depths(rows);
    const j = prevSibling(ds, i);
    if (j === -1) return null;
    const e = subtreeEnd(ds, i);
    const ids = rows.map(r => r.id);
    return ids.slice(0, j).concat(ids.slice(i, e + 1), ids.slice(j, i), ids.slice(e + 1));
  }
  function moveDown(rows, i) {
    const ds = depths(rows);
    const e = subtreeEnd(ds, i);
    const k = e + 1;
    if (k >= rows.length || ds[k] !== ds[i]) return null;
    const e2 = subtreeEnd(ds, k);
    const ids = rows.map(r => r.id);
    return ids.slice(0, i).concat(ids.slice(k, e2 + 1), ids.slice(i, e + 1), ids.slice(e2 + 1));
  }
  // Where a new row "below row i" goes: after i's nested items.
  function insertIndex(rows, i) { return subtreeEnd(depths(rows), i) + 1; }
  // The parent a row at depth d placed at index pos would have (by sequence order).
  function parentFor(rows, pos, d) {
    const ds = depths(rows);
    const j = nearestAt(ds.slice(0, pos), pos, d - 1);
    return j === -1 ? '' : rows[j].id;
  }

  // ── Pasted tables of contents ─────────────────────────────────────────
  const COLS = ['itemTitle', 'author', 'contentType', 'startPage', 'endPage', 'notes'];
  const isRoman = s => SC.numbering.isRoman(s);
  const PAGE = '(\\d+|[ivxlcdm]+)';
  const RE_LEADERS = new RegExp('^(.*?\\S)\\s*[.·…_]{2,}\\s*' + PAGE + '(?:\\s*[-–]\\s*' + PAGE + ')?\\s*$', 'i');
  const RE_SPACES = /^(.*?\S)\s{2,}(\d+)(?:\s*[-–]\s*(\d+))?\s*$/;
  const RE_PP = new RegExp('^(.*?\\S)\\s*,?\\s+pp?\\.\\s*' + PAGE + '(?:\\s*[-–]\\s*' + PAGE + ')?\\s*$', 'i');
  const RE_BY = /^(.*?\S)[.,;:]?\s+by\s+(\S.*)$/i;
  const RE_BULLET = /^(?:[•◦▪‣·*]|[–—-](?=\s))\s*/;

  function pagesOf(line) {
    for (const re of [RE_LEADERS, RE_PP, RE_SPACES]) {
      const m = re.exec(line);
      if (!m) continue;
      const okPage = p => !p || /^\d+$/.test(p) || (re !== RE_SPACES && isRoman(p));
      if (okPage(m[2]) && okPage(m[3])) return { rest: m[1], start: m[2], end: m[3] || '' };
    }
    return null;
  }

  /* Lines of text -> [{ values, depth }].
     opts: startCol (column the paste begins in; default itemTitle), pages (find page numbers at
     line ends; default on), by (split "Title, by Author"), nest (two leading spaces = one level). */
  function parseLines(text, opts) {
    opts = opts || {};
    const startCol = COLS.indexOf(opts.startCol) === -1 ? 'itemTitle' : opts.startCol;
    const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n').filter(l => l.trim());
    const out = [];
    const stack = [];
    lines.forEach(line => {
      let depth = 0;
      if (opts.nest) {
        const w = /^[ \t]*/.exec(line)[0].replace(/\t/g, '  ').length;
        while (stack.length && stack[stack.length - 1] >= w) stack.pop();
        depth = stack.length; stack.push(w);
        line = line.replace(/^[ \t]+/, '');
      }
      const values = {};
      if (line.indexOf('\t') !== -1) {
        const cells = line.replace(/\s+$/, '').split('\t').map(c => c.trim());
        const at = COLS.indexOf(startCol);
        if (startCol === 'itemTitle' && cells.length === 2 && /^(\d+|[ivxlcdm]+)(\s*[-–]\s*(\d+|[ivxlcdm]+))?$/i.test(cells[1])) {
          const p = cells[1].split(/\s*[-–]\s*/);
          values.itemTitle = cells[0]; values.startPage = p[0]; if (p[1]) values.endPage = p[1];
        } else cells.forEach((c, k) => { if (at + k < COLS.length) values[COLS[at + k]] = c; });
      } else {
        let v = line.trim().replace(RE_BULLET, '');
        if (startCol === 'itemTitle') {
          const pg = opts.pages === false ? null : pagesOf(v);
          if (pg) { v = pg.rest; values.startPage = pg.start; if (pg.end) values.endPage = pg.end; }
          const by = opts.by ? RE_BY.exec(v) : null;
          if (by) { v = by[1]; values.author = by[2].trim(); }
        }
        values[startCol] = v;
      }
      // Fixed key order makes results easy to compare.
      const ordered = {};
      COLS.forEach(c => { if (c in values) ordered[c] = values[c]; });
      out.push({ values: ordered, depth });
    });
    return out;
  }

  SC.toc = { COLS, depths, subtreeEnd, prevSibling, indent, outdent, moveUp, moveDown, insertIndex, parentFor, parseLines };
})(globalThis.SC = globalThis.SC || {});

</script>
<script>/* js/core/names.js */
/* Slaughter Cataloger 3 — names: credits, headings and the name index.
   Contents keep each credit exactly as printed ("B.R.T.", "Benj. R. Tucker"). A name
   heading (an authority record) gathers the forms one person or body is credited under,
   and is the form an index files them under ("Tucker, Benjamin R.").
   Credits are matched to headings by a key that ignores case, spacing, punctuation and
   accents, so "B. R. Tucker", "B.R. Tucker" and "b r tucker" are one form. A heading
   matches its listed forms, its own form and that form in direct order.
   Pure; testable in Node. */
(function (SC) {
  'use strict';
  const str = v => (v == null ? '' : String(v));

  // One Author / Credit value may name several: separated by semicolons, by "&", or by a slash
  // between names ("J.M.L. Babcock/Tucker", a letter and its reply) but not between numbers ("1881/82").
  const splitCredits = v => str(v).split(/\s*;\s*|\s+&\s+|(?<=[^\d\s])\s*\/\s*(?=[^\d\s])/).map(s => s.trim()).filter(Boolean);
  // Forms listed on a heading are separated by " | " (as in the earlier authority lists); ";" is accepted too.
  const splitForms = v => str(v).split(/\s*[|;]\s*/).map(s => s.trim()).filter(Boolean);
  const joinForms = list => Array.from(new Set(list.map(s => s.trim()).filter(Boolean))).join(' | ');
  function nameKey(s) {
    return str(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '');
  }
  // Filing order is word by word, as in a printed index: "Tucker, B." < "Tucker, B. R." < "Tucker, Benjamin R." < "Tucker, Bertha".
  const sortKey = s => str(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, ' ').trim();

  // ── Reading a name ────────────────────────────────────────────────────
  const HONORIFICS = new Set(['rev', 'reverend', 'revd', 'dr', 'mr', 'mrs', 'ms', 'miss', 'mme', 'mlle', 'prof', 'professor', 'magister', 'magistra', 'deacon',
    'colonel', 'col', 'capt', 'captain', 'sir', 'dame', 'lord', 'lady', 'irrev', 'father', 'fr', 'brother', 'sister', 'comrade', 'citizen', 'gen', 'general',
    'maj', 'major', 'lt', 'sgt', 'hon', 'herr', 'frau', 'signor', 'señor', 'monsieur', 'madame']);
  const SUFFIXES = new Set(['jr', 'sr', 'ii', 'iii', 'iv', 'esq']);
  const PARTICLES = new Set(['von', 'van', 'de', 'del', 'della', 'der', 'den', 'du', 'la', 'le', 'da', 'di', 'dos', 'das', 'ten', 'ter', 'vom', 'zu', 'zur', 'af', 'y']);
  // Words that mark a body, a group or a description rather than a person's name.
  const CORPORATE = /(^|\s)(the|of|for|and|&|society|association|group|committee|press|club|league|union|institute|centre|center|order|temple|church|inc\.?|co\.|company|publishing|publishers|editors|editorial|staff|board|council|federation|party|movement|foundation|library|university|college|station|records|magazine|journal|newspaper|post|times|tribune|review|herald|gazette|news|weekly|monthly|quarterly|daily|bulletin|chronicle|observer|courier|express|mirror|spectator|various|anonymous|anon\.?|unknown|others)(\s|$)/i;
  // A credit may begin with what the person did: "translated by Thomas Common", "quoted by S.E. Parker".
  const ROLE = /^((?:translated|trans\.?|tr\.|edited|ed\.|compiled|selected|introduced|introduction|illustrated|drawn|written|quoted|reported|interviewed|reviewed|signed|letter|poem|verse|music|words|adapted|abridged)(?:\s+and\s+\w+)?\s+(?:by|from)\s+|by\s+)/i;
  const bare = t => t.replace(/[.,]/g, '').toLowerCase();
  // Old written abbreviations of forenames, so "Wm. Flygare" can be matched with "William Flygare".
  const ABBR = { wm: 'william', geo: 'george', chas: 'charles', jas: 'james', thos: 'thomas', jno: 'john', edw: 'edward', robt: 'robert',
    saml: 'samuel', benj: 'benjamin', jos: 'joseph', alex: 'alexander', fredk: 'frederick', richd: 'richard', danl: 'daniel', hy: 'henry' };
  const givenKey = t => { const k = nameKey(t); return ABBR[k] || k; };
  const isInitialism = s => /^([A-Z]\.\s?){2,5}$/.test(s.trim());
  const isInitial = t => /^[A-Za-z]\.?$/.test(t) || /^([A-Za-z]\.){2,}$/.test(t);

  /* "translated by Rev. Cliff Case [signed C.C.]" ->
     { role: 'translated by', honorifics: ['Rev.'], rest: 'Cliff Case', note: 'signed C.C.' } */
  function stripHonorifics(s) {
    let t = str(s).trim();
    let note = '';
    t = t.replace(/\s*\[([^\]]*)\]\s*$/, (m, x) => { note = x; return ''; }).trim();
    const rm = ROLE.exec(t);
    let role = rm ? rm[1].trim() : '';
    if (rm && t.length > rm[0].length) t = t.slice(rm[0].length).trim();
    // ... or end with it: "Benjamin R. Tucker, editor".
    t = t.replace(/,\s*(editor|eds?\.|translator|trans\.|compiler|comp\.|illustrator|publisher|author)\s*$/i, (m, x) => { role = role || x; return ''; }).trim();
    const toks = t.split(/\s+/);
    const hon = [];
    while (toks.length > 1 && HONORIFICS.has(bare(toks[0]))) hon.push(toks.shift());
    return { role, honorifics: hon, rest: toks.join(' '), note };
  }
  /* The parts of a personal name, either order:
     { surname, given: [tokens], particles: [tokens], suffix, initials: ['b','r'] } or null for
     a body, a single word or an initialism. */
  function parse(raw) {
    let s = stripHonorifics(raw).rest;
    if (!s || CORPORATE.test(' ' + s + ' ') || /\d/.test(s) || isInitialism(s)) return null;
    let suffix = '';
    const sm = /,\s*(jr\.?|sr\.?|ii|iii|iv|esq\.?)\s*$/i.exec(s);
    if (sm) { suffix = sm[1]; s = s.slice(0, sm.index).trim(); }
    let surname, given, particles = [];
    if (s.indexOf(',') !== -1) {                                    // "Tucker, Benjamin R." / "Mises, Ludwig von"
      const [a, b] = [s.slice(0, s.indexOf(',')).trim(), s.slice(s.indexOf(',') + 1).trim()];
      surname = a;
      given = b.split(/\s+/).filter(Boolean);
      while (given.length && PARTICLES.has(given[given.length - 1].toLowerCase())) particles.unshift(given.pop());
    } else {
      const toks = s.split(/\s+/).filter(Boolean);
      if (toks.length < 2) return null;
      if (!suffix && SUFFIXES.has(bare(toks[toks.length - 1])) && toks.length > 2) suffix = toks.pop();
      surname = toks.pop();

  }

     "Benjamin R. Tucker" -> "Tucker, Benjamin R."; "Ludwig von Mises" -> "Mises, Ludwig von";

  function directOrder(heading) {

  /* index(state) -> {

       headingOfKey: Map<key, authorityID>,
       entries: [{ id, kind: 'heading'|'name', label, sort, keys, forms: [{raw, count}], count, authority? }]  alphabetical

      const f = forms.get(key);

      else if (headingOfKey.get(k) !== a.authorityID) conflicts.push({ key: k, authorityIDs: [headingOfKey.get(k), a.authorityID] });
    }));

    const entries = [];

      const keys = Array.from(forms.keys()).filter(k => headingOfKey.get(k) === a.authorityID);

    });

      if (headingOfKey.has(f.key)) return;

      entries.push({ id: 'k:' + f.key, kind: 'name', label: fl[0].raw, sort: sortKey(suggestHeading(fl[0].raw).name), keys: [f.key], forms: fl, count: f.count });

  }

  // ── Forms that are probably the same person ───────────────────────────
  // Same surname; initials that agree as far as both go; spelled-out names that agree as far as both go.
  function compatible(a, b) {

    const names = [];
    ix.entries.forEach(e => { if (e.kind === 'name') { const p = parse(e.label); names.push({ e, p }); } });
    const people = names.filter(x => x.p).sort((a, b) => weight(b.p) - weight(a.p) || b.e.count - a.e.count);
    const groups = [], bySurname = new Map();
    people.forEach(x => {
      const same = bySurname.get(x.p.sk) || [];
      let fits = same.filter(g => g.members.every(m => compatible(m.p, x.p)));
      // Where a form fits several, the group that agrees on more initials wins ("B. R. Tucker": Benjamin R., not Bertha).
      if (fits.length > 1) {
        const score = g => Math.max.apply(null, g.members.map(m => shared(m.p, x.p)));
        const best = Math.max.apply(null, fits.map(score));

      else if (!fits.length) { const g = { members: [x] }; groups.push(g); same.push(g); bySurname.set(x.p.sk, same); }
    });

    names.filter(x => !x.p && isInitialism(x.e.label)).forEach(x => {
      const letters = x.e.label.replace(/[^A-Za-z]/g, '').toLowerCase();
      const fits = groups.filter(g => g.members.some(m => m.p && m.p.initials.join('') + nameKey(m.p.surname).charAt(0) === letters));
      if (fits.length === 1) fits[0].members.push(x);

      // The fullest form leads: most spelled-out forenames, then the longest, then the most credited.
      const letters = p => p.given.filter(t => !isInitial(t)).join('').replace(/\./g, '').length;
      const lead = g.members.filter(m => m.p).sort((a, b) => weight(b.p) - weight(a.p) || letters(b.p) - letters(a.p) || b.e.count - a.e.count)[0];
      return {
        keys: g.members.map(m => m.e.keys[0]),
        forms: [].concat.apply([], g.members.map(m => m.e.forms)).sort((a, b) => b.count - a.count),
        count: g.members.reduce((n, m) => n + m.e.count, 0),

    }).sort((a, b) => b.count - a.count);
  }

  function cleanCredit(raw) { const h = stripHonorifics(raw); return { name: h.rest, role: h.role, honorifics: h.honorifics.join(' '), note: h.note }; }

<script>/* js/core/catalog.js */
/* Slaughter Cataloger 3 — the catalog view model.
   Every Compiler output, and the typeset entry at the top of the editors, reads titles,
   issues and contents through here: values with inheritance resolved, field states,
   nesting depth, and one way of writing numbering, dates and physical facts.
   Pure; testable in Node.

   Text with uncertain values is built as a list of "parts": plain strings, and
   { text, spec } pieces for record values. toText / toHTML write a parts list with
   speculative values in bibliographic brackets: [1881?]. */

  'use strict';
  const S = SC.schema, N = SC.numbering;
  const TENT = S.entities.title, IENT = S.entities.issue, CENT = S.entities.content;
  const str = v => (v == null ? '' : String(v));
  const has = v => str(v).trim() !== '';
  const inList = (list, h) => !!list && list.indexOf(h) !== -1;

  // ── Views: values and field states of one record ─────────────────────
  function statesOf(ent, rec, keys) {
    const v = {}, spec = new Set(), na = new Set();
    ent.fields.forEach(c => {
      v[c.key] = rec && rec[c.key] != null ? rec[c.key] : '';
      if (rec && inList(rec.spec, c.header)) spec.add(c.key);
      if (rec && inList(rec.na, c.header)) na.add(c.key);
    });
    return { v, spec, na };
  }
  function titleView(t, tid) {
    const x = statesOf(TENT, t);
    return Object.assign(x, { kind: 'title', id: t ? t.titleID : tid, rec: t || null });
  }
  // An issue's own values, with the twelve title-level fields taken from the title unless the issue overrides them.
  function issueView(i, t) {
    const x = statesOf(IENT, i);
    const inherited = new Set();

      if (!SC.records.inherits(i, t, k)) return;

      x.v[k] = t[tk] == null ? '' : t[tk];

      const ownSpec = x.spec.has(k);
      x.spec.delete(k); x.na.delete(k);
      if (ownSpec || inList(t.spec, tc.header)) x.spec.add(k);
      if (inList(t.na, tc.header)) x.na.add(k);
      inherited.add(k);
    });

  }
  function contentView(c, depth, parent) {
    const x = statesOf(CENT, c);
    return Object.assign(x, { kind: 'content', id: c.contentID, issueID: c.issueID, rec: c, depth: depth || 0, parentTitle: parent ? parent.itemTitle : '' });
  }

  // ── Parts ─────────────────────────────────────────────────────────────
  // A record value as a part; N/A values are left out.
  const part = (view, key, text) => ({ text: text != null ? str(text) : str(view.v[key]), spec: view.spec.has(key) });
  const val = (view, key) => (view.na.has(key) ? '' : str(view.v[key]).trim());

    const m = /^\[(.*)\]$/.exec(t.trim());

  function toText(parts, opts) {
    const marks = !opts || opts.marks !== false;
    return (parts || []).map(p => (typeof p === 'string' ? p : marks && p.spec ? bracket(p.text) : p.text)).join('');
  }

    return str(v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    return lists.filter(l => l && l.length).reduce((acc, l, k) => (k ? acc.concat([sep], l) : l.slice()), []);
  }

    const segs = [];
    if (val(iv, 'series')) segs.push([part(iv, 'series')].concat(val(iv, 'seriesNumber') ? [', no. ', part(iv, 'seriesNumber')] : []));
    if (val(iv, 'volume')) segs.push(['Vol. ', part(iv, 'volume')]);
    if (val(iv, 'issue')) segs.push(['no. ', part(iv, 'issue')]);
    let out = join(segs, ', ');
    if (val(iv, 'number')) out = out.length ? out.concat([' (whole no. ', part(iv, 'number'), ')']) : ['no. ', part(iv, 'number')];
    if (typeof out[0] === 'string') out[0] = lead(out[0]);

  }

  function dateOf(iv, opts) {
    const full = !opts || opts.full !== false;
    const months = val(iv, 'months'), day = val(iv, 'day'), year = val(iv, 'year'), end = val(iv, 'yearEnd');
    const p = N.parsePeriod(months);
    const mtext = p ? N.periodLabel(p.idx, p.kind, { full: full ? true : p.full, autumn: p.autumn }) : months;
    const md = join([months ? [part(iv, 'months', mtext)] : [], day ? [part(iv, 'day')] : []], ' ');

    if (md.length && years.length) return md.concat([day ? ', ' : ' '], years);
    if (md.length || years.length) return md.length ? md : years;

  }
  // "4 pp.; 8.5 × 11 in; 5 cents"
  function physical(iv) {
    const pages = val(iv, 'pages');
    return join([
      pages ? [part(iv, 'pages', /^\d+$/.test(pages) ? pages + ' pp.' : pages)] : [],
      val(iv, 'size') ? [part(iv, 'size', val(iv, 'size') + (val(iv, 'sizeUnit') ? ' ' + val(iv, 'sizeUnit') : ''))] : [],
      val(iv, 'price') ? [part(iv, 'price')] : []

  // "Special Poetry Issue. Supplement: Index. City edition"
  function kindOf(iv) {
    const v = iv.v;
    return join([
      v.specialIssue ? (val(iv, 'issueDesignation') ? [part(iv, 'issueDesignation')] : ['Special issue']) : [],
      !v.specialIssue && val(iv, 'issueDesignation') ? [part(iv, 'issueDesignation')] : [],

  }
  // How the issue is named in lists and headings: short name, else its numbers, else its date.
  function label(iv) {

    const n = numbering(iv);

  /* The typeset entry: { title, body, sub } where body follows "<title>." —

  function entry(iv, tv) {

    if (!s) return [part(cv, 'endPage')];

  // "New York, NY: Benj. R. Tucker"
  function imprint(v) {
    const place = join([val(v, 'city') ? [part(v, 'city')] : [], val(v, 'state') ? [part(v, 'state')] : [], val(v, 'country') ? [part(v, 'country')] : []], ', ');
    const pub = val(v, 'publisher') ? [part(v, 'publisher')] : [];
    return join([place, pub], ': ');
  }

  // ── Runs ──────────────────────────────────────────────────────────────
  function runYears(ivs, tv) {
    const ys = [];
    ivs.forEach(iv => [iv.v.year, iv.v.yearEnd].forEach(y => { const m = /\d{4}/.exec(str(y)); if (m) ys.push(parseInt(m[0], 10)); }));
    if (ys.length) { const a = Math.min.apply(null, ys), b = Math.max.apply(null, ys); return a === b ? String(a) : a + '–' + b; }
    return tv && val(tv, 'firstYear') ? val(tv, 'firstYear') : '';
  }
  /* Long runs read better in sections: by volume when the run has volumes, else by year.
     Runs of ten issues or fewer stay in one section. Returns [{ key, label, issues }]. */
  function sections(ivs, threshold) {
    if (ivs.length <= (threshold == null ? 10 : threshold)) return [{ key: 'all', label: '', issues: ivs }];
    const byVol = ivs.some(iv => val(iv, 'volume'));
    const groups = new Map();
    ivs.forEach(iv => {
      const k = byVol ? (val(iv, 'volume') || '—') : ((/\d{4}/.exec(val(iv, 'year')) || ['—'])[0]);
      if (!groups.has(k)) groups.set(k, []);
      groups.get(k).push(iv);

    return Array.from(groups.entries()).map(([k, list]) => {
      const yrs = runYears(list, null);
      const label = byVol ? (k === '—' ? (yrs ? 'Unnumbered (' + yrs + ')' : 'Unnumbered') : 'Volume ' + k + (yrs ? ' (' + yrs + ')' : '')) : (k === '—' ? 'Undated' : k);
      return { key: (byVol ? 'vol:' : 'yr:') + k, label, issues: list };

  }
  /* build(store, opts) for the titles in opts.titleIDs (alphabetical; titles with no

    const counts = { titles: 0, issues: 0, contents: 0 };
    const titles = tids.map(tid => {
      const t = st.titles.get(tid) || null;
      const tv = titleView(t, tid);
      let list = store.issuesOfTitle(tid);
      if (opts.issueIDs) list = list.filter(i => opts.issueIDs.has(i.issueID));
      const total = list.length;
      const shown = opts.limit != null ? list.slice(0, opts.limit) : list;
      counts.titles++; counts.issues += total;
      list.forEach(i => { counts.contents += contentsOf(store, i.issueID, opts.nested).length; });
      const ivs = shown.map(i => Object.assign(issueView(i, t), { contents: contentsOf(store, i.issueID, opts.nested) }));

      return Object.assign(tv, { name, issues: ivs, total, runYears: runYears(allIvs, tv) });
    });

      partial: opts.limit != null && titles.some(t => t.issues.length < t.total) };
  }

    const items = store.contentsOfIssue(issueID);

    const byId = new Map(items.map(c => [c.contentID, c]));

    items.forEach((c, k) => { if (nested !== false || !depths[k]) out.push(contentView(c, nested === false ? 0 : depths[k], byId.get(c.parentID))); });
    return out;
  }
  // Volume or year sections of one title's run, for choosing what to compile.
  function scopeGroups(store, titleID) {
    const t = store.state.titles.get(titleID) || null;
    return sections(store.issuesOfTitle(titleID).map(i => issueView(i, t)), 0).map(g => ({ key: g.key, label: g.label || 'All issues', issueIDs: g.issues.map(iv => iv.id) }));
  }

    titleView, issueView, contentView, part, val, toText, toHTML, esc, join, close, bracket,
    numbering, dateOf, physical, kindOf, label, entry, pagesOf, imprint, titleOfIssue,
    runYears, sections, build, scopeGroups, titleOrder, sortKey

})(globalThis.SC = globalThis.SC || {});

<script>/* js/core/outputs.js */
/* Slaughter Cataloger 3 — Compiler outputs.
   Each builder takes a view model from catalog.build() and options, and returns the
   finished text of one file. Pure; testable in Node.

      if (val(tv, 'mission')) out.push('<!-- wp:quote -->\n<blockquote class="wp-block-quote"><!-- wp:paragraph -->\n<p>' + H([part(tv, 'mission')], o) + '</p>\n<!-- /wp:paragraph --></blockquote>\n<!-- /wp:quote -->');
      ['pubHistory', 'editorial', 'biblioNote'].forEach(k => { if (val(tv, k)) out.push(para(H([part(tv, k)], o))); });
      const secs = C.sections(tv.issues);
      const grouped = secs.some(s => s.label);
      secs.forEach(sec => {
        if (sec.label) out.push(heading(base, esc(sec.label)));
        sec.issues.forEach(iv => {
          out.push(separator());
          out.push(heading(grouped ? base + 1 : base, H(C.label(iv), o), iv.id));
          const lines = [];
          if (overridden(iv, 'subtitle')) lines.push('<em>' + H([part(iv, 'subtitle')], o) + '</em>');
          const num = C.numbering(iv), date = C.dateOf(iv);
          const meta = join([val(iv, 'shortname') ? join([num, date], ' — ') : (num.length ? date : []), C.kindOf(iv)], ' | ');
          if (meta.length) lines.push(H(meta, o));
          if (overridden(iv, 'editors')) lines.push('Edited by ' + H([part(iv, 'editors')], o));
          const phys = C.physical(iv);
          const extra = val(iv, 'printer') ? ['Printed by ', part(iv, 'printer')].concat(val(iv, 'printerLocation') ? [', ', part(iv, 'printerLocation')] : []) : [];
          const pp = join([phys, extra], ' · ');
          if (pp.length) lines.push('<span style="color:#555;font-size:0.9em;">' + H(pp, o) + '</span>');
          if (lines.length) out.push(para(lines.join('<br>')));
          if (val(iv, 'notes')) out.push(para('<em style="color:#555;font-size:0.9em;">' + H([part(iv, 'notes')], o) + '</em>'));
          if (iv.contents.length) {
            const rows = iv.contents.map(cv => {
              const nest = cv.depth ? '\u00a0\u00a0'.repeat(cv.depth - 1) + '└\u00a0' : '';
              const type = o.types && val(cv, 'contentType') ? '<span style="font-size:0.8em;color:#888;"> — ' + H([part(cv, 'contentType')], o) + '</span>' : '';
              return '<tr><td style="' + TD_PG + '">' + H(C.pagesOf(cv), o) + '</td><td style="' + TD + '"><span style="color:#111;">' + nest +
                H(val(cv, 'itemTitle') ? [part(cv, 'itemTitle')] : [], o) + '</span>' + type + '</td><td style="' + TD + 'color:#555;">' +
                H(val(cv, 'author') ? [part(cv, 'author')] : [], o) + '</td></tr>';
            }).join('');
            out.push('<!-- wp:table {"hasFixedLayout":false} -->\n<figure class="wp-block-table" style="margin:0 !important;"><table style="' + TBL + '"><thead><tr><th style="' + TH +
              'width:3em;text-align:right;padding-right:12px;">Pg.</th><th style="' + TH + '">Item</th><th style="' + TH + '">Author</th></tr></thead><tbody>' + rows +
              '</tbody></table></figure>\n<!-- /wp:table -->');
          }
        });
      });
    });
    out.push(attribution('wp', vm.date));
    return out.filter(Boolean).join('\n\n') + '\n';
  }

  // ── Proofing catalog ──────────────────────────────────────────────────
  // Every issue field, in the order a reviewer checks them against the issue in hand.
  const PROOF_ISSUE = ['Short Name', 'Title', 'Subtitle', 'Former Title(s)', 'Later Title(s)', 'Volume', 'Issue', 'Whole No.', 'Series', 'Series Number',
    'Year', 'End Year', 'Month(s)', 'Date Type', 'Day', 'Date as Printed', 'Year Calendar', 'Calendar Note', 'Special Issue', 'Issue Designation', 'Supplement',
    'Supplement Label', 'Edition', 'Publisher', 'Editor(s)', 'Contributors', 'Printer', 'Printer Location', 'City', 'State', 'Country', 'Language', 'Frequency',
    'ISSN', 'Price', 'Pages', 'Size', 'Size Unit', 'Evidence Basis', 'Evidence Note', 'Notes on Issue'];
  const PROOF_TITLE = ['Canonical Title', 'Original / First Published Title', 'Subtitle', 'Former Title(s)', 'Later Title(s)', 'Related Title(s)', 'Publisher',
    'Editor(s)', 'City', 'State / Province', 'Country', 'Language', 'Frequency', 'ISSN', 'First Year of Publication (CE)', 'First Year Note',
    'Publication History Note', 'Mission Statement / Prospectus', 'Introduction / Editorial Statement', 'Bibliographic Note', 'General Notes',
    'Cataloging Status', 'Total Known Issues'];
  const PROOF_CSS = [
    '@page{size:letter;margin:0.55in;}',
    'body{font-family:Georgia,"Times New Roman",serif;color:#111;background:#fff;font-size:10.5pt;line-height:1.35;margin:0 auto;padding:24px;max-width:8in;}',
    'h1{font-size:16pt;margin:0 0 6pt;}h2{font-size:13pt;margin:16pt 0 6pt;border-bottom:1pt solid #999;padding-bottom:3pt;}h3{font-size:11pt;margin:12pt 0 4pt;}',
    'table{width:100%;border-collapse:collapse;margin:4pt 0 10pt;font-size:9.5pt;}',
    'th,td{border:1pt solid #999;padding:3pt 5pt;vertical-align:top;}th{background:#f0f0f0;text-align:left;}',
    '.pc{width:0.3in;text-align:center;font-size:12pt;}.pl{width:1.45in;}.pv{width:2.3in;word-break:break-word;}.ps{width:0.85in;}.pn{min-width:1.7in;}',
    '.id-line{font-family:"Courier New",monospace;font-size:9pt;color:#333;margin:2pt 0;}',
    '.dim{color:#888;}.q{font-weight:bold;}.small{font-size:8pt;color:#555;}',
    '.legend td,.meta-block td{border:none;padding:2pt 10pt 2pt 0;}table.legend{width:auto;}',
    'table.ct{font-size:9pt;}.ct .c-seq{width:0.35in;}.ct .c-pg{width:0.55in;}.ct .c-type{width:0.8in;}.ct .c-au{width:1.25in;}.ct .c-st{width:0.85in;}.ct .c-fix{width:1.3in;}',
    '.ct tr.note-row td{border-top:none;padding-top:0;}.ct tbody.item tr:first-child td{border-bottom-color:#ddd;}',
    'tbody.item{break-inside:avoid;page-break-inside:avoid;}',
    '.meta-block{background:#f8f8f8;border:1pt solid #ddd;}',
    '.signoff{margin-top:12pt;padding:8pt;border:1pt solid #bbb;break-inside:avoid;page-break-inside:avoid;}',
    '.signoff table{margin:4pt 0;}.signoff td{border:none;padding:4pt 6pt;}',
    '.blank-line{display:block;border-bottom:1pt solid #999;height:0.26in;}',
    '.proof-explainer,.proof-title-page,.proof-issue{padding-bottom:18pt;}',
    '@media screen{.proof-title-page,.proof-issue{border-top:3px double #999;padding-top:12pt;}}',
    '@media print{body{padding:0;max-width:none;}.proof-explainer,.proof-title-page{break-after:page;page-break-after:always;}',
    '.proof-issue{break-before:page;page-break-before:always;}tr{break-inside:avoid;page-break-inside:avoid;}h2,h3{break-after:avoid;}}',
    '.sc-attribution{margin-top:2em;font-size:8pt;color:#999;}.sc-attribution a{color:inherit;}'
  ].join('\n');

  function proofCell(view, c, value, o) {
    // Value as recorded; [N/A] and [blank] in grey; status from the field's state.
    let shown, status;
    if (c.type === 'bool') { shown = esc(view.v[c.key] ? 'Yes' : 'No'); status = 'Filled'; }
    else if (view.na.has(c.key)) { shown = '<span class="dim">[N/A]</span>'; status = '<span class="dim">[N/A]</span>'; }
    else if (!C.val(view, c.key)) { shown = '<span class="dim">[blank]</span>'; status = c.states === false ? '' : '<span class="dim">[blank]</span>'; }
    else { shown = esc(value != null ? value : C.val(view, c.key)); status = view.spec.has(c.key) ? '<span class="q">?</span>' : 'Filled'; }
    if (view.inherited && view.inherited.has(c.key)) status += ' <span class="small">from title</span>';
    return { shown, status };
  }
  function proofTable(view, ent, headers, extra) {
    const rows = headers.map(h => ent.byHeader.get(h)).filter(Boolean).map(c => {
      const x = proofCell(view, c);
      return '<tr><td class="pc">☐</td><td class="pl"><b>' + esc(c.header) + '</b></td><td class="pv">' + x.shown + '</td><td class="ps">' + x.status + '</td><td class="pn"></td></tr>';
    }).concat((extra || []).map(([label, value]) => '<tr><td class="pc">☐</td><td class="pl"><b>' + esc(label) + '</b></td><td class="pv">' +
      (value ? esc(value) : '<span class="dim">[none]</span>') + '</td><td class="ps"></td><td class="pn"></td></tr>'));
    return '<table><thead><tr><th class="pc"></th><th class="pl">Field</th><th class="pv">Value</th><th class="ps">Status</th><th class="pn">Correction / notes</th></tr></thead><tbody>\n' +
      rows.join('\n') + '\n</tbody></table>';
  }
  const signoff = '<div class="signoff"><table><tbody>' +
    '<tr><td style="width:1.9in"><b>Reviewer:</b></td><td><span class="blank-line" style="width:2in"></span></td><td style="width:1.3in"><b>Date reviewed:</b></td><td><span class="blank-line" style="width:1.2in"></span></td></tr>' +
    '<tr><td><b>Corrections entered:</b></td><td>☐ Yes &nbsp; ☐ No</td><td><b>Needs follow-up:</b></td><td>☐ Yes &nbsp; ☐ No</td></tr>' +
    '</tbody></table><b>General notes:</b><span class="blank-line"></span><span class="blank-line"></span><span class="blank-line"></span></div>';

  function proofing(vm, opts) {
    const o = Object.assign({ files: {} }, opts);
    const lib = vm.library.slug || '';
    const h = [];
    h.push('<section class="proof-explainer">');
    h.push('<h1>Slaughter Cataloger proofing catalog</h1>');
    h.push('<p>This document is for checking Slaughter Cataloger records against the physical issues or reliable source images. Each issue begins on a new page, and no page holds two issues. Tick each field as you verify it. Write corrections in the right-hand column or in the margin, then make them in Slaughter Cataloger.</p>');
    h.push('<p>Values marked <b>?</b> were recorded as speculative: inferred, uncertain, or taken from a secondary source. Check those first. Fields marked <i>from title</i> are not recorded on the issue itself but inherited from the title record; correct them there unless this issue differs.</p>');
    h.push('<h2>Legend</h2><table class="legend"><tbody>' + [
      ['☐', 'Not yet checked'], ['✓', 'Checked by the reviewer'], ['?', 'Marked speculative in the record'], ['[N/A]', 'Marked not applicable in the record'],
      ['[blank]', 'Not yet addressed in the record'], ['from title', 'Inherited from the title record'], ['TitleID', 'Permanent title identifier, e.g. LIBERTYX-1881'],
      ['IssueID', 'Permanent issue identifier, e.g. LIBERTYX-1881-KRT8NK2'], ['ContentID', 'Permanent contents-item identifier, e.g. LIBERTYX-1881-C7M4Q2B']
    ].map(([a, b]) => '<tr><td><b>' + esc(a) + '</b></td><td>' + esc(b) + '</td></tr>').join('') + '</tbody></table>');
    h.push('<h2>Summary</h2><table class="meta-block"><tbody>');
    const row = (a, b) => h.push('<tr><td><b>' + esc(a) + '</b></td><td>' + b + '</td></tr>');
    row('Library', esc(vm.library.name || lib) + (vm.library.name && lib ? ' <code>' + esc(lib) + '</code>' : ''));
    row('Generated', esc(longDate(vm.date)));
    row(vm.titles.length === 1 ? 'Title' : 'Titles', vm.titles.map(tv => '<b>' + esc(tv.name) + '</b> <code>' + esc(tv.id) + '</code>').join('<br>'));
    row('Issues', esc(plural(vm.counts.issues, 'issue')));
    row('Contents items', esc(plural(vm.counts.contents, 'item')));
    vm.titles.forEach(tv => {
      const f = o.files[tv.id] || {};
      if (f.issues || f.contents) row('Files' + (vm.titles.length > 1 ? ', ' + tv.name : ''), [f.issues, f.contents].filter(Boolean).map(n => '<code>' + esc(n) + '</code>').join('<br>'));
    });
    h.push('</tbody></table></section>');

    vm.titles.forEach(tv => {
      const f = o.files[tv.id] || {};
      h.push('<section class="proof-title-page">');
      h.push('<h1>Title proof sheet: ' + esc(tv.name) + '</h1>');
      h.push('<div class="id-line">TitleID: ' + esc(tv.id) + '</div>');
      if (!tv.rec) h.push('<p><b>This title is not in the Titles file.</b> Its issues are proofed below without title-level values.</p>');
      else h.push(proofTable(tv, TENT, PROOF_TITLE, [['TitleID', tv.id], ['Title Code', tv.rec.titleCode], ['Issues file', f.issues], ['Contents file', f.contents]]));
      h.push('<div class="signoff"><b>Title-level review notes:</b><span class="blank-line"></span><span class="blank-line"></span></div>');
      h.push('</section>');
      tv.issues.forEach(iv => {
        h.push('<section class="proof-issue">');
        h.push('<h2>' + esc(tv.name) + ' — ' + esc(T(C.label(iv))) + '</h2>');
        h.push('<div class="id-line">TitleID: ' + esc(tv.id) + ' · IssueID: ' + esc(iv.id) + '</div>');
        const num = T(C.numbering(iv)), date = T(C.dateOf(iv, { printed: false }));
        if (num || date) h.push('<div class="id-line">' + esc([num, date].filter(Boolean).join(' — ')) + '</div>');
        if (val(iv, 'datePrinted')) h.push('<div class="id-line">Date as printed: ' + esc(val(iv, 'datePrinted')) + '</div>');
        h.push('<h3>Issue fields</h3>');
        h.push(proofTable(iv, IENT, PROOF_ISSUE, [
          ['Speculative Fields', (iv.rec.spec || []).join('; ')], ['N/A Fields', (iv.rec.na || []).join('; ')], ['IssueID', iv.id], ['TitleID', tv.id]
        ]));
        if (iv.contents.length) {
          h.push('<h3>Contents (' + esc(plural(iv.contents.length, 'item')) + ')</h3>');
          h.push('<table class="ct"><thead><tr><th class="pc"></th><th class="c-seq">Seq.</th><th class="c-pg">Page(s)</th><th class="c-type">Type</th><th>Item title</th>' +
            '<th class="c-au">Author / credit</th><th class="c-st">Status</th><th class="c-fix">Correction / notes</th></tr></thead>');
          iv.contents.forEach(cv => {
            const cell = k => cv.na.has(k) ? '<span class="dim">[N/A]</span>' : val(cv, k) ? H([part(cv, k)]) : '<span class="dim">[blank]</span>';
            const specs = Array.from(cv.spec).map(k => CENT.byKey.get(k).label);
            const status = specs.length ? '<span class="q">?</span> <span class="small">' + esc(specs.join(', ')) + '</span>' : !val(cv, 'itemTitle') ? '<span class="dim">[blank]</span>' : 'Filled';
            const pg = C.pagesOf(cv);
            // An item and its note stay together on the page; the note runs the full width.
            h.push('<tbody class="item"><tr><td class="pc">☐</td><td>' + esc(val(cv, 'sequence')) + '</td><td>' + (pg.length ? H(pg) : '<span class="dim">[blank]</span>') + '</td><td>' + cell('contentType') + '</td>' +
              '<td>' + (cv.depth ? '<span class="small">' + '› '.repeat(cv.depth) + '</span>' : '') + cell('itemTitle') +
              (cv.parentTitle ? '<br><span class="small">in “' + esc(cv.parentTitle) + '”</span>' : '') + '</td>' +
              '<td>' + cell('author') + '</td><td>' + status + '</td><td></td></tr>' +
              (val(cv, 'notes') ? '<tr class="note-row"><td></td><td colspan="7"><span class="small">Note: ' + H([part(cv, 'notes')]) + '</span></td></tr>' : '') + '</tbody>');
          });
          h.push('</table>');
        } else h.push('<p class="small">No contents items recorded for this issue.</p>');
        h.push(signoff);
        h.push('</section>');
      });
    });
    h.push(attribution('html', vm.date));
    return docShell('Proofing catalog — ' + (vm.titles.length === 1 ? vm.titles[0].name : vm.library.name || lib) + ' — ' + isoDate(vm.date), PROOF_CSS, h.join('\n'));
  }

  // ── RIS ───────────────────────────────────────────────────────────────
  const risClean = s => String(s == null ? '' : s).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim().replace(/^ER {2}-/, 'ER -');
  // The headings of a view model: credit -> heading record, by match key.
  function headingLookup(vm) {
    const byKey = new Map();
    Array.from((vm.authorities || new Map()).values()).sort((a, b) => (a.entryOrder || 1e9) - (b.entryOrder || 1e9))
      .forEach(a => NM.headingKeys(a).forEach(k => { if (!byKey.has(k)) byKey.set(k, a); }));
    return raw => byKey.get(NM.nameKey(raw)) || null;
  }
  // Authors of an item for a reference manager: the heading where there is one (surname first,
  // as Zotero and JabRef expect), otherwise the credit without a role ("translated by").
  function authorsOf(cv, lookup, useHeadings) {
    return NM.splitCredits(val(cv, 'author')).map(raw => {
      const a = useHeadings !== false && lookup(raw);
      return { raw, name: a ? a.name : (NM.cleanCredit(raw).name || raw), type: a ? a.nameType : '' };
    });
  }
  const specLabels = view => Array.from(view.spec).map(k => (view.kind === 'content' ? CENT : IENT).byKey.get(k).header);
  function risDate(iv) {
    if (val(iv, 'datePrinted')) return val(iv, 'datePrinted');
    return T(C.dateOf(iv, { printed: false }), { marks: false });
  }
  function ris(vm, opts) {
    const o = Object.assign({ headings: true }, opts);
    const lookup = headingLookup(vm);
    const recs = [];
    const slug = vm.library.slug;
    vm.titles.forEach(tv => tv.issues.forEach(iv => iv.contents.forEach(cv => {
      const L = [];
      const add = (tag, v) => { const c = risClean(v); if (c) L.push(tag + '  - ' + c); };
      L.push('TY  - JOUR');
      add('TI', val(cv, 'itemTitle'));
      const au = authorsOf(cv, lookup, o.headings);
      au.forEach(a => add('AU', a.name));
      add('T2', tv.name);
      add('PY', (/\d{4}/.exec(val(iv, 'year')) || [''])[0]);
      add('DA', risDate(iv));
      add('VL', val(iv, 'volume'));
      add('IS', val(iv, 'issue') || val(iv, 'number'));
      add('SP', val(cv, 'startPage'));
      add('EP', val(cv, 'endPage'));
      add('SN', val(iv, 'issn'));
      add('LA', val(iv, 'language'));
      if (slug) add('KW', slug);
      add('KW', tv.id); add('KW', iv.id);
      add('KW', val(cv, 'contentType'));
      add('N1', 'Slaughter Cataloger TitleID: ' + tv.id);
      add('N1', 'Slaughter Cataloger IssueID: ' + iv.id);
      add('N1', 'Slaughter Cataloger ContentID: ' + cv.id);
      if (val(cv, 'contentType')) add('N1', 'Content Type: ' + val(cv, 'contentType'));
      if (cv.parentTitle) add('N1', 'Part of: ' + cv.parentTitle);
      const spec = specLabels(cv).concat(specLabels(iv).map(l => l + ' (issue)'));
      if (spec.length) add('N1', 'Speculative fields: ' + spec.join('; '));
      if (au.some(a => a.name !== a.raw)) add('N1', 'Credited as: ' + val(cv, 'author'));
      if (val(cv, 'notes')) add('N1', val(cv, 'notes'));
      L.push('ER  - ');
      recs.push(L.join('\n'));
    })));
    return recs.join('\n\n') + '\n\n' + attribution('ris', vm.date) + '\n';
  }

  // ── BibTeX ────────────────────────────────────────────────────────────
  const MONTH_MACROS = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  // Plain text to BibTeX: TeX's special characters escaped, and TeX's ligatures broken up so
  // that what is printed is what was typed ("--" stays two hyphens, "<" stays "<", '' stays two
  // apostrophes). Checked against Better BibTeX's parser in tools/test-formats.js.
  const bibEsc = s => String(s == null ? '' : s).replace(/[\r\n]+/g, ' ').replace(/\s+/g, ' ').trim()
    .replace(/[\\{}&%$#_~^<>`]/g, ch => ({ '\\': '\\textbackslash{}', '~': '\\textasciitilde{}', '^': '\\textasciicircum{}', '<': '\\textless{}', '>': '\\textgreater{}', '`': '\\textasciigrave{}' })[ch] || '\\' + ch)
    .replace(/-(?=-)/g, '-{}').replace(/'(?=')/g, "'{}").replace(/([?!])(?=\\textasciigrave)/g, '$1{}');
  // A name BibTeX would read as two people ("Smith and Sons") or as surname, forename
  // ("Liberty Co., Inc.") is braced as one corporate name.
  const bibName = a => {
    const corporate = a.type === 'Corporate body' || (!a.type && NM.suggestHeading(a.raw).nameType === 'Corporate body');
    return corporate || /\band\b/i.test(a.name) ? '{' + bibEsc(a.name) + '}' : bibEsc(a.name);
  };
  function bibtex(vm, opts) {
    const o = Object.assign({ headings: true }, opts);
    const lookup = headingLookup(vm);
    const recs = [];
    const slug = vm.library.slug;
    vm.titles.forEach(tv => tv.issues.forEach(iv => iv.contents.forEach(cv => {
      const F = [];
      const add = (k, v) => { const e = bibEsc(v); if (e) F.push('  ' + k + ' = {' + e + '}'); };
      // Titles keep their capitals: the inner braces tell BibTeX styles not to change case.
      const addKeepCase = (k, v) => { const e = bibEsc(v); if (e) F.push('  ' + k + ' = {{' + e + '}}'); };
      addKeepCase('title', val(cv, 'itemTitle'));
      const au = authorsOf(cv, lookup, o.headings).filter(a => a.name);
      if (au.length) F.push('  author = {' + au.map(bibName).join(' and ') + '}');
      addKeepCase('journal', tv.name);
      add('year', (/\d{4}/.exec(val(iv, 'year')) || [''])[0]);
      const p = SC.numbering.parsePeriod(val(iv, 'months'));
      if (p && p.kind === 'months' && p.idx.length === 1) F.push('  month = ' + MONTH_MACROS[p.idx[0]]);
      add('volume', val(iv, 'volume'));
      add('number', val(iv, 'issue') || val(iv, 'number'));
      const s = val(cv, 'startPage'), e = val(cv, 'endPage');
      if (s && e && e !== s) F.push('  pages = {' + bibEsc(s) + '--' + bibEsc(e) + '}');     // "--": the en dash of a page range
      else add('pages', s || e);
      add('issn', val(iv, 'issn'));
      add('language', val(iv, 'language'));
      add('keywords', [slug, tv.id, iv.id, val(cv, 'contentType')].filter(Boolean).join(', '));
      const notes = [];
      if (val(iv, 'datePrinted')) notes.push('Dated: ' + val(iv, 'datePrinted'));
      if (cv.parentTitle) notes.push('Part of: ' + cv.parentTitle);
      if (au.some(a => a.name !== a.raw)) notes.push('Credited as: ' + val(cv, 'author'));
      const spec = specLabels(cv).concat(specLabels(iv).map(l => l + ' (issue)'));
      if (spec.length) notes.push('Speculative fields: ' + spec.join('; '));
      if (val(cv, 'notes')) notes.push(val(cv, 'notes'));
      add('note', notes.join('. '));
      recs.push('@article{' + cv.id + ',\n' + F.join(',\n') + '\n}');
    })));
    return attribution('bib', vm.date) + '\n\n' + recs.join('\n\n') + '\n';
  }

  // ── Name index ────────────────────────────────────────────────────────
  const NAMES = { format: 'html', unheaded: 'suggest', see: true, forms: true, marks: true };
  /* Every credit in the selection, filed under its heading, or for a name without one under
     the form a heading would take (surname first; opts.unheaded 'asis' files it as credited).
     Returns [{ heading, sort, authority, forms: Map<raw, count>, items: [{ tv, iv, cv, role, spec }] }], alphabetical. */
  function nameEntries(vm, o) {
    const lookup = headingLookup(vm);

  // made, and files are copied afresh into it before their next replacement.
  async function backupFolderFor(handle) {

      catch (e) { if (!e || (e.name !== 'NotFoundError' && e.name !== 'TypeMismatchError')) throw e; }
    }
    backedUp.clear();
    const root = await handle.getDirectoryHandle('_backups', { create: true });
    const name = await freeName(root, stamp(new Date()) + '-' + randomTag(), true);
    backupDir = { handle, name, dir: await root.getDirectoryHandle(name, { create: true }), label: '_backups/' + name, log: [] };
    return backupDir;
  }
  // Keep a copy of `disk` (the file `original` as it is on disk: its bytes where they can be had)
  // and check it byte for byte; returns { path, folder }. A copy that fails or does not check is
  // removed again (its name was free), so a folder never holds a bad copy under a good name.
  async function writeBackup(handle, original, disk, changedOnDisk) {
    const b = await backupFolderFor(handle);
    const wanted = changedOnDisk && backedUp.has(original) ? original.replace(/\.csv$/i, '') + '.changed-on-disk-' + stamp(new Date()) + '.csv' : original;
    const name = await freeName(b.dir, wanted);
    try {
      await writeText(b.dir, name, disk.bytes || disk.text);
      const back = await readIfExists(b.dir, name);
      const same = back && (disk.bytes && back.bytes ? sameBytes(back.bytes, disk.bytes) : back.text === disk.text);

      try { if (b.dir.removeEntry) await b.dir.removeEntry(name); } catch (x) { /* leave it; BACKUPS.txt does not list it */ }
      throw e;
    }

    try {
      await writeText(b.dir, 'BACKUPS.txt', 'Slaughter Cataloger backups: each file here is a copy of a library file exactly as it was on disk before a save replaced it.\n' +
        'To go back to a copy, copy it into the library folder under its original name (the third column).\n\nsaved at\tcopy\toriginal file\twhy\n' + b.log.join('\n') + '\n');
    } catch (e) { if (e && e.name === 'NotOwner') throw e; /* the copy itself is in place and checked */ }

  }

  const notOwnerError = () => { const x = new Error('another tab has taken over the library'); x.name = 'NotOwner'; return x; };
  // beforeClose (optional): asked just before the new text is swapped in; if it answers false the
  // write is abandoned and the file on disk is left exactly as it was.
  async function writeText(dir, name, data, beforeClose) {
    const fh = await dir.getFileHandle(name, { create: true });
    const w = await fh.createWritable();       // writes to a temporary file; close() swaps it in
    const stop = () => { w.abort().catch(() => {}); };
    inflight.add(stop);                         // backups too: a tab taken over stops all its writing at once

      await w.write(data);                      // text (written as UTF-8) or bytes
      if (beforeClose && (lostFlag || !(await beforeClose()))) throw notOwnerError();
      await w.close();
    } catch (e) {
      try { await w.abort(); } catch (x) { /* already closed or failed */ }
      throw lostFlag ? notOwnerError() : e;
    } finally { inflight.delete(stop); }
    return (await fh.getFile()).lastModified;
  }

  /* files: [{name, text, baseline, mustExist, mustNotExist}] — baseline: the hash the app last
     read or wrote; mustExist: the file was read from the folder, so if it has gone it is not
     silently made again; mustNotExist: the file is new to the app, so a file of that name already
     in the folder (one the app did not load) is never overwritten.
     opts.stillOwner (optional, async → boolean): checked before each file and again just before
     each write is swapped in; once it answers false nothing more is written (stopped: true), so a
     tab that has been taken over cannot overwrite what the new tab saves.
     Each file is handled on its own; one failing does not stop the others.
     Returns { saved: {name: {hash, lastModified}}, already: [names that were on disk exactly as
               wanted], backups: [names], backupPaths: {name: path of its copy}, backupFolder,
               conflicts: [{name, backup}],
               missing: [names], occupied: [names], failed: [{name, error}],
               stopped: boolean, notWritten: [names not tried because the tab lost the library] } */
  async function writeFiles(handle, files, opts) {
    opts = opts || {};
    const result = { saved: {}, already: [], backups: [], backupPaths: {}, conflicts: [], missing: [], occupied: [], failed: [], backupFolder: '', stopped: false, notWritten: [] };
    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      if (opts.stillOwner && !(await opts.stillOwner().catch(() => false))) {
        result.stopped = true;
        result.notWritten = files.slice(i).map(x => x.name);
        break;
      }
      let existed = true;
      try {
        const disk = await readIfExists(handle, f.name);
        existed = !!disk;
        const want = SC.records.hashText(f.text);
        if (!disk && f.mustExist) { result.missing.push(f.name); continue; }
        const diskHash = disk ? SC.records.hashText(disk.text) : '';
        // Already there (say, written by a save that was interrupted later): nothing to write.
        if (disk && disk.text === f.text) { result.saved[f.name] = { hash: want, lastModified: disk.lastModified }; result.already.push(f.name); continue; }
        // An empty file holds nothing to lose (say, one left by a first write that failed).
        if (disk && f.mustNotExist && disk.text !== '') { result.occupied.push(f.name); continue; }
        const changedElsewhere = !!(disk && f.baseline && diskHash !== f.baseline);
        if (disk && disk.text !== '' && (!backedUp.has(f.name) || changedElsewhere)) {
          let copy;
          try { copy = await writeBackup(handle, f.name, disk, changedElsewhere); }        // never replace a file without its copy
          catch (e) { if (e && e.name === 'NotOwner') throw e; throw new Error('its backup copy could not be made (' + ((e && e.message) || e) + '), so the file in the folder was not replaced'); }
          backedUp.add(f.name);
          result.backups.push(f.name);
          result.backupPaths[f.name] = copy.path;
          result.backupFolder = copy.folder;
          if (changedElsewhere) result.conflicts.push({ name: f.name, backup: copy.path });

      } catch (e) {

        if (e && e.name === 'NotOwner') { result.stopped = true; result.notWritten = files.slice(i).map(x => x.name); break; }
        result.failed.push({ name: f.name, error: (e && e.message) || String(e) });
      }
    }
    return result;
  }

  // ── Fallback: picked/dropped files and downloads ──────────────────────
  async function readFileList(fileList) {
    const out = [];
    for (const file of Array.from(fileList || [])) {
      if (!/\.csv$/i.test(file.name)) continue;
      const c = await contentOf(file);
      out.push({ name: file.name, text: c.text, encodingError: c.encodingError, lastModified: file.lastModified || 0 });
    }
    return out;
  }

  function download(name, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/csv') + ';charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 1500);
  }

  function resetSessionBackups() { backupDir = null; backedUp.clear(); }

  SC.storage = { idb, working, takeLock, hasLocks, withSaveLock, unstored, supportsFolders, pickFolder, storableFolder, rememberedFolder, hasPermission, readFolder, writeFiles, readFileList, download, resetSessionBackups };
})(globalThis.SC = globalThis.SC || {});

<script>/* js/app/session.js */
/* Slaughter Cataloger 3 — session: opening, restoring, reconnecting, saving.
   Owns the store, the connection to the library folder, and the browser
   working copy. UI code calls these functions; it never touches files itself.

   What this file promises (tools/test-session.js checks each):
   - A file shows as saved only when the folder holds what the app last wrote or read
     (store.js revisions; a download counts only once you confirm it replaced the old file).
   - Every change reaches the browser's working copy as it is made (a journal entry), not
     after a delay; a storage failure is shown on screen, not just logged.
   - Reconnecting reads files added to the folder, reads again files changed there, and keeps
     (and flags) files that have gone or no longer read cleanly, rather than dropping records.
   - A save writes each file on its own: what was written is marked saved, what was not stays
     changed, and the message says which is which.
   - One tab at a time works on the working copy; another tab can take over. */
(function (SC) {
  'use strict';
  const R = SC.records, ST = SC.storage;
  const store = SC.createStore();

  // access: 'checking' → 'owner' (this tab works on the library) | 'elsewhere' (another tab has
  // it) | 'lost' (another tab took over). download: files downloaded and not yet confirmed.
  const ui = { mode: 'none', folderName: '', needsReconnect: false, wrongFolder: '', report: [], needsConversion: [], busy: '', message: null,
    restoredAt: 0, access: 'checking', storageProblem: '', download: null };
  const uiListeners = new Set();
  let messageTimer = null;
  function setUI(patch) {
    Object.assign(ui, patch);
    if ('message' in patch) {           // confirmations clear themselves; problems stay until dismissed
      clearTimeout(messageTimer);
      if (patch.message && patch.message.level === 'ok') messageTimer = setTimeout(() => setUI({ message: null }), 9000);
    }
    uiListeners.forEach(fn => fn());
  }
  let folder = null;
  let owner = false;
  // Every CSV in the folder at the last read, name → hash, loaded or not, so a reconnect can
  // tell a file that is new from one that was there before and not loaded.
  let diskSeen = new Map();

  // ── Working copy in the browser ───────────────────────────────────────
  // Each change is appended to a journal at once; after a few seconds of quiet (or every 200
  // changes) a snapshot of the whole library replaces the journal. Writes run in order.
  // gen: which library state the journal builds on. Opening or reloading a library starts a new
  // one, which needs a snapshot of its own before its journal entries mean anything: until that
  // snapshot is stored (needsSnapshot), the storage notice stays up, and a restore never replays
  // entries onto a snapshot of another state.
  // A journal entry that could not be stored leaves a gap: the notice then stays until a snapshot
  // (which holds everything) is stored, and later entries name the missing numbers (missed), so a
  // restore after a crash says that something could not be brought back.
  let seq = 0, gen = 0, needsSnapshot = false, sinceCompact = 0, compactTimer = null, compactDue = false, pending = 0;
  let missed = [];
  let chain = Promise.resolve();
  function enqueue(fn, isSnapshot, forGen, forSeq) {
    pending++;
    chain = chain.then(fn).then(
      () => {
        if (isSnapshot && forGen === gen) { needsSnapshot = false; missed = missed.filter(x => x > forSeq); if (!missed.length) ST.unstored.clear(); }
        if (ui.storageProblem && !needsSnapshot) setUI({ storageProblem: '' });
      },
      e => {
        if (e && e.name === 'NotOwner') { lostAccess(); return; }
        console.warn('Working copy not stored:', e);
        if (!isSnapshot && forSeq) { missed.push(forSeq); needsSnapshot = true; ST.unstored.add(); }
        setUI({ storageProblem: (e && e.message) || String(e) });
        compactSoon(isSnapshot ? 5000 : 0);         // try again; a snapshot closes a journal gap
      }
    ).then(() => { pending--; });
    return chain;
  }
  function entryFor(ev) {
    const st = store.state;
    return {
      at: Date.now(), type: ev.type, gen,
      records: (ev.changed || []).map(([kind, id]) => kind === 'library' ? ['library', '', st.library] : [kind, id, R.mapOfKind(st, kind).get(id) || null]),
      files: Array.from(st.files.values()), dirty: Array.from(store.dirty), missed: missed.slice()
    };
  }
  store.subscribe((v, ev) => {
    if (ev.type === 'load') { gen = Math.max(Date.now(), gen + 1); needsSnapshot = true; }   // unique across sessions
    if (!owner || ui.mode === 'none') return;
    if (ev.type === 'load') { compactSoon(0); return; }
    const s = ++seq, entry = entryFor(ev);
    enqueue(() => ST.working.append(s, entry), false, gen, s);
    compactSoon(++sinceCompact >= 200 ? 0 : 4000);
  });
  function compactSoon(ms) { clearTimeout(compactTimer); compactDue = true; compactTimer = setTimeout(compact, ms); }
  function compact() {
    clearTimeout(compactTimer);
    compactDue = false;
    if (!owner || ui.mode === 'none') return chain;
    const s = seq;
    const record = { snapshot: store.snapshot(), seq: s, gen, mode: ui.mode, folderName: ui.folderName, folder: folder ? ST.storableFolder(folder) : null,
      report: ui.report, needsConversion: ui.needsConversion, diskSeen: Array.from(diskSeen.entries()), unloaded: Array.from(store.unloaded.entries()) };
    sinceCompact = 0;

  }
  // Replay one journal entry onto a state read from a snapshot.
  function applyEntry(st, e) {
    (e.records || []).forEach(([kind, id, rec]) => {
      if (kind === 'library') { st.library = Object.freeze(Object.assign({ slug: '', name: '', note: '' }, rec)); return; }
      const m = R.mapOfKind(st, kind);
      if (rec) m.set(id, R.freezeRec(Object.assign({}, rec))); else m.delete(id);
    });

  // ── Starting: one tab at a time ───────────────────────────────────────
  function lostAccess() {
    owner = false;
    clearTimeout(compactTimer);
    setUI({ access: 'lost', busy: '' });
  }
  // Resolves once starting up (restoring and checking the folder) has finished.
  let started = null;
  const whenReady = () => started || Promise.resolve();
  function init() {

      owner = await ST.takeLock(false, lostAccess);

      setUI({ access: 'owner' });

  }
  // Work in this tab instead of the other one (which then stops).
  function takeOver() {
    started = (async () => {
      owner = await ST.takeLock(true, lostAccess);
      if (!owner) return;
      setUI({ access: 'owner' });
      await restore();
    })();

  }

  async function restore() {
    let data;
    try { data = await ST.working.read(); } catch (e) { setUI({ storageProblem: (e && e.message) || String(e) }); return; }
    const saved = data && data.session;
    const maxSeq = (data && data.journal.length) ? Math.max.apply(null, data.journal.map(j => j.seq)) : 0;
    seq = Math.max(seq, maxSeq);                 // never reuse a number, even of entries left without a snapshot
    if (!saved || !saved.snapshot) {
      // Nothing of the library was ever stored here; if changes failed to store, say so (once).
      const u = ST.unstored.read();
      if (u && u.count) {
        setUI({ message: { level: 'error', text: u.count + ' change(s) made in this browser could not be stored (the red notice said so at the time), and no copy of the library was stored either, so nothing could be restored. Open your library folder again; what you saved there is safe.' } });
        ST.unstored.clear();
      }
      return;
    }
    const st = SC.stateFromSnapshot(saved.snapshot);
    let dirty = saved.snapshot.dirty || [];
    // Replay only the entries made on top of this snapshot's state.
    const g = saved.gen || 0;
    const all = data.journal.slice().sort((a, b) => a.seq - b.seq);
    const after = all.filter(j => j.seq > (saved.seq || 0) && (j.entry.gen == null ? g : j.entry.gen) === g);
    const lost = all.filter(j => j.seq > (saved.seq || 0) && j.entry.gen != null && j.entry.gen !== g);
    after.forEach(j => { applyEntry(st, j.entry); if (j.entry.dirty) dirty = j.entry.dirty; });
    // Changes whose journal entry was never stored: named by later entries, or a number missing
    // between the snapshot and the last entry brought back.
    const present = new Set(all.map(j => j.seq)), gaps = new Set();
    const lastBack = after.length ? after[after.length - 1].seq : (saved.seq || 0);
    for (let x = (saved.seq || 0) + 1; x < lastBack; x++) if (!present.has(x)) gaps.add(x);
    after.forEach(j => (j.entry.missed || []).forEach(x => { if (x > (saved.seq || 0) && !present.has(x)) gaps.add(x); }));
    seq = Math.max(maxSeq, saved.seq || 0);
    diskSeen = new Map(saved.diskSeen || []);
    store.setUnloaded(saved.unloaded || []);
    store.load(st, { dirty });
    // What is shown is the stored snapshot plus its own journal: new entries build on that.
    gen = g; needsSnapshot = false;
    if (saved.mode === 'folder') folder = await ST.rememberedFolder(saved).catch(() => null);
    const reconnect = saved.mode === 'folder' && !!folder && !(await ST.hasPermission(folder, false).catch(() => false));
    const lastChange = after.length ? after[after.length - 1].entry.at : saved.snapshot.savedAt;
    const lostNote = lost.length ? [{ level: 'error', file: '', restore: true, msg: lost.length + ' change(s) made after a library was opened could not be restored, because this browser could not store that library at the time (see the red notice it showed then). The library as last stored is shown.' }] : [];
    // Failures are also counted outside IndexedDB, for when no later entry was stored to name them.
    const unstored = ST.unstored.read();
    const nLost = Math.max(gaps.size, unstored && unstored.count || 0);
    if (nLost) lostNote.push({ level: 'error', file: '', restore: true, msg: nLost + ' change(s) could not be restored, because this browser failed to store them at the time (the red notice said so then). What is shown is everything else; check it before saving.' });
    setUI({ mode: saved.mode, folderName: saved.folderName || '', report: lostNote.concat(saved.report || []), needsConversion: saved.needsConversion || [],
      needsReconnect: reconnect || (saved.mode === 'folder' && !folder), restoredAt: lastChange,
      message: lostNote.length ? { level: 'error', text: lostNote.map(n => n.msg).join(' ') } : ui.message });
    compact();
    if (saved.mode === 'folder' && folder && !reconnect) await syncFromFolder(false);
  }

  // ── Opening ───────────────────────────────────────────────────────────
  // A folder of nothing but Beta 2 files is not opened: it needs converting first.
  function onlyOldFiles(built) {
    const st = built.state;
    if (st.titles.size || st.issues.size || st.contents.size || st.authorities.size || !built.needsConversion.length) return false;
    setUI({ busy: '', message: { level: 'error', text: 'These ' + built.needsConversion.length + ' files are in the Beta 2 format, which this version does not open. They have not been changed. Convert them to 3.0 once (see the Guide), then open the converted files here.' } });
    return true;
  }
  // Changing which library or folder is open waits for a save to finish (a save writes into the
  // folder it started with; switching under it would mix the two).
  function waitForSave() {

    return true;

      const files = await ST.readFolder(handle);
      const read = files.map(f => R.readFile(f.name, f.text, { lastModified: f.lastModified, encodingError: f.encodingError }));
      const built = R.buildLibrary(read);
      if (onlyOldFiles(built)) return;

      diskSeen = new Map(files.map(f => [f.name, R.hashText(f.text)]));
