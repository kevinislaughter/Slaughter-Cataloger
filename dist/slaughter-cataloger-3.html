        <button class="btn small" disabled=${pos === -1 || pos >= issues.length - 1} onClick=${() => go(route.titleID, issues[pos + 1].issueID)} aria-label="Next issue" title="Alt+PageDown">Next</button>
      </span>`}
    </div>`;
  }

  function GuidePanel() {
    return html`<section class="guide">
      <h1 class="panel-title">Guide</h1>
      <h2>Your library is a folder of CSV files</h2>
      <p>Open the folder once. Save writes your changes back into the same CSV files, only the files that changed. Before a file is overwritten for the first time in a session, the copy on disk is kept in <code>_backups/&lt;date-time&gt;-&lt;code&gt;</code> inside the folder, a folder of that session's own; if a file was changed by something else while the library was open (a spreadsheet, say), that version is kept there too and the save says so. A backup is never written over, each is checked byte for byte against the file it copies before that file is replaced (if it cannot be made, the file is not saved), and <code>BACKUPS.txt</code> in each backup folder lists what every copy is, when it was made and why. To go back to a copy, copy it into the library folder under its original name. The CSVs remain the record: readable in any spreadsheet, and yours.</p>
      <p>If the folder holds several versions of the same file — dated exports, for instance — the newest is loaded and the others are listed in the load report.</p>

      <h2>Saving, and what the browser keeps</h2>
      <p><strong>Your files.</strong> “All changes saved” means every file in the folder holds exactly what you see. A file shows as changed until it is saved, including after you undo past a save and then make a different change. If a save cannot write a file (no permission, disk full), the message names it; the others are saved, and that one stays changed until a later save writes it.</p>
      <p><strong>The browser's working copy.</strong> Every change is also written into this browser's storage as you make it, so closing the tab, a crash or a restart does not lose it: open the app again and your work is there, marked unsaved, until you save. A change made in the instant before a crash can be lost. The working copy is not a backup — clearing the browser's data for this page deletes it — so save to your folder often. If the browser cannot store a change, a red notice says so, and it stays until the whole library has been stored again; if the app is closed before then, opening it again says what could not be brought back.</p>
      <p><strong>One tab at a time.</strong> The working copy belongs to one tab. A second tab says the library is open elsewhere and offers <em>Use this tab instead</em>. The first tab then stops, and so does any save it was making, so it cannot write over what the new tab saves. The new tab carries on with every change the first had stored; only a change made in the very moment of switching could miss it.</p>
      <p><strong>When the folder changes.</strong> After a restart the app asks for access to the folder again (<em>Allow access</em>); it then reads files added there, reads again files changed there that you have not changed, and keeps your version of those you have. A file that is no longer in the folder keeps its records here and is listed on the Library page; nothing is written to its name until it is back, or until you remove it from the library. If the remembered folder now holds a different library, nothing is read from it or saved into it; <em>Choose folder</em> points the working copy at the right one, keeping your unsaved work.</p>
      <p><strong>Rows that cannot be read in</strong> — a row whose ID repeats an earlier row's, a row of another library, a row of another kind in the wrong file — are not loaded, but are kept exactly as they are and written back (at the end of the file) whenever that file is saved. The Library page lists them. A file that cannot be read as a whole (a quoted value never closed, a column heading used twice, a row with more or fewer values than columns, or text that is not UTF-8 — a spreadsheet's plain “CSV” rather than “CSV UTF-8”, whose accented letters would be damaged) is not loaded at all, and the load report says where the problem is. Nothing new is saved under that file's name until it is corrected — adding to it is refused, with the reason — so the file in the folder is never written over.</p>
      <p><strong>In Firefox and Safari</strong> the app cannot write into a folder: you load the CSV files, and Save downloads the changed ones. A download is not yet a save — the files stay marked changed until you move the downloaded files into your library folder, replacing the old copies, and click <em>I've replaced the files</em>.</p>
      <p><strong>Spreadsheet safety.</strong> A value that starts with <code>=</code>, <code>+</code>, <code>-</code> or <code>@</code> is written with an apostrophe in front (<code>'-- END</code>) so a spreadsheet does not take it for a formula; the app removes it again when reading. A value that itself starts with an apostrophe before one of those characters is written with one more (<code>''-ism</code>), so every value reads back exactly as it was. In a file edited elsewhere (a spreadsheet, a text editor), the same rule applies, as spreadsheets apply it: <code>'-ism</code> is read as <code>-ism</code>, and to keep a literal apostrophe before one of those characters, type it twice (<code>''-ism</code>). A value written there without the apostrophe (<code>=SUM(1,2)</code>) is read as it is, and gets one when the app next saves the file. An apostrophe before anything else (<code>'Twas</code>) is never touched.</p>

      <h2>The four stages</h2>
      <p>Library holds the titles. Issues records the issues of a title. Contents records what appears in each issue. Compiler turns the data into checklists, catalogs and citations. The title and issue you are working on stay selected as you move between stages, and the address bar remembers where you are.</p>

      <h2>The run at a glance</h2>
      <p>The issues of a title, in Issues, in the Contents issue list and on the title's page in Library, show as a strip: a row for each volume (or each year, when the run has no volumes) and a square for each issue. A filled square has its contents recorded; an open one has none yet; a hatched square is a number missing from the run; ochre marks an issue recorded as speculative; a round one is a supplement or special issue. Point at a square to see the issue, click it to open it.</p>

      <h2>Recording issues</h2>
      <p>The run of issues sits on the left; the issue you are working on fills the rest. <strong>New issue</strong> starts a draft that follows the issue before it. Fields that rarely change from one issue to the next — pages, size, price, edition, series, calendar, evidence, and any title-level field the previous issue set for itself — are carried over. The volume, issue and whole numbers move on, and so does the date, by the same step as last time: a month, two months, a season, a week, a year. Roman numerals stay Roman, zero-padded numbers stay padded, and a double issue such as 5/6 is followed by 7. Months spanning the turn of a year (Dec–Jan) set the end year.</p>
      <p>Under <em>Moves on</em> you choose which numbers advance and how the date moves; the choice is remembered per title. <strong>Start next volume</strong> raises the volume and sets the issue number back to 1. When the previous volume ended at a lower number than the one you are about to record, the form suggests the new volume.</p>
      <p>The short name follows the pattern of the previous issue's short name, so <code>Liberty V1 I2 N2</code> is followed by <code>Liberty V1 I3 N3</code>. Type your own and it stays yours. A Roman volume gets a point (<code>Shape Notes V.II I.4</code>) so it can't run into the next letter.</p>
      <p><strong>Record issue</strong> (<kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd>) adds the draft to the run and the next draft is ready. Nothing is asked first: the count of fields not yet addressed is shown on the draft, and an issue that matches one already in the run is pointed out. The IssueID is assigned when the issue is recorded and never changes.</p>

      <h2>Recording contents</h2>
      <p>The contents of an issue form one table, in printed order. Type in the last row to add an item; <kbd>Enter</kbd> moves down a row, <kbd>Shift</kbd> + <kbd>Enter</kbd> starts a new line inside a title or a note. Sequence numbers are kept as 1, 2, 3… as items are added, moved and removed.</p>
      <p>Paste several lines into a cell and each line becomes an item. Page numbers at the end of a line (<code>Notes ........ 12</code>, <code>Notes, p. 12</code>, <code>Notes  12–14</code>) go to the page columns. Columns copied from a spreadsheet go to title, author, type, start page, end page and notes, starting from the column you pasted into. <strong>Add several items…</strong> shows what will be added before it is added, and can split "…, by Author" and read indented lines as nested.</p>
      <p>An item can be part of another — a poem inside a section, a letter inside a correspondence column. <strong>Nest</strong> makes the item part of the one above it; <strong>Un-nest</strong> moves it out a level. Moving an item up or down takes the items nested in it along.</p>
      <table class="keys"><tbody>
        <tr><td><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>→</kbd> / <kbd>←</kbd></td><td>Nest / un-nest</td></tr>
        <tr><td><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>↑</kbd> / <kbd>↓</kbd></td><td>Move up / down</td></tr>
        <tr><td><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Enter</kbd></td><td>Open an empty row below</td></tr>
        <tr><td><kbd>Alt</kbd> + <kbd>Shift</kbd> + <kbd>S</kbd> / <kbd>N</kbd></td><td>Mark the cell ? / N/A</td></tr>
        <tr><td><kbd>Escape</kbd></td><td>Undo what you typed in the cell</td></tr>
      </tbody></table>
      <p>Authors and content types already used complete as you type, the most used first (this title's own before the rest of the library): type <code>Alex</code> and <code>ander Green</code> is filled in, selected. Keep typing to write something else, press <kbd>Backspace</kbd> to drop the suggestion, or <kbd>Enter</kbd> or <kbd>Tab</kbd> to take it.</p>

      <h2>Names and headings</h2>
      <p>Library › Names lists every name credited in the contents of the library, with how often it occurs. Credits are split where a cell names several people: on semicolons, on “&amp;”, and on a slash between names (<code>J.M.L. Babcock/Tucker</code>, a letter and its reply). Case, spacing and punctuation are ignored, so <code>B. R. Tucker</code> and <code>B.R. Tucker</code> are one form.</p>
      <p>A <strong>heading</strong> gathers the forms one person or body is credited under and is the form the name files under in an index: <code>B.R.T.</code>, <code>Benj. R. Tucker</code> and <code>Benjamin R. Tucker</code> under <strong>Tucker, Benjamin R.</strong> Choose a name to make a heading from it (surname first is suggested; roles such as “translated by” and honorifics such as “Rev.” are set aside), to add it to an existing heading, or to combine it with the forms that are probably the same name. <em>Suggested matches</em> lists those groups for the whole library: same surname, with forenames and initials that agree (<code>Wm.</code> counts as William, and an initialism such as <code>S.E.P.</code> joins the name it spells). Check each before combining.</p>
      <p>Headings never change the contents: each credit stays as printed. They are kept in the library's Authorities file, <code>SCAT_&lt;library&gt;_AUTHORITIES.csv</code>, each with a permanent AuthorityID (<code>AU-7M4Q2B</code>), its type, dates, see-also, roles, honorifics, sources, notes and status (Needs review or Confirmed). Authority lists from Beta 2 (<code>AUTHORITY_&lt;TitleID&gt;.csv</code>) are converted to this file along with the rest of a library.</p>

      <h2>Compiling</h2>
      <p>The Compiler turns the library into finished files. Tick one title or several, choose an output, and the preview follows every choice; long runs are previewed from their first 25 issues, and <strong>Download</strong>, <strong>Copy</strong> and <strong>Open</strong> always include everything. Files are named <code>SCATOUT_&lt;library&gt;_&lt;TitleID&gt;_&lt;output&gt;_&lt;date&gt;</code>, without the TitleID when several titles are compiled together.</p>
      <table class="keys"><tbody>
        <tr><td><strong>Checklist</strong></td><td>The run as a list to tick off, as a web page, Markdown or plain text. Plain gives numbers and date; Bibliographic writes each issue as a citation; IssueID first suits data work. Pages, price, imprint, printer, designation, evidence, subtitle, notes and IssueID can be added.</td></tr>
        <tr><td><strong>Catalog</strong></td><td>One standalone web page: each title's facts and notes, then its issues, in volume or year sections for long runs, each with its table of contents. Place, publisher or editors appear on an issue only where it differs from the title.</td></tr>
        <tr><td><strong>WordPress</strong></td><td>The catalog as blocks, to paste into the WordPress code editor.</td></tr>
        <tr><td><strong>Proofing catalog</strong></td><td>A print-ready document for checking records against the issues in hand: an explainer, a proof sheet for each title, then every issue on its own printed pages, never two issues on one page, with every field, a box to tick, its status (?, [N/A], [blank], from title) and room for corrections. Use <strong>Open</strong> to print it.</td></tr>
        <tr><td><strong>Name index</strong></td><td>Every credited name in alphabetical order with each credit (issue, date, page, item), the forms a heading was credited under, and see-references from forms that file elsewhere: <em>B.R.T.</em> see <strong>Tucker, Benjamin R.</strong> Names without a heading file under the form a heading would take, or as credited if you prefer.</td></tr>
        <tr><td><strong>RIS</strong></td><td>One record per contents item, for Zotero and other reference managers. Authors are given as their heading where there is one; the credit as printed goes in a note.</td></tr>
        <tr><td><strong>BibTeX</strong></td><td>One entry per contents item, for JabRef. The ContentID is the citation key; authors as in RIS.</td></tr>
      </tbody></table>
      <p>Uncertain values print in brackets with a question mark, <span class="unc">[1881?]</span>, as in a printed bibliography, unless you turn that off. RIS and BibTeX keep the values plain and list the speculative fields in a note, with the TitleID, IssueID and ContentID, so every record can be traced back to the library.</p>

      <h2>Inherited fields</h2>
      <p>Twelve title-level fields — title, subtitle, former and later titles, publisher, editors, ISSN, language, frequency, city, state and country — come from the title record unless an issue says otherwise. They sit at the bottom of the issue form, folded away. Typing in one sets it for that issue only; <em>use title's</em> goes back to the title's value. Change the title record and every issue that inherits follows. Issue CSVs still carry the full values, plus an Overridden Fields column naming the fields that issue sets for itself.</p>

      <h2>Field states</h2>
      <p>A field is filled, speculative (?), not applicable (N/A), or not yet addressed. Unaddressed fields carry a blue underline. Speculative values appear in brackets with a question mark, as in a printed bibliography: <span class="unc">[1881?]</span>.</p>

      <h2>Identifiers</h2>
      <p>TitleID (<code>LIBERTYX-1881</code>), IssueID (<code>LIBERTYX-1881-KRT8NK2</code>) and ContentID (<code>LIBERTYX-1881-C7M4Q2B</code>) are permanent. Editing a record never changes its ID, so links between titles, issues and contents survive any correction.</p>

      <h2>Undo and saving</h2>
      <p><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>Z</kbd> undoes the last change and <kbd>Shift</kbd> adds redo. While you are typing in a field, they undo your typing instead; once the field is left, they undo changes to the library. Deleting an issue or an item can be undone the same way. <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>S</kbd> saves. <kbd>Alt</kbd> + <kbd>Page Up</kbd> / <kbd>Page Down</kbd> step to the previous or next issue.</p>

      <h2>Files from Beta 2</h2>
      <p>This version opens 3.0 files only. Files from Beta 2 are converted once, outside the app: the conversion merges duplicate and dated copies, gives every contents item a permanent ContentID, works out which issue fields differ from their title, and writes one Issues file and one Contents file per title. Beta 2 files found in a folder are listed as not loaded and are never changed.</p>
      <p>Avoid re-saving library CSVs from a spreadsheet program: they tend to rewrite values such as <code>3.0</code> as <code>3</code> and <code>3-4</code> as a date.</p>
    </section>`;
  }

  SC.views = Object.assign(SC.views || {}, { ContextBar, GuidePanel });
})(globalThis.SC = globalThis.SC || {});

</script>
<script>/* js/ui/strip.js */
/* Slaughter Cataloger 3 — the run strip.
   A title's run at a glance: a row per volume (or per year when the run has no volumes),
   a square per issue in run order. Filled: contents recorded. Open: no contents yet.
   Hatched: a number missing from the run. Ochre: the issue is marked speculative.
   Round: a supplement or special issue. Each square opens its issue. */
(function (SC) {
  'use strict';
  const { html, useMemo, useStore, routeHref, plural, cls, issueLabel, issueDate } = SC.ui;
  const N = SC.numbering;
  const MAX_GAP_CELLS = 12;

  // Rows of cells for one title. Pure apart from the store queries.
  function runRows(store, titleID) {
    const issues = store.issuesOfTitle(titleID);
    const gaps = N.runGaps(issues);
    const byVol = issues.some(i => String(i.volume || '').trim());
    const rows = [], index = new Map();
    let withContents = 0, missing = 0;
    issues.forEach(i => {
      const key = byVol ? (String(i.volume || '').trim() || '—') : ((/\d{4}/.exec(String(i.year || '')) || ['—'])[0]);
      if (!index.has(key)) {
        const r = { key, label: byVol ? (key === '—' ? 'no vol.' : 'v. ' + key) : (key === '—' ? 'undated' : key), cells: [] };
        index.set(key, r); rows.push(r);
      }
      const r = index.get(key);
      const g = gaps.get(i.issueID);
      if (g) {
        missing += g.count;
        for (let k = 0; k < Math.min(g.count, MAX_GAP_CELLS); k++) r.cells.push({ kind: 'gap', label: g.label + ' missing' });
        if (g.count > MAX_GAP_CELLS) r.cells.push({ kind: 'more', label: g.label + ' missing', n: g.count - MAX_GAP_CELLS });
      }
      const n = store.contentsOfIssue(i.issueID).length;
      if (n) withContents++;
      r.cells.push({ kind: 'issue', issue: i, n });
    });
    // Years in order; volumes in numeric order when every volume is a number (Arabic or Roman).
    // Within a row the squares keep the order of the run.
    const num = r => (byVol ? N.numberOf(r.key) : parseInt(r.key, 10));
    const odd = rows.filter(r => isNaN(num(r)));
    if (odd.length === 0 || (odd.length === 1 && odd[0].key === '—')) {
      rows.sort((a, b) => (isNaN(num(a)) ? 1e9 : num(a)) - (isNaN(num(b)) ? 1e9 : num(b)));    // undated / no volume last
    }
    return { rows, byVol, total: issues.length, withContents, missing };
  }

  /* props: titleID, current (issueID), target ('issues' | 'contents'): where a square leads. */
  function RunStrip({ titleID, current, target }) {
    const store = useStore();
    const run = useMemo(() => runRows(store, titleID), [store.version, titleID]);
    if (run.total < 2) return null;
    const panel = target || 'issues';
    const cell = (c, k) => {
      if (c.kind === 'gap') return html`<span key=${k} class="sc gap" title=${c.label}></span>`;
      if (c.kind === 'more') return html`<span key=${k} class="sc more" title=${c.label}>+${c.n}</span>`;
      const i = c.issue;
      const tip = issueLabel(i) + (issueDate(i) ? ' — ' + issueDate(i) : '') + ' — ' + (c.n ? plural(c.n, 'contents item') : 'no contents yet') + (i.speculative ? ' — speculative' : '');
      return html`<a key=${i.issueID} href=${routeHref({ panel, titleID, issueID: i.issueID })} title=${tip} aria-label=${tip}
        class=${cls('sc', c.n ? 'has' : 'none', i.speculative && 'spec', (i.supplement || i.specialIssue) && 'extra', i.issueID === current && 'on')}></a>`;
    };
    return html`<div class="strip" aria-label="The run">
      <div class="strip-head">
        <span>${plural(run.total, 'issue')} · ${run.withContents.toLocaleString('en-US')} with contents${run.missing ? html` · <span class="warn-text">${run.missing.toLocaleString('en-US')} missing</span>` : ''}</span>
        <span class="strip-legend"><span class="sc has"></span> contents <span class="sc none"></span> none yet <span class="sc gap"></span> missing <span class="sc none spec"></span> speculative <span class="sc none extra"></span> supplement or special</span>
      </div>
      <div class="strip-rows">${run.rows.map(r => html`<div class="strip-row" key=${r.key}>
        <span class="strip-label">${r.label}</span><span class="strip-cells">${r.cells.map(cell)}</span></div>`)}</div>
    </div>`;
  }

  SC.views = Object.assign(SC.views || {}, { RunStrip });
  SC.strip = { runRows };
})(globalThis.SC = globalThis.SC || {});

</script>
<script>/* js/ui/issues.js */
/* Slaughter Cataloger 3 — Stage 2: Issues.
   The run of a title's issues beside the record of one issue.
   A new issue starts as a draft that follows the issue before it: the fields that
   rarely change are carried over, the numbers and the date move on, and the short
   name keeps the same pattern. Record adds it to the run and the next draft is ready. */
(function (SC) {
  'use strict';
  const { html, useState, useEffect, useRef, useMemo, useStore, navigate, routeHref, plural, cls, fieldState, toggleState, isUnaddressed, uncertain, issueLabel, issueDate, Field } = SC.ui;
  const S = SC.schema, R = SC.records, ids = SC.ids, N = SC.numbering;
  const IENT = S.entities.issue;

  // ── Inheritance-aware changes ─────────────────────────────────────────
  const orderKeys = keys => Array.from(new Set(keys)).sort((a, b) => IENT.byKey.get(a).order - IENT.byKey.get(b).order);
  // A title-level field shows as the issue's own unless it inherits (records.inherits).
  const ownValue = (rec, c, title) => R.inherits(rec, title, c.key) ? '' : rec[c.key];

  // Typing a title-level field overrides it for this issue; typing the title's own value, or nothing, inherits again.
  function valuePatch(rec, c, v, title) {
    if (typeof v === 'string' && c.type !== 'long') v = v.replace(/\s+$/, '');
    const k = c.key;
    if (!S.INHERIT[k]) return { [k]: v };
    const tv = title ? String(title[S.INHERIT[k]] || '') : '';
    const ov = (rec.overrides || []).filter(x => x !== k);
    if (!fieldState(rec, c).na && (v === '' || v === tv)) return { [k]: '', overrides: ov };
    return { [k]: v, overrides: orderKeys(ov.concat(k)) };
  }
  // N/A on a title-level field is this issue's own statement, so it overrides the title.
  function statePatch(rec, c, which) {
    const p = toggleState(IENT, rec, c, which);
    const k = c.key;
    if (S.INHERIT[k] && which === 'na') {
      const ov = (rec.overrides || []).filter(x => x !== k);
      p.overrides = p.na.indexOf(c.header) !== -1 ? orderKeys(ov.concat(k)) : ov;
      p[k] = '';
    }
    return p;
  }
  function resetPatch(rec, c) {
    const na = (rec.na || []).filter(h => h !== c.header);
    return { [c.key]: '', overrides: (rec.overrides || []).filter(x => x !== c.key), na };
  }
  function unaddressedCount(rec) {
    return IENT.fields.filter(c => c.states && !(S.INHERIT[c.key] && (rec.overrides || []).indexOf(c.key) === -1) &&
      isUnaddressed(c, rec[c.key], fieldState(rec, c))).length;
  }
  // The count of fields not yet addressed; clicking it goes to the first of them.
  function UnaddressedCount({ n }) {
    if (!n) return html`<span class="unaddr-count">Every field addressed</span>`;
    const go = () => {
      const el = document.querySelector('.issue-form .field.is-unaddressed input, .issue-form .field.is-unaddressed textarea');
      if (!el) return;
      const d = el.closest('details');
      if (d && !d.open) d.open = true;
      el.scrollIntoView({ block: 'center' });
      el.focus({ preventScroll: true });
    };
    return html`<button type="button" class="link unaddr-count some" onClick=${go} title="Go to the first one">${plural(n, 'field')} not yet addressed</button>`;
  }
  const identifies = r => ['volume', 'issue', 'number', 'months', 'day', 'year', 'datePrinted', 'issueDesignation', 'shortname', 'supplementLabel'].some(k => String(r[k] || '').trim());
  const dupKey = i => [i.volume, i.issue, i.number, i.months, i.day, i.year, i.edition, i.issueDesignation, i.supplement ? 'S:' + (i.supplementLabel || '') : '', i.specialIssue ? 'SP' : '']
    .map(x => String(x || '').trim().toLowerCase()).join('|');
  function duplicatesOf(rec, issues) {
    if (!['volume', 'issue', 'number', 'months', 'year'].some(k => String(rec[k] || '').trim())) return [];
    const k = dupKey(rec);
    return issues.filter(i => i.issueID !== rec.issueID && dupKey(i) === k);
  }

  // ── The typeset entry for one issue ───────────────────────────────────
  // Written by the catalog view model, the same way the Compiler's outputs write it.
  function IssueEntry({ rec, title, idText }) {
    const CAT = SC.catalog;
    const e = CAT.entry(CAT.issueView(rec, title), title ? CAT.titleView(title) : null);
    const show = parts => parts.map(p => (typeof p === 'string' ? p : p.spec ? uncertain(p.text) : p.text));
    return html`<div class="entry">
      <p class="entry-main"><cite>${show(e.title)}</cite>.${e.body.length ? html` ${show(e.body)}` : ''}</p>
      ${e.sub.length > 0 && html`<p class="entry-sub">${show(e.sub)}</p>`}
      <p class="entry-id"><code>${idText || rec.issueID}</code>${rec.shortname ? html` · ${rec.shortname}` : ''}</p>
    </div>`;
  }

  // ── Months and seasons by click ───────────────────────────────────────
  function MonthsPicker({ rec, style, disabled, onPatch }) {
    const kind = rec.dateType === 'Season' ? 'seasons' : 'months';
    const p = N.parsePeriod(rec.months);
    const mine = p && p.kind === kind;
    const st = { full: mine && p.full != null ? p.full : !!style.full, autumn: mine && kind === 'seasons' && p.idx.indexOf(2) !== -1 ? p.autumn : !!style.autumn };
    const names = kind === 'seasons' ? N.SEASONS.map(n => n === 'Fall' && st.autumn ? 'Autumn' : n) : N.MON3;
    const sel = mine ? p.idx : [];
    const pick = i => {
      const next = sel.indexOf(i) !== -1 ? sel.filter(x => x !== i) : sel.concat(i);
      onPatch({ months: N.periodLabel(next, kind, st) }, 'Set ' + (kind === 'seasons' ? 'season' : 'months'));
    };
    const spans = mine && p.run && p.run.start + p.run.len > p.cycle;
    const y = String(rec.year || '').trim();
    return html`<div class=${cls('months-pick', kind)} role="group" aria-label=${kind === 'seasons' ? 'Seasons' : 'Months'}
        title=${rec.months && !p ? 'Clicking replaces "' + rec.months + '"' : ''}>
        ${names.map((n, i) => html`<button type="button" class=${cls('mp', sel.indexOf(i) !== -1 && 'on')} aria-pressed=${sel.indexOf(i) !== -1}
          disabled=${disabled} onClick=${() => pick(i)}>${n}</button>`)}
      </div>
      ${spans && !rec.yearEnd && /^\d{4}$/.test(y) && !disabled && html`<div class="field-note">Runs into the next year.
        <button type="button" class="link" onClick=${() => onPatch({ yearEnd: String(parseInt(y, 10) + 1) }, 'Set end year')}>Set end year to ${parseInt(y, 10) + 1}</button></div>`}`;
  }

  // ── The form, shared by new and existing issues ───────────────────────
  function IssueForm({ rec, title, onPatch, readOnly, style, extra }) {
    const overridden = (rec.overrides || []).length;
    function field(c) {
      const inh = S.INHERIT[c.key];
      const st = fieldState(rec, c);
      const props = {
        key: c.key, col: c, value: ownValue(rec, c, title), state: st, readOnly,
        onCommit: v => onPatch(valuePatch(rec, c, v, title), 'Edit ' + c.label.toLowerCase()),
        onToggle: which => onPatch(statePatch(rec, c, which), (which === 'spec' ? 'Mark ? on ' : 'Mark N/A on ') + c.label.toLowerCase())
      };
      if (inh) {
        props.inheritedValue = title ? String(title[inh] || '') : '';
        props.onReset = () => onPatch(resetPatch(rec, c), 'Use the title’s ' + c.label.toLowerCase());
      }
      if (c.type === 'months') return html`<${Field} ...${props}><${MonthsPicker} rec=${rec} style=${style} disabled=${readOnly || st.na} onPatch=${onPatch} /></${Field}>`;
      return html`<${Field} ...${props} />`;
    }
    return html`<div class="issue-form">${S.ISSUE_GROUPS.map(g => {
      const fields = IENT.groupFields(g.id).map(field);
      if (g.id === 'title') return html`<details class="card group collapsible" open=${overridden > 0}>
        <summary><span class="group-title">${g.label}</span> <span class="group-note">${overridden
          ? plural(overridden, 'field') + ' set for this issue; the rest come from the title'
          : 'all ' + Object.keys(S.INHERIT).length + ' fields come from the title record'}</span></summary>
        <div class="grid">${fields}</div></details>`;
      return html`<fieldset class="card group"><legend>${g.label}</legend>
        ${extra && extra[g.id]}
        <div class="grid">${fields}</div></fieldset>`;
    })}</div>`;
  }

  // ── Drafts of new issues ──────────────────────────────────────────────
  // Kept per title for the session, so a half-entered issue survives a look at another stage.
  const drafts = new Map();
  let pendingBase = null, draftEpoch = 0;
  function startDraft(titleID, baseID) {
    pendingBase = { titleID, baseID: baseID || null };
    draftEpoch++;
    const href = routeHref({ panel: 'issues', titleID, issueID: 'new' });
    if (location.hash === href) window.dispatchEvent(new HashChangeEvent('hashchange'));
    else navigate({ panel: 'issues', titleID, issueID: 'new' });
  }

  const SETTINGS = { volume: false, issue: true, number: true, date: 'auto' };
  function loadSettings(tid) {
    try { return Object.assign({}, SETTINGS, JSON.parse(localStorage.getItem('sc3.advance.' + tid) || '{}')); } catch (e) { return Object.assign({}, SETTINGS); }
  }
  function saveSettings(tid, s) { try { localStorage.setItem('sc3.advance.' + tid, JSON.stringify(s)); } catch (e) { /* a convenience only */ } }

  function blankIssue(titleID) {
    const r = { issueID: '', titleID, spec: [], na: [], overrides: [], speculative: false };
    IENT.fields.forEach(c => { r[c.key] = c.type === 'bool' ? false : ''; });
    r.dateType = 'Months'; r.yearCalendar = 'CE';
    return r;
  }
  const isRegular = i => !i.specialIssue && !i.supplement;
  const nameVals = x => ({ volume: x.volume, issue: x.issue, number: x.number, months: x.months, year: x.year });
  function autoShort(rec, title, from) {
    const t = R.effective(rec, title, 'title') || (title && title.canonicalTitle) || '';
    return from && from.shortname ? N.nextShortName(from.shortname, nameVals(from), nameVals(rec), t) : N.defaultShortName(t, nameVals(rec));
  }
  const advanceOpts = (s, cadence) => ({ volume: s.volume, issue: s.issue, number: s.number, date: s.date === 'auto' ? cadence : s.date });

  // A new draft following base (an issue of this title), or the last issue of the run.
  // Numbers and date move on from the last regular issue at or before base, not from a supplement or special issue.
  function makeDraft(store, title, titleID, baseID, settings) {
    const issues = store.issuesOfTitle(titleID);
    const base = (baseID && store.state.issues.get(baseID)) || issues[issues.length - 1] || null;
    const rec = blankIssue(titleID);
    const d = { rec, baseID: base ? base.issueID : '', fromID: '', cadence: 'run', shortAuto: true, touched: false };
    if (!base) { rec.shortname = autoShort(rec, title, null); return d; }
    let at = issues.indexOf(base), from = base;
    for (let j = at; j >= 0; j--) if (isRegular(issues[j])) { from = issues[j]; at = j; break; }
    let prev = null;
    for (let j = at - 1; j >= 0; j--) if (isRegular(issues[j])) { prev = issues[j]; break; }
    IENT.fields.forEach(c => { if (c.sticky) rec[c.key] = from[c.key]; });
    (from.overrides || []).forEach(k => { rec[k] = from[k]; });
    rec.overrides = (from.overrides || []).slice();
    rec.na = (from.na || []).slice();
    d.fromID = from.issueID;
    d.cadence = N.inferCadence(prev, from);
    Object.assign(rec, N.nextIssue(from, advanceOpts(settings, d.cadence), N.periodStyle(issues.map(i => i.months))));
    rec.shortname = autoShort(rec, title, from);
    return d;
  }
  // A change to the draft; the short name follows the numbers until the person types their own.
  function patchDraft(d, patch, title, from, touched) {
    const rec = Object.assign({}, d.rec, patch);
    let shortAuto = d.shortAuto;
    if ('shortname' in patch) {
      const auto = autoShort(rec, title, from);
      shortAuto = !patch.shortname || patch.shortname === auto;
      if (shortAuto) rec.shortname = auto;
    } else if (shortAuto) rec.shortname = autoShort(rec, title, from);
    return Object.assign({}, d, { rec, shortAuto, touched: d.touched || !!touched });
  }

  // Where the run may turn to a new volume: the previous volume ended at a lower number.
  function volumeHint(issues, rec) {
    const v = N.numberOf(rec.volume), n = N.numberOf(rec.issue);
    if (isNaN(v) || isNaN(n) || v < 2) return null;
    const nums = issues.filter(i => isRegular(i) && N.numberOf(i.volume) === v - 1).map(i => N.numberOf(i.issue)).filter(x => !isNaN(x));
    if (!nums.length) return null;
    const last = Math.max.apply(null, nums);
    return n > last ? { prev: v - 1, last } : null;
  }

  function IssueDraft({ titleID, title, issues }) {
    const store = useStore();
    const [settings, setSettings] = useState(() => loadSettings(titleID));
    const [d, setD0] = useState(() => {
      const want = pendingBase && pendingBase.titleID === titleID ? pendingBase.baseID : null;
      pendingBase = null;
      const have = drafts.get(titleID);
      if (have && (!want || want === have.baseID)) return have;
      if (have && have.touched) return Object.assign({}, have, { offer: want });
      return makeDraft(store, title, titleID, want, settings);
    });
    const dref = useRef(d);
    const [formKey, setFormKey] = useState(0);
    const setD = nd => { dref.current = nd; drafts.set(titleID, nd); setD0(nd); };
    useEffect(() => { drafts.set(titleID, dref.current); }, []);
    const style = useMemo(() => N.periodStyle(issues.map(i => i.months)), [titleID, issues.length]);
    const fromRec = () => (dref.current.fromID && store.state.issues.get(dref.current.fromID)) || null;
    const rec = d.rec;
    const base = d.baseID ? store.state.issues.get(d.baseID) : null;
    const from = fromRec();

    const onPatch = (patch) => setD(patchDraft(dref.current, patch, title, fromRec(), true));
    function rebase(baseID) {
      if (dref.current.touched && !confirm('Start the new issue again, following another issue? What you have entered in it will be cleared.')) return;
      setD(makeDraft(store, title, titleID, baseID, settings));
      setFormKey(k => k + 1);
    }
    // Change how numbers move on; the draft's own numbers follow at once.
    function setOption(name, value) {
      const s = Object.assign({}, settings, { [name]: value });
      setSettings(s); saveSettings(titleID, s);
      const f = fromRec();
      if (!f) return;
      const nx = N.nextIssue(f, advanceOpts(s, dref.current.cadence), style);
      const keys = { volume: ['volume'], issue: ['issue', 'seriesNumber'], number: ['number'], date: ['months', 'day', 'year', 'yearEnd'] }[name];
      const patch = {};
      keys.forEach(k => { patch[k] = nx[k]; });
      setD(patchDraft(dref.current, patch, title, f, false));
      setFormKey(k => k + 1);
    }
    function nextVolume() {
      const r = dref.current.rec;
      setD(patchDraft(dref.current, { volume: N.incrementString(r.volume), issue: N.firstOf(r.issue) }, title, fromRec(), true));
      setFormKey(k => k + 1);
    }

    function record() {
      const el = document.activeElement;
      if (el && el.blur && el !== document.body) el.blur();            // commit whatever is being typed
      const cur = dref.current;
      if (!identifies(cur.rec)) { SC.session.say('warn', 'Give the issue a number, a date or a short name before recording it.'); return; }
      const file = store.fileForNew('issue', titleID);
      const why = store.blocked(file); if (why) { SC.session.say('error', why); return; }
      const id = ids.newIssueID(titleID, x => store.state.issues.has(x));
      const after = cur.baseID && store.state.issues.get(cur.baseID);
      const label = issueLabel(cur.rec);
      store.batch('Record issue ' + label, () => {
        let entryOrder;
        if (after && after._src === file) {
          // Keep the run in order: the new issue goes right after the one it follows.
          entryOrder = (after.entryOrder || 0) + 1;
          Array.from(store.state.issues.values()).filter(i => i._src === file && i.entryOrder >= entryOrder)
            .sort((a, b) => b.entryOrder - a.entryOrder)
            .forEach(i => store.put('issue', Object.assign({}, i, { entryOrder: i.entryOrder + 1 })));
        } else entryOrder = store.nextEntryOrder(file, 'issue');
        store.put('issue', Object.assign({}, cur.rec, { issueID: id, titleID, _src: file, entryOrder }));
      });
      setD(makeDraft(store, title, titleID, id, settings));
      setFormKey(k => k + 1);
      SC.session.say('ok', 'Recorded ' + label + '. The next issue is ready.');
    }
    const recordRef = useRef(record);
    recordRef.current = record;
    useEffect(() => {
      const onKey = e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); recordRef.current(); } };
      window.addEventListener('keydown', onKey);
      return () => window.removeEventListener('keydown', onKey);
    }, []);
    // After recording, start typing in the first field of the new draft.
    const first = useRef(true);
    useEffect(() => {
      if (first.current) { first.current = false; return; }
      const el = document.querySelector('.issue-form input[type=text]:not([disabled])');
      window.scrollTo(0, 0);
      if (el) el.focus({ preventScroll: true });
    }, [formKey]);

    const dups = duplicatesOf(rec, issues);
    const hint = volumeHint(issues, rec);
    const unaddressed = unaddressedCount(rec);
    const cadenceName = (N.DATE_MODES.find(m => m[0] === d.cadence) || ['', ''])[1];
    const tools = html`<div class="advance-bar">
      <label class="ctx">Follows
        <select value=${d.baseID} onChange=${e => rebase(e.target.value)}>
          <option value="">nothing: a blank issue</option>
          ${issues.map(i => html`<option value=${i.issueID}>${issueLabel(i)}${issueDate(i) ? ' — ' + issueDate(i) : ''}</option>`)}
        </select></label>
      <span class="adv-opts">Moves on:
        ${[['volume', 'Volume'], ['issue', 'Issue / no.'], ['number', 'Whole no.']].map(([k, l]) =>
          html`<label class="check"><input type="checkbox" checked=${settings[k]} onChange=${e => setOption(k, e.target.checked)} /> ${l}</label>`)}
        <label class="ctx">Date
          <select value=${settings.date} onChange=${e => setOption('date', e.target.value)}>
            <option value="auto">as last time (${cadenceName})</option>
            ${N.DATE_MODES.map(([k, l]) => html`<option value=${k}>${l}</option>`)}
          </select></label></span>
      <button type="button" class="btn small" onClick=${nextVolume} title="Volume +1 and issue number back to 1">Start next volume</button>
    </div>
    ${hint && html`<p class="hint-line">Volume ${hint.prev} ended with no. ${hint.last}, so this may be the first issue of a new volume.
      <button type="button" class="link" onClick=${nextVolume}>Make it vol. ${N.incrementString(rec.volume)}, no. ${N.firstOf(rec.issue) || '1'}</button></p>`}`;

    return html`<section class="editor">
      ${d.offer && html`<div class="message warn" role="status"><span>The new issue you started earlier is kept below, not yet recorded.</span>
        <span><button class="btn small" onClick=${() => setD(Object.assign({}, dref.current, { offer: null }))}>Keep it</button>
        <button class="btn small quiet" onClick=${() => { const w = d.offer; setD(Object.assign({}, dref.current, { touched: false, offer: null })); rebase(w); }}>Start again after ${issueLabel(store.state.issues.get(d.offer) || {})}</button></span></div>`}
      <div class="card entry-card draft-card">
        <p class="draft-tag">New issue${base ? html`, after <a href=${routeHref({ panel: 'issues', titleID, issueID: base.issueID })}>${issueLabel(base)}</a>` : ''}</p>
        <${IssueEntry} rec=${rec} title=${title} idText="IssueID assigned when recorded" />
        <div class="entry-facts">
          <${UnaddressedCount} n=${unaddressed} />
          ${from && from !== base && html`<span>Numbers follow ${issueLabel(from)}, the last regular issue</span>`}
        </div>
      </div>
      <${IssueForm} key=${formKey} rec=${rec} title=${title} onPatch=${onPatch} style=${style} extra=${{ numbering: tools }} />
      <div class="actions sticky-actions">
        <button class="btn primary" onClick=${record} title="Ctrl+Enter or ⌘+Enter">Record issue</button>
        <button class="btn quiet" onClick=${() => rebase(d.baseID)}>Start over</button>
        ${dups.length > 0 && html`<span class="warn-text">Already in the run: ${dups.slice(0, 3).map((i, k) => html`${k ? ', ' : ''}<a href=${routeHref({ panel: 'issues', titleID, issueID: i.issueID })}>${issueLabel(i)}</a>`)}. Record it anyway if this is another copy or state.</span>`}
        ${!dups.length && html`<span class="hint"><kbd>Ctrl</kbd>+<kbd>Enter</kbd> records. Nothing is written to your files until you save.</span>`}
      </div>
    </section>`;
  }

  // ── An existing issue ─────────────────────────────────────────────────
  function IssueEditor({ issue, title, issues }) {
    const store = useStore();
    const style = useMemo(() => N.periodStyle(issues.map(i => i.months)), [issue.titleID, issues.length]);
    const n = store.contentsOfIssue(issue.issueID).length;
    const readOnly = !title;
    const pos = issues.indexOf(issue);
    const onPatch = (patch, label) => store.put('issue', Object.assign({}, issue, patch), label + ' (' + issueLabel(issue) + ')');
    const unaddressed = unaddressedCount(issue);
    const contentsHref = routeHref({ panel: 'contents', titleID: issue.titleID, issueID: issue.issueID });
    function remove() {
      const items = store.contentsOfIssue(issue.issueID);
      if (!confirm('Delete ' + issueLabel(issue) + (items.length ? ' and its ' + plural(items.length, 'contents item') : '') + '? You can undo this until you close the app.')) return;
      const next = issues[pos + 1] || issues[pos - 1];
      store.batch('Delete issue ' + issueLabel(issue), () => {
        items.forEach(c => store.remove('content', c.contentID));
        store.remove('issue', issue.issueID);
      });
      navigate({ panel: 'issues', titleID: issue.titleID, issueID: next ? next.issueID : '' }, true);
    }
    return html`<section class="editor">
      <div class="card entry-card">
        <${IssueEntry} rec=${issue} title=${title} />
        <div class="entry-facts">
          <span>${pos + 1} of ${issues.length} in the run</span>
          <a href=${contentsHref}>${n ? plural(n, 'contents item') : 'No contents yet'}</a>
          <${UnaddressedCount} n=${unaddressed} />
        </div>
      </div>
      ${readOnly && html`<p class="phase-note">This title is not in the Titles file, so its issues can be read here but not changed. Add the title in Library to edit them.</p>`}
      <${IssueForm} rec=${issue} title=${title} onPatch=${onPatch} readOnly=${readOnly} style=${style} />
      <div class="actions sticky-actions">
        ${!readOnly && html`<button class="btn primary" onClick=${() => startDraft(issue.titleID, issue.issueID)}>New issue after this</button>`}
        <a class="btn" href=${contentsHref}>Contents</a>
        ${!readOnly && html`<button class="btn quiet danger" onClick=${remove}>Delete issue</button>`}
        <span class="hint">Changes are kept as you go. Save writes them to your files.</span>
      </div>
    </section>`;
  }

  // Where numbers are missing: the gap before each issue, judged against the regular issue before it.
  const gapsOf = issues => N.runGaps(issues);
  const gapTotal = gaps => Array.from(gaps.values()).reduce((n, g) => n + g.count, 0);

  // The words every short name in the run starts with (usually the title), so the narrow run
  // list can show what tells the issues apart. A numbering word ("No.", "Vol.") stays visible.
  function sharedStart(issues) {
    const names = issues.map(i => i.shortname).filter(Boolean);
    if (names.length < 2) return '';
    let p = names[0];
    names.forEach(n => { while (p && n.indexOf(p) !== 0) p = p.slice(0, -1); });
    const words = p.slice(0, p.lastIndexOf(' ') + 1).split(' ').filter(Boolean);
    while (words.length && /^(no|nos|nr|vol|v|n|i|issue|number|#)\.?$/i.test(words[words.length - 1])) words.pop();
    return words.length ? words.join(' ') + ' ' : '';
  }

  // ── The run ───────────────────────────────────────────────────────────
  function RunList({ titleID, issues, current, canAdd }) {
    const store = useStore();
    const [q, setQ] = useState('');
    const listRef = useRef(null);
    useEffect(() => {
      const el = listRef.current && listRef.current.querySelector('.run-item.on');
      if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
    }, [current, issues.length]);
    const needle = q.trim().toLowerCase();
    const shown = needle ? issues.filter(i => (issueLabel(i) + ' ' + issueDate(i) + ' ' + i.issueID).toLowerCase().indexOf(needle) !== -1) : issues;
    const draft = current === 'new' ? drafts.get(titleID) : null;
    const gaps = useMemo(() => gapsOf(issues), [issues]);
    const start = useMemo(() => sharedStart(issues), [issues]);
    const short = i => { const l = issueLabel(i); return start && l.indexOf(start) === 0 && l.length > start.length ? l.slice(start.length) : l; };
    const draftItem = html`<li key="draft" class="run-item draft on"><a href=${routeHref({ panel: 'issues', titleID, issueID: 'new' })} title=${draft ? issueLabel(draft.rec) : ''}>
      <span class="ri-name">${draft ? short(draft.rec) : 'New issue'}</span><span class="ri-date">not yet recorded</span></a></li>`;
    const items = [];
    shown.forEach(i => {
      const n = store.contentsOfIssue(i.issueID).length;
      const g = !needle && gaps.get(i.issueID);
      if (g) items.push(html`<li key=${'gap-' + i.issueID} class="run-gap" title="Not in the run">${g.label} missing</li>`);
      items.push(html`<li key=${i.issueID} class=${cls('run-item', i.issueID === current && 'on')}>
        <a href=${routeHref({ panel: 'issues', titleID, issueID: i.issueID })} title=${issueLabel(i)}>
          <span class=${cls('ri-name', i.speculative && 'spec')}>${short(i)}</span>
          <span class="ri-date">${issueDate(i)}${i.supplement ? ' · supplement' : ''}${i.specialIssue ? ' · special' : ''}</span>
          <span class=${cls('ri-n', !n && 'zero')} title=${plural(n, 'contents item')}>${n || '—'}</span></a></li>`);
      if (draft && draft.baseID === i.issueID && !needle) items.push(draftItem);
    });
    if (current === 'new' && (!draft || !draft.baseID || needle)) items.push(draftItem);
    return html`<aside class="run" aria-label="Issues of this title">
      <div class="run-head">
        ${start && html`<div class="run-title" title="Every short name in this run begins with this">${start.trim()} …</div>`}
        <div class="run-top"><span class="run-count">${plural(issues.length, 'issue')}${gaps.size ? html`<span class="run-gaps">${plural(gapTotal(gaps), 'number')} missing</span>` : ''}</span>
          ${canAdd && html`<button class="btn primary small" disabled=${current === 'new'} onClick=${() => startDraft(titleID, current)}>New issue</button>`}</div>
        <input type="search" placeholder="Find an issue" value=${q} onInput=${e => setQ(e.target.value)} aria-label="Find an issue" />
      </div>
      <ol class="run-list" ref=${listRef}>${items}</ol>
    </aside>`;
  }

  // ── All issues of a title ─────────────────────────────────────────────
  function IssueOverview({ titleID, title, issues }) {
    const store = useStore();
    const gaps = useMemo(() => gapsOf(issues), [issues]);
    const missing = gapTotal(gaps);
    // Short names that run a Roman numeral into a letter ("VXIIIN2"), as the Beta builder wrote them.
    const fixes = useMemo(() => title ? issues.map(i => [i, N.fixShortName(i.shortname, nameVals(i))]).filter(x => x[1]) : [], [issues, !!title]);
    function fixAll() {
      store.batch('Separate Roman numerals in ' + plural(fixes.length, 'short name'), () =>
        fixes.forEach(([i, name]) => store.put('issue', Object.assign({}, i, { shortname: name }))));
      SC.session.say('ok', 'Rewrote ' + plural(fixes.length, 'short name') + '. Undo puts them back.');
    }
    const col = h => IENT.byHeader.get(h);
    const shown = (i, h, value) => {
      const c = col(h), st = fieldState(i, c);
      if (st.na) return html`<span class="na">n/a</span>`;
      if (value === '' || value == null) return html`<span class="blank">—</span>`;
      return st.spec ? uncertain(value) : value;
    };
    return html`<section>
      <div class="panel-head">
        <h1 class="panel-title">Issues of <cite>${title ? title.canonicalTitle : titleID}</cite></h1>
        ${title && html`<button class="btn primary" onClick=${() => startDraft(titleID, null)}>${issues.length ? 'New issue' : 'Record the first issue'}</button>`}
      </div>
      ${!title && html`<p class="phase-note">This title is not in the Titles file, so its issues can be read here but not changed.</p>`}
      ${fixes.length > 0 && html`<div class="message warn" role="status">
        <span>${plural(fixes.length, 'short name')} run a Roman numeral into the letters beside it, as in <code>${fixes[0][0].shortname}</code>, so the numbers can't be read back.</span>
        <button class="btn small" onClick=${fixAll}>Rewrite ${fixes.length === 1 ? 'it' : 'them'}: <code>${fixes[0][1]}</code>${fixes.length > 1 ? ', …' : ''}</button></div>`}
      <p class="summary">${plural(issues.length, 'issue')}${title && title.knownIssues ? ' of ' + title.knownIssues + ' known' : ''}, in the order of the run${missing ? html`; the numbering suggests <span class="warn-text">${plural(missing, 'issue')} not yet recorded</span>` : ''}.</p>
      ${SC.views.RunStrip && html`<${SC.views.RunStrip} titleID=${titleID} target="issues" />`}
      <div class="table-wrap"><table class="list">
        <thead><tr><th class="num">#</th><th>Short name</th><th class="num">Vol.</th><th class="num">No.</th><th class="num">Whole no.</th><th>Date</th><th class="num">Pages</th><th>Evidence</th><th class="num">Contents</th></tr></thead>
        <tbody>${issues.map((i, n) => html`${gaps.has(i.issueID) && html`<tr key=${'gap-' + i.issueID} class="gap-row"><td></td><td colspan="8">${gaps.get(i.issueID).label} missing</td></tr>`}
          <tr key=${i.issueID} class="row-link" onClick=${() => navigate({ panel: 'issues', titleID, issueID: i.issueID })}>
          <td class="num dim">${n + 1}</td>
          <td>${shown(i, 'Short Name', i.shortname)}${i.issueDesignation && html` <span class="tag">${i.issueDesignation}</span>`}${i.supplement && html` <span class="tag">Supplement${i.supplementLabel ? ': ' + i.supplementLabel : ''}</span>`}</td>
          <td class="num">${shown(i, 'Volume', i.volume)}</td>
          <td class="num">${shown(i, 'Issue', i.issue)}</td>
          <td class="num">${shown(i, 'Whole No.', i.number)}</td>
          <td>${issueDate(i) || html`<span class="blank">—</span>`}</td>
          <td class="num">${shown(i, 'Pages', i.pages)}</td>
          <td>${i.evidence || ''}</td>
          <td class="num">${store.contentsOfIssue(i.issueID).length || ''}</td>
        </tr>`)}</tbody>
      </table>${!issues.length && html`<p class="empty">No issues recorded for this title yet.</p>`}</div>
    </section>`;
  }

  function IssuesPanel({ route }) {
    const store = useStore();
    const tid = route.titleID;
    if (!tid) return html`<section><h1 class="panel-title">Issues</h1><p class="empty">Choose a title above.</p></section>`;
    const title = store.state.titles.get(tid);
    const issues = store.issuesOfTitle(tid);
    if (!title && !issues.length) return html`<section><h1 class="panel-title">Issues</h1><p class="empty">No title ${tid} in this library.</p></section>`;
    const iid = route.issueID;
    if (!iid) return html`<${IssueOverview} titleID=${tid} title=${title} issues=${issues} />`;
    const isNew = iid === 'new';
    const issue = isNew ? null : store.state.issues.get(iid);
    let main;
    if (isNew && !title) main = html`<p class="phase-note">This title is not in the Titles file. Add it in Library before recording issues.</p>`;
    else if (isNew) main = html`<${IssueDraft} key=${'draft-' + tid + '-' + draftEpoch} titleID=${tid} title=${title} issues=${issues} />`;
    else if (!issue) main = html`<p class="empty">No issue ${iid} in this title.</p>`;
    else main = html`<${IssueEditor} key=${iid} issue=${issue} title=${title} issues=${issues} />`;
    return html`<div class="issues-layout">
      <${RunList} titleID=${tid} issues=${issues} current=${iid} canAdd=${!!title} />
      <div class="issue-main">${main}</div>
    </div>`;
  }

  SC.views = Object.assign(SC.views || {}, { IssuesPanel, IssueEntry });
})(globalThis.SC = globalThis.SC || {});

</script>
<script>/* js/ui/contents.js */
/* Slaughter Cataloger 3 — Stage 3: Contents.
   The table of contents of one issue as an editable list, in Sequence order.
   Nesting shows as indentation (Parent ContentID). Typing in the empty row at the
   end adds an item; Enter moves down a row; pasted lines become items. Sequence
   numbers are kept 1..n as items are added, moved and deleted. */
(function (SC) {
  'use strict';
  const { html, useState, useEffect, useRef, useMemo, useStore, navigate, routeHref, plural, cls, fieldState, toggleState, issueLabel, issueDate } = SC.ui;
  const S = SC.schema, R = SC.records, ids = SC.ids, T = SC.toc;
  const CENT = S.entities.content;
  const PARENT = CENT.byKey.get('parentItem').header;
  const COLS = T.COLS;                                   // itemTitle, author, contentType, startPage, endPage, notes
  // Text columns wrap; page numbers are one short line.
  const MULTILINE = { itemTitle: true, author: true, contentType: true, notes: true };
  const COMPLETES = { author: 'authors', contentType: 'types' };

  /* Spreadsheet-style completion: after typing at the end of a cell, the rest of the most used
     matching value is filled in and selected. Typing on replaces it; Backspace removes it. */
  function complete(el, list, inputType) {
    if (!list || !/^insert/.test(inputType || '') || el.selectionStart !== el.value.length) return false;
    const typed = el.value;
    if (!typed.trim()) return false;
    const low = typed.toLowerCase();
    const hit = list.find(x => x.length > typed.length && x.toLowerCase().indexOf(low) === 0);
    if (!hit) return false;
    el.value = hit;
    el.setSelectionRange(typed.length, hit.length);
    return true;
  }
  const TYPES = ['article', 'editorial', 'editorial note', 'letter', 'poem', 'review', 'notice', 'advertisement', 'illustration', 'essay', 'fiction',
    'translation', 'quotation', 'aphorism', 'report', 'obituary', 'announcement', 'section', 'department', 'masthead', 'contents listing', 'bibliography', 'footnote'];

  // Authors and content types already used, most frequent first: this title's, then the library's.
  function suggestions(store, titleID) {
    const count = (m, v) => { v = String(v || '').trim(); if (v) m.set(v, (m.get(v) || 0) + 1); };
    const types = new Map(), lib = new Map(), own = new Map();
    store.state.contents.forEach(c => { count(types, c.contentType); count(lib, c.author); });
    store.contentsOfTitle(titleID).forEach(c => count(own, c.author));
    const top = (m, n) => Array.from(m.entries()).sort((a, b) => b[1] - a[1]).slice(0, n).map(e => e[0]);
    const t = new Set(top(types, 300)); TYPES.forEach(x => t.add(x));
    const a = new Set(top(own, 500)); top(lib, 1500).forEach(x => { if (a.size < 1500) a.add(x); });
    return { types: Array.from(t), authors: Array.from(a) };
  }

  // The focused cell, shared with the toolbar without redrawing the whole list on every focus.
  const focusBus = { cur: null, fns: new Set(), set(v) { this.cur = v; this.fns.forEach(f => f(v)); } };
  function focusCell(rowKey, col, caretAtStart) {
    setTimeout(() => {
      const el = document.querySelector('[data-cell="' + rowKey + ':' + col + '"]');
      if (!el) return;
      el.focus();
      if (el.setSelectionRange && typeof el.value === 'string') { const p = caretAtStart ? 0 : el.value.length; try { el.setSelectionRange(p, p); } catch (e) { /* not a text field */ } }
    }, 0);
  }

  // ── One editable cell ─────────────────────────────────────────────────
  function Cell(p) {
    const str = v => v == null ? '' : String(v);
    // As in the form fields: shows the record's value unless the person is typing, and only typing is committed.
    const [draft, setDraft] = useState(str(p.value));
    const typed = useRef(false);
    const shown = typed.current ? draft : str(p.value);
    const st = p.st || { spec: false, na: false };
    const commit = v => { if (!typed.current) return; typed.current = false; if (v !== str(p.value)) p.onCommit(v); else setDraft(str(p.value)); };
    // Long notes take one line until the cell is in use. Text cells size to their content where the
    // browser can (field-sizing); elsewhere the row count is estimated.
    const [focused, setFocused] = useState(false);
    const clip = p.col === 'notes' && !focused;
    const lines = clip ? 1 : Math.min(8, Math.max(1, Math.ceil(shown.length / 40) + (shown.match(/\n/g) || []).length));
    const props = {
      'data-cell': p.rowKey + ':' + p.col, 'data-sc-field': '', 'data-pending': typed.current && draft !== str(p.value) ? 'true' : undefined,
      'aria-label': p.label, value: st.na ? '' : shown, readOnly: st.na, placeholder: st.na ? 'n/a' : (p.placeholder || ''),
      spellcheck: p.col === 'itemTitle' || p.col === 'notes',
      class: cls('cell', clip && 'clip', st.spec && 'is-spec', st.na && 'is-na', p.unaddressed && !st.spec && !st.na && !shown && 'is-unaddressed'),
      title: clip && shown.length > 24 ? shown : undefined,
      onInput: e => { typed.current = true; complete(e.target, p.complete, e.inputType); setDraft(e.target.value); },
      onFocus: () => { setFocused(true); p.onFocusCell(p.rowKey, p.col); },
      onBlur: e => { setFocused(false); commit(e.target.value); },
      onKeyDown: e => p.onKey(e, { rowKey: p.rowKey, col: p.col, el: e.target, commit: () => commit(e.target.value), revert: () => { typed.current = false; setDraft(str(p.value)); } }),
      onPaste: e => p.onPaste(e, p.rowKey, p.col)
    };
    return MULTILINE[p.col] ? html`<textarea rows=${lines} ...${props}></textarea>`
      : html`<input type="text" autocomplete="off" ...${props} />`;
  }

  const pagesOf = c => { const s = c.startPage, e = c.endPage; return s ? (e && e !== s ? s + '–' + e : s) : ''; };

  // ── The list ──────────────────────────────────────────────────────────
  function ContentsEditor({ issueID, issue, title }) {
    const store = useStore();
    useState(() => { focusBus.cur = null; });            // nothing focused yet in this issue
    const titleID = issue ? issue.titleID : ids.titleIDFromChild(issueID);
    const items = store.contentsOfIssue(issueID);
    const rows = items.map(c => ({ id: c.contentID, parentID: c.parentID }));
    const ds = T.depths(rows);
    const index = new Map(rows.map((r, i) => [r.id, i]));
    const sugg = useMemo(() => suggestions(store, titleID), [titleID, store.state.contents.size]);
    const pending = useRef(new Set());
    const mint = () => { const id = ids.newContentID(titleID, x => store.state.contents.has(x) || pending.current.has(x)); pending.current.add(id); return id; };
    const [endDraft, setEndDraft] = useState(() => ({ id: mint(), depth: 0 }));
    const [insert, setInsert] = useState(null);           // { id, afterId, depth }: an empty row opened below an item
    const [bulk, setBulk] = useState(false);

    // Row keys in display order, for moving up and down.
    const insertAt = insert && index.has(insert.afterId) ? T.insertIndex(rows, index.get(insert.afterId)) : -1;
    const keys = rows.map(r => r.id);
    if (insertAt !== -1) keys.splice(insertAt, 0, insert.id);
    keys.push(endDraft.id);
    const keysRef = useRef(keys); keysRef.current = keys;
    const stateRef = useRef(); stateRef.current = { items, rows, ds, index, insert, insertAt, endDraft };

    // ── changes ──
    function renumber(order) {
      order.forEach((id, k) => {
        const c = store.state.contents.get(id);
        const want = String(k + 1);
        if (c && c.sequence !== want) store.put('content', Object.assign({}, c, { sequence: want }));
      });
    }
    // Insert new items at position pos (0..n) at depth; parsed = [{ values, depth }].
    function insertMany(pos, depth, parsed, label, firstId) {
      const { rows: cur } = stateRef.current;
      const file = store.fileForNew('content', titleID);
      const why = store.blocked(file); if (why) { SC.session.say('error', why); return null; }
      const list = cur.slice();
      const made = [];
      parsed.forEach((p, k) => {
        const id = k === 0 && firstId ? firstId : mint();
        const at = pos + k;
        const parentID = T.parentFor(list, at, depth + (p.depth || 0));
        list.splice(at, 0, { id, parentID });
        made.push({ id, parentID, values: p.values });
      });
      store.batch(label, () => {
        let eo = store.nextEntryOrder(file, 'content');
        made.forEach(m => {
          const parent = m.parentID && store.state.contents.get(m.parentID);
          const madeParent = !parent && m.parentID && made.find(x => x.id === m.parentID);
          const rec = { contentID: m.id, issueID, titleID, issueRef: '', parentID: m.parentID || '', sequence: '', itemTitle: '', author: '', contentType: '',
            parentItem: parent ? parent.itemTitle : madeParent ? (madeParent.values.itemTitle || '') : '', startPage: '', endPage: '', notes: '',
            spec: [], na: m.parentID ? [] : [PARENT], speculative: false, _src: file, entryOrder: eo++ };
          Object.keys(m.values).forEach(k => { rec[k] = String(m.values[k]); });
          rec.sequence = String(list.findIndex(r => r.id === m.id) + 1);
          store.put('content', rec);
        });
        renumber(list.map(r => r.id));
      });
      made.forEach(m => pending.current.delete(m.id));
      return made;
    }
    // A draft row gets its first value: it becomes an item.
    function createFrom(rowKey, col, v) {
      const s = stateRef.current;
      const isEnd = rowKey === s.endDraft.id;
      const pos = isEnd ? s.items.length : s.insertAt;
      const depth = isEnd ? s.endDraft.depth : s.insert.depth;
      insertMany(pos, depth, [{ values: { [col]: v }, depth: 0 }], 'Add item' + (col === 'itemTitle' ? ' ' + v : ''), rowKey);
      if (isEnd) setEndDraft({ id: mint(), depth: s.endDraft.depth }); else setInsert(null);
    }
    function edit(c, col, v) {
      if (typeof v === 'string' && col !== 'notes') v = v.replace(/\s+$/, '');
      store.put('content', Object.assign({}, c, { [col]: v }), 'Edit ' + CENT.byKey.get(col).label.toLowerCase() + (c.itemTitle ? ' (' + c.itemTitle.slice(0, 40) + ')' : ''));
    }
    function setParents(changes, label) {
      store.batch(label, () => Object.keys(changes).forEach(id => {
        const c = store.state.contents.get(id);
        const p = changes[id] && store.state.contents.get(changes[id]);
        const na = (c.na || []).filter(h => h !== PARENT);
        if (!p) na.push(PARENT);
        store.put('content', Object.assign({}, c, { parentID: p ? p.contentID : '', parentKept: '', parentItem: p ? p.itemTitle : '', na: R.orderStates(CENT, na) }));
      }));
    }
    function toggleCell(rowKey, col, which) {
      const c = store.state.contents.get(rowKey);
      const column = CENT.byKey.get(col);
      if (!c || !column.states || (which === 'na' && column.noNA)) return;
      store.put('content', Object.assign({}, c, toggleState(CENT, c, column, which)), (which === 'spec' ? 'Mark ? on ' : 'Mark N/A on ') + column.label.toLowerCase());
    }
    function rowAction(action, rowKey, col) {
      const s = stateRef.current;
      const i = s.index.has(rowKey) ? s.index.get(rowKey) : -1;
      if (i === -1) {                                     // a draft row: only its depth can change
        const prevDepth = s.rows.length ? s.ds[(rowKey === s.endDraft.id ? s.rows.length : s.insertAt) - 1] : undefined;
        const set = (d) => rowKey === s.endDraft.id ? setEndDraft(Object.assign({}, s.endDraft, { depth: d })) : setInsert(Object.assign({}, s.insert, { depth: d }));
        const cur = rowKey === s.endDraft.id ? s.endDraft.depth : s.insert && s.insert.depth;
        if (action === 'indent' && prevDepth !== undefined && cur <= prevDepth) set(cur + 1);
        if (action === 'outdent' && cur > 0) set(cur - 1);
        return;
      }
      const c = s.items[i];
      const name = c.itemTitle ? ' ' + c.itemTitle.slice(0, 40) : '';
      if (action === 'indent' || action === 'outdent') {
        const ch = action === 'indent' ? T.indent(s.rows, i) : T.outdent(s.rows, i);
        if (ch) setParents(ch, (action === 'indent' ? 'Nest' : 'Un-nest') + name);
      } else if (action === 'up' || action === 'down') {
        const order = action === 'up' ? T.moveUp(s.rows, i) : T.moveDown(s.rows, i);
        if (order) store.batch('Move' + name, () => renumber(order));
      } else if (action === 'insert') {
        const id = mint();
        setInsert({ id, afterId: rowKey, depth: s.ds[i] });
        focusCell(id, col || 'itemTitle');
        return;
      } else if (action === 'delete') {
        const end = T.subtreeEnd(s.ds, i);
        const gone = s.items.slice(i, end + 1);
        if (gone.length > 1 && !confirm('Delete "' + (c.itemTitle || 'this item') + '" and the ' + plural(gone.length - 1, 'item') + ' nested in it? You can undo this.')) return;
        const next = keysRef.current[keysRef.current.indexOf(gone[gone.length - 1].contentID) + 1];
        store.batch('Delete' + name, () => {
          gone.forEach(g => store.remove('content', g.contentID));
          renumber(s.items.filter(x => gone.indexOf(x) === -1).map(x => x.contentID));
        });
        if (next) focusCell(next, col || 'itemTitle');
        return;
      }
      focusCell(rowKey, col || 'itemTitle');
    }
    function moveFocus(rowKey, col, dir) {
      setTimeout(() => {
        const ks = keysRef.current;
        const k = ks[ks.indexOf(rowKey) + dir];
        if (k) focusCell(k, col, dir < 0);
      }, 0);
    }
    function onKey(e, ctx) {
      const { rowKey, col, el } = ctx;
      const mod = e.ctrlKey || e.metaKey;
      if (e.altKey && e.shiftKey && !mod) {
        const map = { ArrowRight: 'indent', ArrowLeft: 'outdent', ArrowUp: 'up', ArrowDown: 'down' };
        if (map[e.key]) { e.preventDefault(); ctx.commit(); rowAction(map[e.key], rowKey, col); return; }
        if (e.code === 'KeyS' || e.code === 'KeyN') { e.preventDefault(); ctx.commit(); setTimeout(() => toggleCell(rowKey, col, e.code === 'KeyS' ? 'spec' : 'na'), 0); return; }
      }
      if (mod && e.key === 'Enter') { e.preventDefault(); ctx.commit(); if (stateRef.current.index.has(rowKey)) rowAction('insert', rowKey, 'itemTitle'); return; }
      if (e.key === 'Enter' && !e.altKey && !mod) {
        if (e.shiftKey && (col === 'itemTitle' || col === 'notes')) return;   // a line break in a title or note
        e.preventDefault(); ctx.commit(); moveFocus(rowKey, col, e.shiftKey ? -1 : 1); return;
      }
      if (e.key === 'Escape') {
        ctx.revert();
        const s = stateRef.current;
        if (s.insert && s.insert.id === rowKey) { setInsert(null); focusCell(s.insert.afterId, col); }
        return;
      }
      if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !e.altKey && !e.shiftKey && !mod) {
        if (el.tagName === 'TEXTAREA') {
          const atStart = el.selectionStart === 0 && el.selectionEnd === 0, atEnd = el.selectionStart === el.value.length;
          if ((e.key === 'ArrowUp' && !atStart) || (e.key === 'ArrowDown' && !atEnd)) return;
        }
        e.preventDefault(); ctx.commit(); moveFocus(rowKey, col, e.key === 'ArrowDown' ? 1 : -1);
      }
    }
    function onFocusCell(rowKey, col) {
      const s = stateRef.current;
      if (s.insert && rowKey !== s.insert.id) setInsert(null);
      focusBus.set({ rowKey, col });
    }
    function onPaste(e, rowKey, col) {
      const text = ((e.clipboardData || window.clipboardData).getData('text/plain') || '').replace(/\r\n?/g, '\n').replace(/\n+$/, '');
      if (text.indexOf('\n') === -1 && text.indexOf('\t') === -1) return;           // an ordinary paste
      e.preventDefault();
      const s = stateRef.current;
      const parsed = T.parseLines(text, { startCol: col });
      if (!parsed.length) return;
      const i = s.index.has(rowKey) ? s.index.get(rowKey) : -1;
      if (i !== -1 && parsed.length === 1) {                                        // one row of cells: fill this item
        const c = s.items[i];
        store.put('content', Object.assign({}, c, parsed[0].values), 'Paste into' + (c.itemTitle ? ' ' + c.itemTitle.slice(0, 40) : ' item'));
        return;
      }
      const isEnd = rowKey === s.endDraft.id;
      const pos = i !== -1 ? T.insertIndex(s.rows, i) : isEnd ? s.items.length : s.insertAt;
      const depth = i !== -1 ? s.ds[i] : isEnd ? s.endDraft.depth : s.insert.depth;
      const made = insertMany(pos, depth, parsed, 'Paste ' + plural(parsed.length, 'item'), i === -1 ? rowKey : null);
      if (!made) return;
      if (i === -1) { if (isEnd) setEndDraft({ id: mint(), depth: s.endDraft.depth }); else setInsert(null); }
      SC.session.say('ok', 'Added ' + plural(made.length, 'item') + ' from the pasted lines.');
      focusCell(made[made.length - 1].id, col);
    }

    const api = { rowAction, toggleCell, openBulk: () => setBulk(true) };
    const cellProps = { onKey, onFocusCell, onPaste };
    const nested = ds.filter(d => d > 0).length;

    // Draft rows and item rows share one shape, so when a draft row becomes an item
    // the browser keeps the same fields and the cursor stays where it was.
    function row(key, c, depth, seq, elsewhere) {
      return html`<tr key=${key} class=${cls(!c && 'draft-row', depth && 'nested', c && c.speculative && 'has-spec')}>
        <td class="seq dim">${seq}</td>
        ${COLS.map(col => {
          const column = CENT.byKey.get(col);
          const isTitle = col === 'itemTitle';
          const more = col === 'notes' && c && /\n|.{25}/.test(c.notes || '');
          return html`<td class=${cls('c-' + col, more && 'more')} style=${isTitle && depth ? 'padding-left:' + (6 + depth * 22) + 'px' : ''}>
            ${isTitle && depth ? html`<span class="nest-mark" aria-hidden="true">↳</span>` : null}
            <${Cell} rowKey=${key} col=${col} value=${c ? c[col] : ''} st=${c ? fieldState(c, column) : null} unaddressed=${!!c && column.states}
              label=${column.label + (c && c.itemTitle && !isTitle ? ', ' + c.itemTitle.slice(0, 40) : !c ? ', new item' : '')}
              placeholder=${!c && isTitle ? (depth ? 'Nested item' : 'New item') : ''} complete=${COMPLETES[col] && sugg[COMPLETES[col]]}
              onCommit=${c ? (v => edit(store.state.contents.get(key) || c, col, v)) : (v => { if (String(v).trim()) createFrom(key, col, v); })} ...${cellProps} />
            ${isTitle && elsewhere ? html`<div class="item-note">in “${elsewhere.itemTitle}”</div>` : null}</td>`;
        })}
      </tr>`;
    }
    const body = [];
    if (insertAt === 0) body.push(row(insert.id, null, insert.depth, ''));
    items.forEach((c, i) => {
      const depth = ds[i];
      let elsewhere = null;                // a parent that is not the nearest item above at the level above
      if (c.parentID && index.has(c.parentID)) {
        let j = i - 1; while (j >= 0 && ds[j] >= depth) j--;
        if (j < 0 || rows[j].id !== c.parentID) elsewhere = store.state.contents.get(c.parentID);
      }
      body.push(row(c.contentID, c, depth, c.sequence, elsewhere));
      if (insertAt === i + 1) body.push(row(insert.id, null, insert.depth, ''));
    });
    body.push(row(endDraft.id, null, endDraft.depth, items.length + 1));

    return html`<div>
      <${Toolbar} api=${api} store=${store} />
      ${bulk && html`<${BulkAdd} onCancel=${() => setBulk(false)} onAdd=${(parsed) => {
        const made = insertMany(stateRef.current.items.length, 0, parsed, 'Add ' + plural(parsed.length, 'item'));
        if (!made) return;
        setBulk(false);
        SC.session.say('ok', 'Added ' + plural(made.length, 'item') + '.');
      }} />`}
      <div class="table-wrap"><table class="grid-toc">
        <colgroup><col class="w-seq" /><col class="w-title" /><col class="w-author" /><col class="w-type" /><col class="w-pg" /><col class="w-pg" /><col class="w-notes" /></colgroup>
        <thead><tr><th class="seq">Seq</th><th>Item title</th><th>Author / credit</th><th>Type</th><th>Start</th><th>End</th><th>Notes</th></tr></thead>
        <tbody>${body}</tbody>
      </table></div>
      <p class="summary small">${plural(items.length, 'item')}${nested ? ', ' + nested + ' nested' : ''}. Type in the last row to add an item; paste several lines to add several.</p>
    </div>`;
  }

  // ── Toolbar for the focused row and cell ──────────────────────────────
  function Toolbar({ api, store }) {
    const [f, setF] = useState(focusBus.cur);
    useEffect(() => { const fn = v => setF(v); focusBus.fns.add(fn); return () => focusBus.fns.delete(fn); }, []);
    const c = f && store.state.contents.get(f.rowKey);
    const column = f && CENT.byKey.get(f.col);
    const st = c && column ? fieldState(c, column) : { spec: false, na: false };
    const keep = e => e.preventDefault();                 // keep the cursor in the cell
    const act = a => () => f && api.rowAction(a, f.rowKey, f.col);
    const b = (label, onClick, title, opts) => html`<button type="button" class=${cls('btn small', opts && opts.on && 'on', opts && opts.cls)} onMouseDown=${keep} onClick=${onClick}
      disabled=${opts && opts.disabled} title=${title} aria-pressed=${opts && opts.on !== undefined ? !!opts.on : undefined}>${label}</button>`;
    return html`<div class="grid-tools" role="toolbar" aria-label="Item tools">
      <span class="gt-where">${c ? html`Item ${c.sequence}${column ? html` · <strong>${column.label}</strong>` : ''}` : f ? 'New item' : 'Click a cell'}</span>
      <span class="gt-group">
        ${b('?', () => c && api.toggleCell(c.contentID, f.col, 'spec'), 'Speculative: inferred or uncertain (Alt+Shift+S)', { disabled: !c || !column.states, on: st.spec, cls: 'tog-btn spec' })}
        ${b('N/A', () => c && api.toggleCell(c.contentID, f.col, 'na'), 'Not applicable (Alt+Shift+N)', { disabled: !c || !column.states || column.noNA, on: st.na, cls: 'tog-btn' })}
      </span>
      <span class="gt-group">
        ${b('Nest →', act('indent'), 'Make it part of the item above (Alt+Shift+→)', { disabled: !f })}
        ${b('← Un-nest', act('outdent'), 'Move it out a level (Alt+Shift+←)', { disabled: !f })}
        ${b('↑', act('up'), 'Move up (Alt+Shift+↑)', { disabled: !c })}
        ${b('↓', act('down'), 'Move down (Alt+Shift+↓)', { disabled: !c })}
        ${b('Insert below', act('insert'), 'Open an empty row below (Ctrl+Enter)', { disabled: !c })}
        ${b('Delete', act('delete'), 'Delete this item (undo with Ctrl+Z)', { disabled: !c, cls: 'quiet danger' })}
      </span>
      <span class="gt-group gt-end">${b('Add several items…', () => api.openBulk(), 'Paste or type a whole table of contents')}</span>
    </div>`;
  }

  // ── Add several items at once ─────────────────────────────────────────
  function BulkAdd({ onAdd, onCancel }) {
    const [text, setText] = useState('');
    const [opts, setOpts] = useState({ pages: true, by: false, nest: false });
    const parsed = useMemo(() => T.parseLines(text, opts), [text, opts.pages, opts.by, opts.nest]);
    const opt = (k, label) => html`<label class="check"><input type="checkbox" checked=${opts[k]} onChange=${e => setOpts(Object.assign({}, opts, { [k]: e.target.checked }))} /> ${label}</label>`;
    return html`<div class="card bulk">
      <h2>Add several items</h2>
      <p class="hint">One item per line, in order; they are added after the last item. Columns copied from a spreadsheet (separated by tabs) go to title, author, type, start page, end page and notes.</p>
      <textarea class="bulk-text" rows="8" value=${text} onInput=${e => setText(e.target.value)} placeholder=${'The Ego and His Own ........ 3\nA Plea for Anarchy, by H. Seymour ........ 7\nNotes  12'}></textarea>
      <div class="bulk-opts">${opt('pages', 'Page numbers at the end of a line')}${opt('by', 'Split “…, by Author”')}${opt('nest', 'Two leading spaces nest an item')}</div>
      ${parsed.length > 0 && html`<div class="table-wrap bulk-preview"><table class="list">
        <thead><tr><th class="num">#</th><th>Item title</th><th>Author / credit</th><th>Type</th><th class="num">Pages</th><th>Notes</th></tr></thead>
        <tbody>${parsed.slice(0, 60).map((p, k) => html`<tr><td class="num dim">${k + 1}</td>
          <td style=${p.depth ? 'padding-left:' + (10 + p.depth * 20) + 'px' : ''}>${p.depth ? '↳ ' : ''}${p.values.itemTitle || ''}</td><td>${p.values.author || ''}</td><td>${p.values.contentType || ''}</td>
          <td class="num">${pagesOf(p.values)}</td><td>${p.values.notes || ''}</td></tr>`)}</tbody></table>
        ${parsed.length > 60 && html`<p class="hint">…and ${parsed.length - 60} more.</p>`}</div>`}
      <div class="actions">
        <button class="btn primary" disabled=${!parsed.length} onClick=${() => onAdd(parsed)}>${parsed.length ? 'Add ' + plural(parsed.length, 'item') : 'Add items'}</button>
        <button class="btn quiet" onClick=${onCancel}>Cancel</button>
      </div>
    </div>`;
  }

  // ── Choosing an issue ─────────────────────────────────────────────────
  function IssuePicker({ titleID, issues }) {
    const store = useStore();
    // Contents whose issue is not in any Issues file can still be opened.
    const orphans = Array.from(new Set(store.contentsOfTitle(titleID).map(c => c.issueID).filter(id => id && !store.state.issues.has(id))));
    return html`<div class="table-wrap"><table class="list">
      <thead><tr><th class="num">#</th><th>Issue</th><th>Date</th><th class="num">Contents</th></tr></thead>
      <tbody>${issues.map((i, n) => html`<tr key=${i.issueID} class="row-link" onClick=${() => navigate({ panel: 'contents', titleID, issueID: i.issueID })}>
